<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Test - Pioneers Prep</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8fafc; margin: 0; padding: 15px; box-sizing: border-box; }
        body.rtc-stream-active {
            align-items: flex-start !important;
        }
        body.rtc-stream-active #quiz-screen {
            margin-top: 185px !important;
        }
        .live-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; text-transform: uppercase;}
        .opt-btn { width: 100%; padding: 15px; margin: 8px 0; border: 2px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; font-size: 16px; transition: 0.2s;}
        .opt-btn.locked { opacity: 0.6; cursor: not-allowed; }
        .opt-btn.selected { border-color: #4285f4; background-color: #eff6ff; font-weight: bold; }

        /* Student Draggable Video Box & 1-Click Call Button */
        #student-pip-box {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 210px;
            background: #0f172a;
            border: 2px solid #2563eb;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 9995;
            display: none;
            flex-direction: column;
            touch-action: none;
            user-select: none;
        }
        @media (max-width: 600px) {
            #student-pip-box {
                width: 175px;
                top: 10px;
                right: 10px;
            }
        }
        #student-pip-header {
            background: #1e293b;
            color: #f8fafc;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 10px;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #student-pip-header:active { cursor: grabbing; }
        #student-video-stage {
            position: relative;
            width: 100%;
            height: 112px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 600px) {
            #student-video-stage { height: 96px; }
        }
        #student-remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            transform: scaleX(-1);
            will-change: contents;
        }
        #student-video-placeholder {
            color: #94a3b8;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            padding: 8px;
        }
        #btn-unmute-hint {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(245, 158, 11, 0.95);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            white-space: nowrap;
        }
        #student-pip-controls {
            padding: 6px;
            background: #0f172a;
            display: flex;
            gap: 6px;
        }
        #btn-student-call {
            width: 100%;
            padding: 7px 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            background: #10b981;
            color: white;
        }
        #btn-student-call.on-call {
            background: #ef4444;
        }
        /* Left-Aligned Large Presentation Stage with Dedicated Right-Side Space for Draggable PIP */
        body.rtc-presentation-active {
            justify-content: flex-start !important;
            align-items: flex-start !important;
            padding: 12px 16px !important;
        }
        body.rtc-presentation-active #presentation-screen {
            margin-top: 0 !important;
            margin-left: 0 !important;
            margin-right: auto !important;
            width: calc(100vw - 250px) !important;
            max-width: calc(100vw - 250px) !important;
        }
        #presentation-screen {
            display: none;
            width: 100%;
            background: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
            box-sizing: border-box;
        }
        #presentation-header {
            background: #1e293b;
            color: #f8fafc;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        #student-ppt-video {
            width: 100%;
            height: calc(100vh - 68px);
            max-height: 88vh;
            object-fit: contain;
            background: #000;
            display: block;
            transform: none !important; /* Keep PPT text un-mirrored */
        }
        @media (max-width: 768px) {
            body.rtc-presentation-active #presentation-screen {
                margin-top: 175px !important;
                width: 100% !important;
                max-width: 100% !important;
            }
            #student-ppt-video {
                height: auto;
                max-height: 68vh;
            }
        }
        /* Step 3: Simultaneous PPT + Question Card Split-Screen Layout */
        body.rtc-both-active {
            justify-content: flex-start !important;
            align-items: flex-start !important;
            gap: 16px !important;
            padding: 12px 16px !important;
            flex-wrap: wrap !important;
        }
        body.rtc-both-active #presentation-screen {
            display: block !important;
            width: calc(60vw - 24px) !important;
            max-width: calc(60vw - 24px) !important;
            margin: 0 !important;
        }
        body.rtc-both-active #quiz-screen {
            display: block !important;
            width: calc(40vw - 28px) !important;
            max-width: calc(40vw - 28px) !important;
            margin-top: 175px !important;
        }
        @media (max-width: 960px) {
            body.rtc-both-active #presentation-screen {
                margin-top: 175px !important;
                width: 100% !important;
                max-width: 100% !important;
            }
            body.rtc-both-active #quiz-screen {
                margin-top: 12px !important;
                width: 100% !important;
                max-width: 100% !important;
            }
        }
        @media print {
            #student-pip-box { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="auth-screen" class="live-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="color: #2563eb; margin: 0;">🚪 Join Room</h2>
            <button id="refresh-rooms-btn" type="button" style="background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;">🔄 Refresh</button>
        </div>
        <p style="color: #64748b; font-size: 14px; margin-top: 0; margin-bottom: 18px;">Select an active classroom below to join the live session immediately:</p>
        <div id="live-rooms-list" style="display: flex; flex-direction: column; gap: 10px; text-align: left;">
            <div style="padding: 18px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; text-align: center; color: #64748b; font-weight: bold;">
                Loading available rooms...
            </div>
        </div>
    </div>
<!-- Live PowerPoint Presentation Screen -->
    <!-- Live PowerPoint Presentation Screen -->
    <div id="presentation-screen">
        <div id="presentation-header">
            <span>🖥️ Live Presentation Broadcast</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="color: #34d399;">● LIVE SLIDES</span>
                <button id="btn-ppt-fullscreen" type="button" title="Go Fullscreen" style="background: #2563eb; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                    ⛶ Fullscreen
                </button>
            </div>
        </div>
        <video id="student-ppt-video" autoplay playsinline muted></video>
    </div>
    <div id="quiz-screen" class="live-container" style="display: none;">
        <div style="display: flex; justify-content: space-between; color: #64748b; margin-bottom: 20px; font-weight: bold;">
            <span id="live-status">Waiting for Admin...</span>
            <span id="live-progress">Q: -/-</span>
        </div>
        <h3 id="question-text" style="font-size: 20px; color: #1e293b; margin-bottom: 25px; text-align: left;"></h3>
        <div id="options-container" style="text-align: left;"></div>
    </div>

    <!-- Draggable Instructor Video Feed & 1-Click Call Button -->
    <div id="student-pip-box" class="no-print">
        <div id="student-pip-header">
            <span>⠿ Drag Video</span>
            <span style="color: #34d399;">● LIVE HD</span>
        </div>
        <div id="student-video-stage">
            <video id="student-remote-video" autoplay playsinline muted></video>
            <div id="student-video-placeholder">🎙️ Live Audio Broadcast</div>
            <button id="btn-unmute-hint" type="button">🔊 Tap to Enable Audio</button>
        </div>
        <div id="student-pip-controls">
            <button id="btn-student-call" type="button">📞 Speak</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/js/livetest.js"></script>
<script>
    (function() {
        const TARGET_SAMPLE_RATE = 24000;
        let studentAudioCtx = null;
        let rtcOpusAudioEl = null;
        let isRtcOpusFlowing = false;

        let lastAdminAudioSeq = 0;
        let hasSyncedInitialSeq = false;
        let nextAdminPlayTime = 0;
        let lastAdminChunkEndMs = 0;
        let lastAdminAudioPlayedMs = 0;
        const activeAdminNodes = [];
        let isPulling = false;

        let studentPc = null;
        let isJoiningRtc = false;
        let joinStartedAt = 0;
        let disconnectedSince = 0;
        let currentOfferId = null;
        let hasSentCurrentOffer = false;

        let isCallActive = false;
        let isCallPushing = false;
        let studentMicStream = null;
        let studentMicSource = null;
        let studentMicProcessor = null;
        let studentSilentSink = null;
        let pendingCallSamples = [];
        let studentPreRollBuffers = [];
        let callPushInterval = null;
        let studentActivelySpeakingUntil = 0;
        let studentNoiseFloorRms = 0.0025;
        let studentGateGain = 0.0;

        const pipBox = document.getElementById('student-pip-box');
        const remoteVideo = document.getElementById('student-remote-video');
        const pptVideo = document.getElementById('student-ppt-video');
        const presentationScreen = document.getElementById('presentation-screen');
        const fullscreenBtn = document.getElementById('btn-ppt-fullscreen');
        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (presentationScreen.requestFullscreen) {
                        presentationScreen.requestFullscreen();
                    } else if (presentationScreen.webkitRequestFullscreen) {
                        presentationScreen.webkitRequestFullscreen();
                    }
                    fullscreenBtn.textContent = '✕ Exit Fullscreen';
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                    fullscreenBtn.textContent = '⛶ Fullscreen';
                }
            });
        }
        const quizScreen = document.getElementById('quiz-screen');
        const videoPlaceholder = document.getElementById('student-video-placeholder');
        const unmuteHintBtn = document.getElementById('btn-unmute-hint');
        const callBtn = document.getElementById('btn-student-call');

        function getStudentAudioDestination() {
            if (!studentAudioCtx) {
                studentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return studentAudioCtx.destination;
        }

        function ensureStudentAudioCtx() {
            if (!studentAudioCtx) {
                studentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (studentAudioCtx.state === 'suspended') {
                studentAudioCtx.resume().then(() => {
                    unmuteHintBtn.style.display = 'none';
                }).catch(() => {});
            } else {
                unmuteHintBtn.style.display = 'none';
            }
            if (rtcOpusAudioEl && rtcOpusAudioEl.paused && rtcOpusAudioEl.srcObject) {
                rtcOpusAudioEl.play().then(() => {
                    isRtcOpusFlowing = true;
                    unmuteHintBtn.style.display = 'none';
                }).catch(() => {});
            }
        }

        document.addEventListener('pointerdown', ensureStudentAudioCtx);
        unmuteHintBtn.addEventListener('click', ensureStudentAudioCtx);

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                teardownStream();
            }
        });

        (function makeDraggable(boxEl, handleEl) {
            let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

            handleEl.addEventListener('pointerdown', (e) => {
                isDragging = true;
                handleEl.setPointerCapture(e.pointerId);
                const rect = boxEl.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = rect.left;
                initialTop = rect.top;
                boxEl.style.bottom = 'auto';
                boxEl.style.right = 'auto';
                boxEl.style.left = initialLeft + 'px';
                boxEl.style.top = initialTop + 'px';
            });

            handleEl.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const maxLeft = window.innerWidth - boxEl.offsetWidth;
                const maxTop = window.innerHeight - boxEl.offsetHeight;
                boxEl.style.left = Math.max(0, Math.min(maxLeft, initialLeft + dx)) + 'px';
                boxEl.style.top = Math.max(0, Math.min(maxTop, initialTop + dy)) + 'px';
            });

            handleEl.addEventListener('pointerup', (e) => {
                isDragging = false;
                handleEl.releasePointerCapture(e.pointerId);
            });
        })(pipBox, document.getElementById('student-pip-header'));

        function downsampleClean(float32Arr, inputRate, outputRate) {
            if (inputRate === outputRate) {
                const out = new Int16Array(float32Arr.length);
                for (let i = 0; i < float32Arr.length; i++) {
                    let s = Math.max(-1, Math.min(1, float32Arr[i]));
                    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                return out;
            }
            const ratio = inputRate / outputRate;
            const newLen = Math.round(float32Arr.length / ratio);
            const result = new Int16Array(newLen);

            for (let i = 0; i < newLen; i++) {
                const pos = i * ratio;
                const idx = Math.floor(pos);
                const frac = pos - idx;
                const s0 = float32Arr[idx] || 0;
                const s1 = float32Arr[Math.min(float32Arr.length - 1, idx + 1)] || s0;
                let sample = s0 + frac * (s1 - s0);
                sample = Math.max(-1, Math.min(1, sample));
                result[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            }
            return result;
        }

        function int16ToBase64(int16Arr) {
            const bytes = new Uint8Array(int16Arr.buffer, int16Arr.byteOffset, int16Arr.byteLength);
            let binary = '';
            const chunkSize = 4096;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        function stopAllPcmNodes() {
            while (activeAdminNodes.length > 0) {
                const oldNode = activeAdminNodes.shift();
                try { oldNode.stop(); } catch (e) {}
            }
        }

        const room = new LivekitClient.Room();

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
        if (track.kind === 'video') {
            if (publication.trackName === 'screen') {
                track.attach(document.getElementById('student-ppt-video'));
            } else {
                track.attach(document.getElementById('student-remote-video'));
            }
        } else if (track.kind === 'audio') {
            track.attach(document.createElement('audio')); 
        }
    });

    async function connectLiveKit() {
        const res = await fetch(`/api/livekit/token?quizId=${currentQuizId}&studentName=${encodeURIComponent(myName)}`);
        const { token } = await res.json();
        await room.connect('wss://your-livekit-url', token);
    }
    })();
</script>
</body>
</html>
