<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Test - Pioneers Prep</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8fafc; margin: 0; padding: 15px; box-sizing: border-box; }
        body.rtc-stream-active { align-items: flex-start !important; }
        body.rtc-stream-active #quiz-screen { margin-top: 185px !important; }
        .live-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; text-transform: uppercase;}
        .opt-btn { width: 100%; padding: 15px; margin: 8px 0; border: 2px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; font-size: 16px; transition: 0.2s;}
        .opt-btn.locked { opacity: 0.6; cursor: not-allowed; }
        .opt-btn.selected { border-color: #4285f4; background-color: #eff6ff; font-weight: bold; }

        #student-pip-box {
            position: fixed; top: 12px; right: 12px; width: 210px;
            background: #0f172a; border: 2px solid #2563eb; border-radius: 12px;
            overflow: hidden; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 9995; display: none; flex-direction: column; touch-action: none; user-select: none;
        }
        @media (max-width: 600px) { #student-pip-box { width: 175px; top: 10px; right: 10px; } }
        #student-pip-header { background: #1e293b; color: #f8fafc; font-size: 11px; font-weight: bold; padding: 6px 10px; cursor: grab; display: flex; justify-content: space-between; align-items: center; }
        #student-pip-header:active { cursor: grabbing; }
        #student-video-stage { position: relative; width: 100%; height: 112px; background: #000; display: flex; align-items: center; justify-content: center; }
        @media (max-width: 600px) { #student-video-stage { height: 96px; } }
        #student-remote-video { width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); will-change: contents; }
        #student-video-placeholder { color: #94a3b8; font-size: 12px; font-weight: bold; text-align: center; padding: 8px; }
        #btn-unmute-hint {
            position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
            background: rgba(245, 158, 11, 0.95); color: #0f172a; border: none; border-radius: 12px; padding: 4px 10px; font-size: 11px; font-weight: bold; cursor: pointer; display: none; white-space: nowrap;
        }
        #student-pip-controls { padding: 6px; background: #0f172a; display: flex; gap: 6px; }
        #btn-student-call { width: 100%; padding: 7px 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; background: #10b981; color: white; }
        #btn-student-call.on-call { background: #ef4444; }
        
        body.rtc-presentation-active { justify-content: flex-start !important; align-items: flex-start !important; padding: 12px 16px !important; }
        body.rtc-presentation-active #presentation-screen { margin-top: 0 !important; margin-left: 0 !important; margin-right: auto !important; width: calc(100vw - 250px) !important; max-width: calc(100vw - 250px) !important; }
        #presentation-screen { display: none; width: 100%; background: #0f172a; border: 2px solid #3b82f6; border-radius: 12px; overflow: hidden; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35); box-sizing: border-box; }
        #presentation-header { background: #1e293b; color: #f8fafc; padding: 8px 16px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        #student-ppt-video { width: 100%; height: calc(100vh - 68px); max-height: 88vh; object-fit: contain; background: #000; display: block; transform: none !important; }
        @media (max-width: 768px) { body.rtc-presentation-active #presentation-screen { margin-top: 175px !important; width: 100% !important; max-width: 100% !important; } #student-ppt-video { height: auto; max-height: 68vh; } }
        
        body.rtc-both-active { justify-content: flex-start !important; align-items: flex-start !important; gap: 16px !important; padding: 12px 16px !important; flex-wrap: wrap !important; }
        body.rtc-both-active #presentation-screen { display: block !important; width: calc(60vw - 24px) !important; max-width: calc(60vw - 24px) !important; margin: 0 !important; }
        body.rtc-both-active #quiz-screen { display: block !important; width: calc(40vw - 28px) !important; max-width: calc(40vw - 28px) !important; margin-top: 175px !important; }
        @media (max-width: 960px) { body.rtc-both-active #presentation-screen { margin-top: 175px !important; width: 100% !important; max-width: 100% !important; } body.rtc-both-active #quiz-screen { margin-top: 12px !important; width: 100% !important; max-width: 100% !important; } }
        @media print { #student-pip-box { display: none !important; } }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>
    <div id="auth-screen" class="live-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="color: #2563eb; margin: 0;">🚪 Join Room</h2>
            <button id="refresh-rooms-btn" type="button" style="background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;">🔄 Refresh</button>
        </div>
        <p style="color: #64748b; font-size: 14px; margin-top: 0; margin-bottom: 18px;">Select an active classroom below to join the live session immediately:</p>
        <div id="live-rooms-list" style="display: flex; flex-direction: column; gap: 10px; text-align: left;">
            <div style="padding: 18px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; text-align: center; color: #64748b; font-weight: bold;">
                Loading available rooms...
            </div>
        </div>
    </div>

    <div id="presentation-screen">
        <div id="presentation-header">
            <span>🖥️ Live Presentation Broadcast</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="color: #34d399;">● LIVE SLIDES</span>
                <button id="btn-ppt-fullscreen" type="button" title="Go Fullscreen" style="background: #2563eb; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                    ⛶ Fullscreen
                </button>
            </div>
        </div>
        <video id="student-ppt-video" autoplay playsinline muted></video>
    </div>

    <div id="quiz-screen" class="live-container" style="display: none;">
        <div style="display: flex; justify-content: space-between; color: #64748b; margin-bottom: 20px; font-weight: bold;">
            <span id="live-status">Waiting for Admin...</span>
            <span id="live-progress">Q: -/-</span>
        </div>
        <h3 id="question-text" style="font-size: 20px; color: #1e293b; margin-bottom: 25px; text-align: left;"></h3>
        <div id="options-container" style="text-align: left;"></div>
    </div>

    <div id="student-pip-box" class="no-print">
        <div id="student-pip-header">
            <span>⠿ Drag Video</span>
            <span style="color: #34d399;">● LIVE HD</span>
        </div>
        <div id="student-video-stage">
            <video id="student-remote-video" autoplay playsinline muted></video>
            <div id="student-video-placeholder">🎙️ Live Audio Broadcast</div>
            <button id="btn-unmute-hint" type="button">🔊 Tap to Enable Audio</button>
        </div>
        <div id="student-pip-controls">
            <button id="btn-student-call" type="button">📞 Speak</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/js/livetest.js"></script>
    <script>
    const room = new LivekitClient.Room({
        adaptiveStream: false,
        dynacast: false
    });
    let activeAudioEl = null;

    // Strict check: Only allow tracks from the Admin instructor
    function isAdminParticipant(participant) {
        if (!participant) return false;
        const id = String(participant.identity || '').trim().toLowerCase();
        if (id === 'admin' || id.startsWith('admin_')) return true;
        try {
            if (participant.metadata) {
                const meta = JSON.parse(participant.metadata);
                if (meta && meta.role === 'admin') return true;
            }
        } catch (e) {}
        return false;
    }

    // Refuse subscription to any other student's tracks at the SFU transport level
    function blockOtherStudents(participant) {
        if (!participant || isAdminParticipant(participant)) return;
        try {
            participant.trackPublications.forEach((pub) => {
                if (typeof pub.setSubscribed === 'function') {
                    pub.setSubscribed(false);
                }
            });
        } catch (e) {}
    }

    // Helper to keep Admin's voice playing even after mobile/desktop hardware mic switches
    async function ensureAdminAudioPlaying() {
        try { await room.startAudio(); } catch (e) {}
        if (activeAudioEl) {
            activeAudioEl.muted = false;
            activeAudioEl.volume = 1.0;
            activeAudioEl.play().catch(() => {
                const hint = document.getElementById('btn-unmute-hint');
                if (hint) hint.style.display = 'block';
            });
        }
    }

    room.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
        blockOtherStudents(participant);
    });

    room.on(LivekitClient.RoomEvent.TrackPublished, (publication, participant) => {
        if (!isAdminParticipant(participant)) {
            try {
                if (typeof publication.setSubscribed === 'function') {
                    publication.setSubscribed(false);
                }
            } catch (e) {}
        }
    });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
        // BLOCK student-to-student communication completely
        if (!isAdminParticipant(participant)) {
            try {
                if (typeof publication.setSubscribed === 'function') {
                    publication.setSubscribed(false);
                }
            } catch (e) {}
            return;
        }

        if (track.kind === 'video') {
            try {
                if (typeof publication.setVideoQuality === 'function' && LivekitClient.VideoQuality) {
                    publication.setVideoQuality(LivekitClient.VideoQuality.HIGH);
                }
                if (typeof publication.setVideoDimensions === 'function') {
                    publication.setVideoDimensions({ width: 1920, height: 1080 });
                }
                if (typeof publication.setVideoFPS === 'function') {
                    publication.setVideoFPS(publication.trackName === 'screen' ? 15 : 30);
                }
            } catch (e) {}

            if (publication.trackName === 'screen') {
                const pptVideo = document.getElementById('student-ppt-video');
                track.attach(pptVideo);
                pptVideo.play().catch(() => {});
            } else {
                const videoEl = document.getElementById('student-remote-video');
                track.attach(videoEl);
                videoEl.style.display = 'block';
                document.getElementById('student-pip-box').style.display = 'flex';
                document.getElementById('student-video-placeholder').style.display = 'none';
                document.body.classList.add('rtc-stream-active');
            }
        } else if (track.kind === 'audio') {
            if (activeAudioEl) {
                try { activeAudioEl.remove(); } catch (e) {}
            }
            activeAudioEl = document.createElement('audio');
            activeAudioEl.autoplay = true;
            activeAudioEl.playsInline = true;
            track.attach(activeAudioEl);
            document.body.appendChild(activeAudioEl);
            document.getElementById('student-pip-box').style.display = 'flex';

            ensureAdminAudioPlaying();
        }
    });

    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
        if (!isAdminParticipant(participant)) return;

        if (track.kind === 'video') {
            if (publication.trackName === 'screen') {
                document.getElementById('student-ppt-video').srcObject = null;
            } else {
                document.getElementById('student-remote-video').srcObject = null;
                document.getElementById('student-remote-video').style.display = 'none';
                document.getElementById('student-video-placeholder').style.display = 'block';
            }
        } else if (track.kind === 'audio') {
            if (activeAudioEl) {
                try { track.detach(activeAudioEl); activeAudioEl.remove(); } catch (e) {}
                activeAudioEl = null;
            }
        }
    });

    document.getElementById('btn-unmute-hint').addEventListener('click', async (e) => {
        e.target.style.display = 'none';
        await ensureAdminAudioPlaying();
    });

    const fullscreenBtn = document.getElementById('btn-ppt-fullscreen');
    const presentationScreen = document.getElementById('presentation-screen');
    if (fullscreenBtn && presentationScreen) {
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                presentationScreen.requestFullscreen().catch(() => {});
                fullscreenBtn.textContent = '✕ Exit Fullscreen';
            } else {
                document.exitFullscreen().catch(() => {});
                fullscreenBtn.textContent = '⛶ Fullscreen';
            }
        });
    }

    async function connectLiveKit(quizId) {
        try {
            if (room.state === 'connected' || room.state === 'connecting') return;
            const tokenObj = localStorage.getItem('pp_id_token') || "";
            let myName = "Student";
            if (tokenObj) {
                const parts = tokenObj.split('|||')[0].split('|');
                if (parts.length > 2) myName = decodeURIComponent(parts[1] + ' ' + parts[2]);
            }

            const res = await fetch(`/api/livekit/token?quizId=${encodeURIComponent(quizId)}&studentName=${encodeURIComponent(myName)}`);
            if (!res.ok) return;
            const { token } = await res.json();

            await room.connect('wss://pioneers-prep-efmg740j.livekit.cloud:443', token);
            room.remoteParticipants.forEach((p) => blockOtherStudents(p));
            await ensureAdminAudioPlaying();
        } catch (err) {
            console.error("LiveKit connection failed:", err);
        }
    }
    window.connectLiveKit = connectLiveKit;

    setInterval(() => {
        if (typeof testActive !== 'undefined' && testActive && typeof currentQuizId !== 'undefined' && currentQuizId) {
            connectLiveKit(currentQuizId);
        }
    }, 3000);

    let studentMicTrack = null;
    window.studentMutedByAdmin = false;

    window.setStudentAdminMute = async function(isMuted) {
        window.studentMutedByAdmin = Boolean(isMuted);
        const callBtn = document.getElementById('btn-student-call');
        if (window.studentMutedByAdmin) {
            if (studentMicTrack) {
                try {
                    if (room.state === 'connected') {
                        await room.localParticipant.unpublishTrack(studentMicTrack);
                    }
                    studentMicTrack.stop();
                } catch (e) {}
                studentMicTrack = null;
            }
            if (callBtn) {
                callBtn.textContent = '🔇 Muted by Admin';
                callBtn.classList.remove('on-call');
                callBtn.disabled = true;
                callBtn.style.opacity = '0.6';
                callBtn.style.cursor = 'not-allowed';
            }
            await ensureAdminAudioPlaying();
        } else {
            if (callBtn) {
                if (!studentMicTrack) {
                    callBtn.textContent = '📞 Speak';
                    callBtn.classList.remove('on-call');
                }
                callBtn.disabled = false;
                callBtn.style.opacity = '1';
                callBtn.style.cursor = 'pointer';
            }
        }
    };

    window.stopStudentLiveKit = function() {
        try {
            if (studentMicTrack) {
                studentMicTrack.stop();
                studentMicTrack = null;
            }
        } catch (e) {}
        try { room.disconnect(); } catch (e) {}
        if (activeAudioEl) {
            try { activeAudioEl.pause(); activeAudioEl.srcObject = null; activeAudioEl.remove(); } catch (e) {}
            activeAudioEl = null;
        }
        const remoteVid = document.getElementById('student-remote-video');
        if (remoteVid) {
            remoteVid.srcObject = null;
            remoteVid.style.display = 'none';
        }
        const pptVid = document.getElementById('student-ppt-video');
        if (pptVid) pptVid.srcObject = null;
        const pipBox = document.getElementById('student-pip-box');
        if (pipBox) pipBox.remove();
        document.body.classList.remove('rtc-stream-active', 'rtc-presentation-active', 'rtc-both-active');
    };

    document.getElementById('btn-student-call').addEventListener('click', async (e) => {
        if (window.studentMutedByAdmin) {
            alert('You have been muted by the instructor.');
            return;
        }
        if (!studentMicTrack) {
            try {
                if (room.state !== 'connected' && typeof currentQuizId !== 'undefined' && currentQuizId) {
                    await connectLiveKit(currentQuizId);
                }
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                studentMicTrack = stream.getAudioTracks()[0];
                await room.localParticipant.publishTrack(studentMicTrack, { name: 'student_mic' });
                e.target.textContent = '🔴 Mute Mic';
                e.target.classList.add('on-call');
                // Resume Admin audio immediately in case hardware mic activation paused output
                await ensureAdminAudioPlaying();
            } catch (err) {
                alert('Mic access denied');
            }
        } else {
            try {
                if (room.state === 'connected') {
                    await room.localParticipant.unpublishTrack(studentMicTrack);
                }
                studentMicTrack.stop();
            } catch (err) {}
            studentMicTrack = null;
            e.target.textContent = '📞 Speak';
            e.target.classList.remove('on-call');
            // Resume Admin audio immediately after releasing hardware mic
            await ensureAdminAudioPlaying();
        }
    });

    const boxEl = document.getElementById('student-pip-box');
    const handleEl = document.getElementById('student-pip-header');
    let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0;
    handleEl.addEventListener('pointerdown', (e) => {
        isDragging = true; handleEl.setPointerCapture(e.pointerId);
        const rect = boxEl.getBoundingClientRect();
        startX = e.clientX; startY = e.clientY;
        initialLeft = rect.left; initialTop = rect.top;
        boxEl.style.bottom = 'auto'; boxEl.style.right = 'auto';
        boxEl.style.left = initialLeft + 'px'; boxEl.style.top = initialTop + 'px';
    });
    handleEl.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        boxEl.style.left = Math.max(0, Math.min(window.innerWidth - boxEl.offsetWidth, initialLeft + (e.clientX - startX))) + 'px';
        boxEl.style.top = Math.max(0, Math.min(window.innerHeight - boxEl.offsetHeight, initialTop + (e.clientY - startY))) + 'px';
    });
    handleEl.addEventListener('pointerup', (e) => { isDragging = false; handleEl.releasePointerCapture(e.pointerId); });
</script>
</body>
</html>
