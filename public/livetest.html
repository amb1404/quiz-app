<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Test - Pioneers Prep</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8fafc; margin: 0; padding: 15px; box-sizing: border-box; }
        /* Guarantees the top-right video box never overlaps #quiz-screen on mobile or desktop */
        body.rtc-stream-active {
            align-items: flex-start !important;
        }
        body.rtc-stream-active #quiz-screen {
            margin-top: 185px !important;
        }
        .live-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; text-transform: uppercase;}
        .opt-btn { width: 100%; padding: 15px; margin: 8px 0; border: 2px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; font-size: 16px; transition: 0.2s;}
        .opt-btn.locked { opacity: 0.6; cursor: not-allowed; }
        .opt-btn.selected { border-color: #4285f4; background-color: #eff6ff; font-weight: bold; }

        /* Student Draggable Video Box & 1-Click Call Button */
        #student-pip-box {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 210px;
            background: #0f172a;
            border: 2px solid #2563eb;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 9995;
            display: none;
            flex-direction: column;
            touch-action: none;
            user-select: none;
        }
        @media (max-width: 600px) {
            #student-pip-box {
                width: 175px;
                top: 10px;
                right: 10px;
            }
        }
        #student-pip-header {
            background: #1e293b;
            color: #f8fafc;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 10px;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #student-pip-header:active { cursor: grabbing; }
        #student-video-stage {
            position: relative;
            width: 100%;
            height: 112px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 600px) {
            #student-video-stage { height: 96px; }
        }
        #student-remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        #student-video-placeholder {
            color: #94a3b8;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            padding: 8px;
        }
        #btn-unmute-hint {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(245, 158, 11, 0.95);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            white-space: nowrap;
        }
        #student-pip-controls {
            padding: 6px;
            background: #0f172a;
            display: flex;
            gap: 6px;
        }
        #btn-student-call {
            width: 100%;
            padding: 7px 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            background: #10b981;
            color: white;
        }
        #btn-student-call.on-call {
            background: #ef4444;
        }
        @media print {
            #student-pip-box { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="auth-screen" class="live-container">
        <h2 style="color: #4285f4;">Join Live Mock Test</h2>
        <select id="live-quiz-id" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #e2e8f0; border-radius: 6px; box-sizing: border-box; background-color: white; font-weight: bold; color: #1e293b; cursor: pointer;">
            <option value="">Loading Tests...</option>
        </select>

        <script>
            document.addEventListener('DOMContentLoaded', async () => {
                const dropdown = document.getElementById('live-quiz-id');
                if (!dropdown) return;
                
                try {
                    const res = await fetch('/api/live/list');
                    const data = await res.json();
                    
                    if (data.success && data.tests.length > 0) {
                        dropdown.innerHTML = '<option value="">-- Select a Live Test --</option>';
                        data.tests.forEach(test => {
                            const option = document.createElement('option');
                            option.value = test.id;
                            option.textContent = test.title;
                            dropdown.appendChild(option);
                        });
                    } else {
                        dropdown.innerHTML = '<option value="">No Live Tests Available</option>';
                    }
                } catch (e) {
                    dropdown.innerHTML = '<option value="">Error loading tests</option>';
                }
            });
        </script>
        <input type="number" id="live-otp" placeholder="Enter Admin OTP">
        <button id="join-btn" style="width: 100%; padding: 12px; background: #4285f4; color: white; border: none; border-radius: 6px; margin-top: 10px; font-weight: bold; cursor: pointer;">Join Test</button>
    </div>

    <div id="quiz-screen" class="live-container" style="display: none;">
        <div style="display: flex; justify-content: space-between; color: #64748b; margin-bottom: 20px; font-weight: bold;">
            <span id="live-status">Waiting for Admin...</span>
            <span id="live-progress">Q: -/-</span>
        </div>
        <h3 id="question-text" style="font-size: 20px; color: #1e293b; margin-bottom: 25px; text-align: left;"></h3>
        <div id="options-container" style="text-align: left;"></div>
    </div>

    <!-- Draggable Instructor Video Feed & 1-Click Call Button -->
    <div id="student-pip-box" class="no-print">
        <div id="student-pip-header">
            <span>⠿ Drag Video</span>
            <span style="color: #34d399;">● LIVE</span>
        </div>
        <div id="student-video-stage">
            <img id="student-remote-video" alt="Live Instructor Feed">
            <div id="student-video-placeholder">🎙️ Live Audio Broadcast</div>
            <button id="btn-unmute-hint" type="button">🔊 Tap to Enable Audio</button>
        </div>
        <div id="student-pip-controls">
            <button id="btn-student-call" type="button">📞 Call Sir</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/js/livetest.js"></script>
    <script>
    (function() {
        const TARGET_SAMPLE_RATE = 12000;
        let studentAudioCtx = null;
        let lastAdminAudioSeq = 0;
        let nextAdminPlayTime = 0;
        let isPulling = false;

        let isCallActive = false;
        let studentMicStream = null;
        let studentMicSource = null;
        let studentMicProcessor = null;
        let pendingCallSamples = [];
        let callPushInterval = null;

        const pipBox = document.getElementById('student-pip-box');
        const remoteVideoImg = document.getElementById('student-remote-video');
        const videoPlaceholder = document.getElementById('student-video-placeholder');
        const unmuteHintBtn = document.getElementById('btn-unmute-hint');
        const callBtn = document.getElementById('btn-student-call');

        function ensureStudentAudioCtx() {
            if (!studentAudioCtx) {
                studentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (studentAudioCtx.state === 'suspended') {
                studentAudioCtx.resume().then(() => {
                    unmuteHintBtn.style.display = 'none';
                }).catch(() => {});
            } else {
                unmuteHintBtn.style.display = 'none';
            }
        }

        // Unlock WebAudio automatically on any click or touch
        document.addEventListener('pointerdown', ensureStudentAudioCtx);
        unmuteHintBtn.addEventListener('click', ensureStudentAudioCtx);

        // Make Student Video Box Draggable on Desktop & Mobile Touch
        (function makeDraggable(boxEl, handleEl) {
            let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

            handleEl.addEventListener('pointerdown', (e) => {
                isDragging = true;
                handleEl.setPointerCapture(e.pointerId);
                const rect = boxEl.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = rect.left;
                initialTop = rect.top;
                boxEl.style.bottom = 'auto';
                boxEl.style.right = 'auto';
                boxEl.style.left = initialLeft + 'px';
                boxEl.style.top = initialTop + 'px';
            });

            handleEl.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const maxLeft = window.innerWidth - boxEl.offsetWidth;
                const maxTop = window.innerHeight - boxEl.offsetHeight;
                boxEl.style.left = Math.max(0, Math.min(maxLeft, initialLeft + dx)) + 'px';
                boxEl.style.top = Math.max(0, Math.min(maxTop, initialTop + dy)) + 'px';
            });

            handleEl.addEventListener('pointerup', (e) => {
                isDragging = false;
                handleEl.releasePointerCapture(e.pointerId);
            });
        })(pipBox, document.getElementById('student-pip-header'));

        function downsampleToInt16(float32Arr, inputRate, outputRate) {
            if (outputRate >= inputRate) {
                const out = new Int16Array(float32Arr.length);
                for (let i = 0; i < float32Arr.length; i++) {
                    const s = Math.max(-1, Math.min(1, float32Arr[i]));
                    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                return out;
            }
            const ratio = inputRate / outputRate;
            const newLen = Math.round(float32Arr.length / ratio);
            const result = new Int16Array(newLen);
            for (let i = 0; i < newLen; i++) {
                const idx = Math.min(float32Arr.length - 1, Math.floor(i * ratio));
                const s = Math.max(-1, Math.min(1, float32Arr[idx]));
                result[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return result;
        }

        function int16ToBase64(int16Arr) {
            const bytes = new Uint8Array(int16Arr.buffer, int16Arr.byteOffset, int16Arr.byteLength);
            let binary = '';
            const chunkSize = 4096;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        function playAdminPcmBase64(b64Str, sampleRate) {
            if (!studentAudioCtx) {
                studentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (studentAudioCtx.state === 'suspended') {
                unmuteHintBtn.style.display = 'block';
                return;
            }
            unmuteHintBtn.style.display = 'none';

            const raw = atob(b64Str);
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            const int16 = new Int16Array(bytes.buffer);
            if (int16.length === 0) return;

            const audioBuffer = studentAudioCtx.createBuffer(1, int16.length, sampleRate || TARGET_SAMPLE_RATE);
            const channel = audioBuffer.getChannelData(0);
            for (let i = 0; i < int16.length; i++) {
                channel[i] = int16[i] / 32768.0;
            }

            const now = studentAudioCtx.currentTime;
            if (nextAdminPlayTime < now || (nextAdminPlayTime - now) > 1.2) {
                nextAdminPlayTime = now + 0.05;
            }
            const src = studentAudioCtx.createBufferSource();
            src.buffer = audioBuffer;
            src.connect(studentAudioCtx.destination);
            src.start(nextAdminPlayTime);
            nextAdminPlayTime += audioBuffer.duration;
        }

        async function stopStudentCall() {
            isCallActive = false;
            pendingCallSamples = [];
            callBtn.textContent = '📞 Call Sir';
            callBtn.classList.remove('on-call');

            if (callPushInterval) {
                clearInterval(callPushInterval);
                callPushInterval = null;
            }
            if (studentMicProcessor) {
                studentMicProcessor.disconnect();
                studentMicProcessor = null;
            }
            if (studentMicSource) {
                studentMicSource.disconnect();
                studentMicSource = null;
            }
            if (studentMicStream) {
                studentMicStream.getTracks().forEach(t => t.stop());
                studentMicStream = null;
            }

            if (liveToken && currentQuizId) {
                await fetch('/api/live/rtc/student/call', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${liveToken}`
                    },
                    body: JSON.stringify({ quizId: currentQuizId, callActive: false })
                }).catch(() => {});
            }
        }

        function teardownStream() {
            document.body.classList.remove('rtc-stream-active');
            pipBox.style.display = 'none';
            remoteVideoImg.style.display = 'none';
            lastAdminAudioSeq = 0;
            if (isCallActive) stopStudentCall();
        }

        // 1-Click Call Button Handler
        callBtn.addEventListener('click', async () => {
            ensureStudentAudioCtx();

            if (!isCallActive) {
                try {
                    studentMicStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });

                    studentMicSource = studentAudioCtx.createMediaStreamSource(studentMicStream);
                    studentMicProcessor = studentAudioCtx.createScriptProcessor(2048, 1, 1);
                    const zeroGain = studentAudioCtx.createGain();
                    zeroGain.gain.value = 0;

                    pendingCallSamples = [];
                    studentMicProcessor.onaudioprocess = (e) => {
                        if (!isCallActive) return;
                        const input = e.inputBuffer.getChannelData(0);
                        const down = downsampleToInt16(input, studentAudioCtx.sampleRate, TARGET_SAMPLE_RATE);
                        for (let i = 0; i < down.length; i++) {
                            pendingCallSamples.push(down[i]);
                        }
                        if (pendingCallSamples.length > 9600) {
                            pendingCallSamples = pendingCallSamples.slice(-9600);
                        }
                    };

                    studentMicSource.connect(studentMicProcessor);
                    studentMicProcessor.connect(zeroGain);
                    zeroGain.connect(studentAudioCtx.destination);

                    isCallActive = true;
                    callBtn.textContent = '🔴 End Call';
                    callBtn.classList.add('on-call');

                    callPushInterval = setInterval(async () => {
                        if (!isCallActive || !liveToken || !currentQuizId) return;
                        let chunkB64 = null;
                        if (pendingCallSamples.length > 0) {
                            const int16 = new Int16Array(pendingCallSamples);
                            pendingCallSamples = [];
                            chunkB64 = int16ToBase64(int16);
                        }
                        await fetch('/api/live/rtc/student/call', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${liveToken}`
                            },
                            body: JSON.stringify({
                                quizId: currentQuizId,
                                callActive: true,
                                audioChunk: chunkB64,
                                rate: TARGET_SAMPLE_RATE
                            })
                        }).catch(() => {});
                    const callRes = await fetch('/api/live/rtc/student/call', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${liveToken}`
                            },
                            body: JSON.stringify({
                                quizId: currentQuizId,
                                callActive: true,
                                audioChunk: chunkB64,
                                rate: TARGET_SAMPLE_RATE
                            })
                        }).catch(() => {});

                        // If server indicates the stream ended, cleanly stop student call immediately
                        if (callRes && callRes.ok) {
                            const callData = await callRes.json().catch(() => ({}));
                            if (callData.streamEnded && isCallActive) {
                                await stopStudentCall();
                            }
                        }
                    }, 220);
                } catch (err) {
                    alert('Please allow microphone access to talk to Sir.');
                }
            } else {
                await stopStudentCall();
            }
        });

        // Fast 240ms Pull Loop for Live Video Frames & Admin Audio
        setInterval(async () => {
            if (!liveToken || !currentQuizId || !testActive) {
                if (pipBox.style.display !== 'none') teardownStream();
                return;
            }
            if (isPulling) return;
            isPulling = true;

            try {
                const res = await fetch(`/api/live/rtc/student/status/${currentQuizId}?afterSeq=${lastAdminAudioSeq}`, {
                    headers: { 'Authorization': `Bearer ${liveToken}` }
                });
                if (!res.ok) return;
                const status = await res.json();

                if (!status.broadcastActive) {
                    if (pipBox.style.display !== 'none') teardownStream();
                    return;
                }

                document.body.classList.add('rtc-stream-active');
                pipBox.style.display = 'flex';

                // Render live video frame or audio-only placeholder
                if (status.videoEnabled && status.frame) {
                    remoteVideoImg.src = status.frame;
                    remoteVideoImg.style.display = 'block';
                    videoPlaceholder.style.display = 'none';
                } else {
                    remoteVideoImg.style.display = 'none';
                    videoPlaceholder.style.display = 'block';
                    videoPlaceholder.textContent = status.audioEnabled ? '🎙️ Live Audio Active' : '⏸️ Stream Paused';
                }

                // Initialize sequence pointer on first join so only live audio plays
                if (lastAdminAudioSeq === 0 && status.latestSeq) {
                    lastAdminAudioSeq = status.latestSeq;
                }

                if (Array.isArray(status.audioChunks) && status.audioChunks.length > 0) {
                    status.audioChunks.forEach(chunk => {
                        if (chunk.seq > lastAdminAudioSeq) {
                            lastAdminAudioSeq = chunk.seq;
                            playAdminPcmBase64(chunk.pcm, chunk.rate);
                        }
                    });
                }
            } catch (e) {
            } finally {
                isPulling = false;
            }
        }, 240);
    })();
    </script>
</body>
</html>
