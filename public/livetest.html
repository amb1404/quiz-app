<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Test - Pioneers Prep</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8fafc; margin: 0; padding: 15px; box-sizing: border-box; }
        body.rtc-stream-active {
            align-items: flex-start !important;
        }
        body.rtc-stream-active #quiz-screen {
            margin-top: 185px !important;
        }
        .live-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; text-transform: uppercase;}
        .opt-btn { width: 100%; padding: 15px; margin: 8px 0; border: 2px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; font-size: 16px; transition: 0.2s;}
        .opt-btn.locked { opacity: 0.6; cursor: not-allowed; }
        .opt-btn.selected { border-color: #4285f4; background-color: #eff6ff; font-weight: bold; }

        /* Student Draggable Video Box & 1-Click Call Button */
        #student-pip-box {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 210px;
            background: #0f172a;
            border: 2px solid #2563eb;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 9995;
            display: none;
            flex-direction: column;
            touch-action: none;
            user-select: none;
        }
        @media (max-width: 600px) {
            #student-pip-box {
                width: 175px;
                top: 10px;
                right: 10px;
            }
        }
        #student-pip-header {
            background: #1e293b;
            color: #f8fafc;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 10px;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #student-pip-header:active { cursor: grabbing; }
        #student-video-stage {
            position: relative;
            width: 100%;
            height: 112px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 600px) {
            #student-video-stage { height: 96px; }
        }
        #student-remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            transform: scaleX(-1);
            will-change: contents;
        }
        #student-video-placeholder {
            color: #94a3b8;
            font-size: 12px;
            font-weight: bold;

            padding: 8px;
        }
        #btn-unmute-hint {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(245, 158, 11, 0.95);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            white-space: nowrap;
        }
        #student-pip-controls {
            padding: 6px;
            background: #0f172a;
            display: flex;
            gap: 6px;
        }
        #btn-student-call {
            width: 100%;
            padding: 7px 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            background: #10b981;
            color: white;
        }
        #btn-student-call.on-call {
            background: #ef4444;
        }
        /* Left-Aligned Large Presentation Stage with Dedicated Right-Side Space for Draggable PIP */
        body.rtc-presentation-active {
            justify-content: flex-start !important;
            align-items: flex-start !important;
            padding: 12px 16px !important;
        }
        body.rtc-presentation-active #presentation-screen {
            margin-top: 0 !important;
            margin-left: 0 !important;
            margin-right: auto !important;
            width: calc(100vw - 250px) !important;
            max-width: calc(100vw - 250px) !important;
        }
        #presentation-screen {
            display: none;
            width: 100%;
            background: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
            box-sizing: border-box;
        }
        #presentation-header {
            background: #1e293b;
            color: #f8fafc;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        #student-ppt-video {
            width: 100%;
            height: calc(100vh - 68px);
            max-height: 88vh;
            object-fit: contain;
            background: #000;
            display: block;
            transform: none !important; /* Keep PPT text un-mirrored */
        }
        @media (max-width: 768px) {
            body.rtc-presentation-active #presentation-screen {
                margin-top: 175px !important;
                width: 100% !important;
                max-width: 100% !important;
            }
            #student-ppt-video {
                height: auto;
                max-height: 68vh;
            }
        }
        /* Step 3: Simultaneous PPT + Question Card Split-Screen Layout */
        body.rtc-both-active {
            justify-content: flex-start !important;
            align-items: flex-start !important;
            gap: 16px !important;
            padding: 12px 16px !important;
            flex-wrap: wrap !important;
        }
        body.rtc-both-active #presentation-screen {
            display: block !important;
            width: calc(60vw - 24px) !important;
            max-width: calc(60vw - 24px) !important;
            margin: 0 !important;
        }
        body.rtc-both-active #quiz-screen {
            display: block !important;
            width: calc(40vw - 28px) !important;
            max-width: calc(40vw - 28px) !important;
            margin-top: 175px !important;
        }
        @media (max-width: 960px) {
            body.rtc-both-active #presentation-screen {
                margin-top: 175px !important;
                width: 100% !important;
                max-width: 100% !important;
            }
            body.rtc-both-active #quiz-screen {
                margin-top: 12px !important;
                width: 100% !important;
                max-width: 100% !important;
            }
        }
        @media print {
            #student-pip-box { display: none !important; }
        }
    </style>

    <!-- Draggable Instructor Video Feed & 1-Click Call Button -->
    <div id="student-pip-box" class="no-print">
        <div id="student-pip-header">
            <span>⠿ Drag Video</span>
            <span style="color: #34d399;">● LIVE HD</span>
        </div>
        <div id="student-video-stage">
            <video id="student-remote-video" autoplay playsinline muted></video>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/js/livetest.js"></script>
<script>
    (function() {
        const TARGET_SAMPLE_RATE = 24000;
        let studentAudioCtx = null;
        let aecReferenceDest = null;
        let aecAudioElement = null;
        let rtcOpusAudioEl = null;
        let isRtcOpusFlowing = false;

        let lastAdminAudioSeq = 0;
        let hasSyncedInitialSeq = false;
        let nextAdminPlayTime = 0;
        let lastAdminChunkEndMs = 0;
        let lastAdminAudioPlayedMs = 0; // Acoustic echo guard timestamp
        const activeAdminNodes = [];
        let isPulling = false;

        let studentPc = null;
        let isJoiningRtc = false;
        let joinStartedAt = 0;
        let disconnectedSince = 0;
        let currentOfferId = null;
        let hasSentCurrentOffer = false;

        let isCallActive = false;
        let isCallPushing = false;
        let studentMicStream = null;
        let studentMicSource = null;
        let studentMicProcessor = null;
        let studentSilentSink = null;
        let pendingCallSamples = [];
        let studentPreRollBuffers = [];
        let callPushInterval = null;
        let studentActivelySpeakingUntil = 0;
        let studentNoiseFloorRms = 0.0025;
        let studentGateGain = 0.0;

        const pipBox = document.getElementById('student-pip-box');
        const remoteVideo = document.getElementById('student-remote-video');
        const pptVideo = document.getElementById('student-ppt-video');
        const presentationScreen = document.getElementById('presentation-screen');
        const fullscreenBtn = document.getElementById('btn-ppt-fullscreen');
        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (presentationScreen.requestFullscreen) {
                        presentationScreen.requestFullscreen();
                    } else if (presentationScreen.webkitRequestFullscreen) {
                        presentationScreen.webkitRequestFullscreen();
                    }
                    fullscreenBtn.textContent = '✕ Exit Fullscreen';
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                    fullscreenBtn.textContent = '⛶ Fullscreen';
                }
            });
        }
        const quizScreen = document.getElementById('quiz-screen');
        const videoPlaceholder = document.getElementById('student-video-placeholder');
        const unmuteHintBtn = document.getElementById('btn-unmute-hint');
        const callBtn = document.getElementById('btn-student-call');

        // Binds WebAudio output to an HTML <audio> element so OS/Browser AEC3 cancels speaker echo
        function getStudentAudioDestination() {
            if (!studentAudioCtx) {
                studentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (!aecReferenceDest) {
                try {
                    aecReferenceDest = studentAudioCtx.createMediaStreamDestination();
                    aecAudioElement = document.createElement('audio');
                    aecAudioElement.autoplay = true;
                    aecAudioElement.playsInline = true;
                    aecAudioElement.srcObject = aecReferenceDest.stream;
                    aecAudioElement.play().catch(() => {});
                } catch (e) {
                    return studentAudioCtx.destination;
                }
            }
            if (aecAudioElement && aecAudioElement.paused) {
                aecAudioElement.play().catch(() => {});
                return studentAudioCtx.destination;
            }
            return aecReferenceDest ? aecReferenceDest : studentAudioCtx.destination;
        }

        function ensureStudentAudioCtx() {
            if (!studentAudioCtx) {
                studentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (studentAudioCtx.state === 'suspended') {
                studentAudioCtx.resume().then(() => {
                    unmuteHintBtn.style.display = 'none';
                }).catch(() => {});
            } else {
                unmuteHintBtn.style.display = 'none';
            }
            if (aecAudioElement && aecAudioElement.paused) {
                aecAudioElement.play().catch(() => {});
            }
            if (rtcOpusAudioEl && rtcOpusAudioEl.paused && rtcOpusAudioEl.srcObject) {
                rtcOpusAudioEl.play().then(() => {
                    isRtcOpusFlowing = true;
                    unmuteHintBtn.style.display = 'none';
                }).catch(() => {});
            }
        }

        document.addEventListener('pointerdown', ensureStudentAudioCtx);
        unmuteHintBtn.addEventListener('click', ensureStudentAudioCtx);

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                teardownStream();
            }
        });

        (function makeDraggable(boxEl, handleEl) {
            let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

            handleEl.addEventListener('pointerdown', (e) => {
                isDragging = true;
                handleEl.setPointerCapture(e.pointerId);
                const rect = boxEl.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = rect.left;
                initialTop = rect.top;
                boxEl.style.bottom = 'auto';
                boxEl.style.right = 'auto';
                boxEl.style.left = initialLeft + 'px';
                boxEl.style.top = initialTop + 'px';
            });

            handleEl.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const maxLeft = window.innerWidth - boxEl.offsetWidth;
                const maxTop = window.innerHeight - boxEl.offsetHeight;
                boxEl.style.left = Math.max(0, Math.min(maxLeft, initialLeft + dx)) + 'px';
                boxEl.style.top = Math.max(0, Math.min(maxTop, initialTop + dy)) + 'px';
            });

            handleEl.addEventListener('pointerup', (e) => {
                isDragging = false;
                handleEl.releasePointerCapture(e.pointerId);
            });
        })(pipBox, document.getElementById('student-pip-header'));

        function downsampleClean(float32Arr, inputRate, outputRate) {
           if (inputRate === outputRate) {
                const out = new Int16Array(float32Arr.length);
                for (let i = 0; i < float32Arr.length; i++) {
                    let s = Math.max(-1, Math.min(1, float32Arr[i]));
                    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                return out;
            }
            const ratio = inputRate / outputRate;
            const newLen = Math.round(float32Arr.length / ratio);
            const result = new Int16Array(newLen);

            for (let i = 0; i < newLen; i++) {
                const pos = i * ratio;
                const idx = Math.floor(pos);
                const frac = pos - idx;
                const s0 = float32Arr[idx] || 0;
                const s1 = float32Arr[Math.min(float32Arr.length - 1, idx + 1)] || s0;
                let sample = s0 + frac * (s1 - s0);
                sample = Math.max(-1, Math.min(1, sample));
                result[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            }
            return result;
        }

        function int16ToBase64(int16Arr) {
            const bytes = new Uint8Array(int16Arr.buffer, int16Arr.byteOffset, int16Arr.byteLength);
            let binary = '';
            const chunkSize = 4096;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        function stopAllPcmNodes() {
            while (activeAdminNodes.length > 0) {
                const oldNode = activeAdminNodes.shift();
                try { oldNode.stop(); } catch (e) {}
            }
        }

       let lastAdminSampleVal = 0;

        function playAdminPcmBase64(b64Str, sampleRate) {
            lastAdminAudioPlayedMs = Date.now() + 450;

            try {
                const adminLocalStamp = Number(localStorage.getItem('pp_admin_mic_same_pc') || 0);
                if (Date.now() - adminLocalStamp < 2000) return;
            } catch (e) {}

            // CRITICAL ANTI-ECHO FIX: When 48kHz WebRTC Opus is active, NEVER play the delayed 16kHz PCM copy!
            if (
                isRtcOpusFlowing &&
                rtcOpusAudioEl &&
                !rtcOpusAudioEl.paused &&
                studentPc &&
                (studentPc.connectionState === 'connected' || studentPc.iceConnectionState === 'connected')
            ) {
                stopAllPcmNodes();
                return;
            }

            if (!studentAudioCtx) {
                studentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (studentAudioCtx.state === 'suspended') {
                studentAudioCtx.resume().catch(() => {});
                if (studentAudioCtx.state === 'suspended') {
                    unmuteHintBtn.style.display = 'block';
                    return;
                }
            }
            unmuteHintBtn.style.display = 'none';

            const raw = atob(b64Str);
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            const int16 = new Int16Array(bytes.buffer);
            if (int16.length === 0) return;

            const rate = sampleRate || TARGET_SAMPLE_RATE;
            const audioBuffer = studentAudioCtx.createBuffer(1, int16.length, rate);
            const channel = audioBuffer.getChannelData(0);

            const now = studentAudioCtx.currentTime;
            const isUnderrun = (nextAdminPlayTime < now);
            const isNewTalkSpurt = isUnderrun && (Date.now() - lastAdminChunkEndMs > 500);
            const prevSample = isNewTalkSpurt ? 0 : lastAdminSampleVal;

            const stitchLen = Math.min(16, int16.length);
            for (let i = 0; i < int16.length; i++) {
                let val = int16[i] / 32768.0;
                if (i < stitchLen) {
                    const alpha = i / stitchLen;
                    val = prevSample + alpha * (val - prevSample);
                }
                channel[i] = val;
            }
            lastAdminSampleVal = channel[int16.length - 1];

            if (isNewTalkSpurt) {
                nextAdminPlayTime = now + 0.24; // 240ms cushion prevents mid-sentence starvation
            } else if (isUnderrun) {
                nextAdminPlayTime = now + 0.005; // 5ms instant stitch (eliminates 90ms silence breaks)
            } else if (nextAdminPlayTime - now > 2.4) {
                stopAllPcmNodes();
                nextAdminPlayTime = now + 0.18;
            }

            const src = studentAudioCtx.createBufferSource();
            src.buffer = audioBuffer;
            src.connect(getStudentAudioDestination());

            activeAdminNodes.push(src);
            src.onended = () => {
                const idx = activeAdminNodes.indexOf(src);
                if (idx !== -1) activeAdminNodes.splice(idx, 1);
            };

            src.start(nextAdminPlayTime);
            nextAdminPlayTime += audioBuffer.duration;

            const remainingPlayMs = Math.max(0, (nextAdminPlayTime - now) * 1000);
            lastAdminChunkEndMs = Date.now() + remainingPlayMs;
            lastAdminAudioPlayedMs = Date.now() + remainingPlayMs + 350;
        }

        function waitForIce(pc, maxTimeout = 600) {
            return new Promise(resolve => {
                if (pc.iceGatheringState === 'complete') return resolve();
                let resolved = false;
                let quickTimer = null;
                const done = () => {
                    if (resolved) return;
                    resolved = true;
                    clearTimeout(maxTimer);
                    if (quickTimer) clearTimeout(quickTimer);
                    resolve();
                };
                const maxTimer = setTimeout(done, maxTimeout);
                pc.addEventListener('icecandidate', (e) => {
                    if (!e.candidate) {
                        done();
                    } else if (e.candidate.candidate && (e.candidate.candidate.includes('srflx') || e.candidate.candidate.includes('host'))) {
                        if (!quickTimer) quickTimer = setTimeout(done, 120);
                    }
                });
                pc.addEventListener('icegatheringstatechange', () => {
                    if (pc.iceGatheringState === 'complete') done();
                });
            });
        }

        function attachLowLatencyVideo(videoEl, track, receiver) {
            if (receiver) {
                try {
                    if ('playoutDelayHint' in receiver) receiver.playoutDelayHint = 0;
                    if ('jitterBufferTarget' in receiver) receiver.jitterBufferTarget = 0;
                } catch (e) {}
            }
            videoEl.srcObject = new MediaStream([track]);
            videoEl.play().catch(() => {});
        }

        function attachOpusAudioTrack(track, receiver) {
            if (receiver) {
                try {
                    if ('playoutDelayHint' in receiver) receiver.playoutDelayHint = 0.08;
                    if ('jitterBufferTarget' in receiver) receiver.jitterBufferTarget = 80;
                } catch (e) {}
            }
            if (!rtcOpusAudioEl) {
                rtcOpusAudioEl = document.createElement('audio');
                rtcOpusAudioEl.autoplay = true;
                rtcOpusAudioEl.playsInline = true;
            }
            try {
                const adminLocalStamp = Number(localStorage.getItem('pp_admin_mic_same_pc') || 0);
                rtcOpusAudioEl.muted = (Date.now() - adminLocalStamp < 2000);
            } catch (e) {}

            rtcOpusAudioEl.srcObject = new MediaStream([track]);
            rtcOpusAudioEl.onplaying = () => {
                isRtcOpusFlowing = true;
                stopAllPcmNodes();
                unmuteHintBtn.style.display = 'none';
            };
            rtcOpusAudioEl.play().then(() => {
                isRtcOpusFlowing = true;
                stopAllPcmNodes();
                unmuteHintBtn.style.display = 'none';
            }).catch(() => {
                isRtcOpusFlowing = false;
                unmuteHintBtn.style.display = 'block';
            });
        }

        async function connectToAdminVideo() {
            if (isJoiningRtc || !liveToken || !currentQuizId) return;
            isJoiningRtc = true;
            isRtcOpusFlowing = false;
            joinStartedAt = Date.now();
            disconnectedSince = 0;
            hasSentCurrentOffer = false;
            const myOfferId = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
            currentOfferId = myOfferId;

            try {
                if (studentPc) {
                    try { studentPc.close(); } catch (e) {}
                }
                studentPc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
                    iceCandidatePoolSize: 4
                });

                studentPc.addTransceiver('video', { direction: 'recvonly' }); // Pipeline 1: Webcam PIP
                studentPc.addTransceiver('video', { direction: 'recvonly' }); // Pipeline 2: PPT Presentation
                studentPc.addTransceiver('audio', { direction: 'recvonly' }); // Pipeline 3: Native Opus Audio

                studentPc.ontrack = (event) => {
                    if (event.track.kind === 'audio') {
                        attachOpusAudioTrack(event.track, event.receiver);
                        return;
                    }
                    if (event.track.kind === 'video') {
                        // Directly assign based on transceiver order to eliminate frame stuttering
                        const transceivers = studentPc.getTransceivers();
                        const videoTransceivers = transceivers.filter(t => t.mid !== null);
                        const videoIndex = videoTransceivers.findIndex(t => t.receiver === event.receiver);

                        event.track.enabled = true;
                        if (videoIndex === 0 || videoTransceivers.length === 1) {
                            attachLowLatencyVideo(remoteVideo, event.track, event.receiver);
                        } else {
                            attachLowLatencyVideo(pptVideo, event.track, event.receiver);
                        }
                    }
                };

                studentPc.onconnectionstatechange = () => {
                    if (!studentPc) return;
                    if (studentPc.connectionState === 'connected') {
                        disconnectedSince = 0;
                    } else if (studentPc.connectionState === 'disconnected') {
                        if (!disconnectedSince) disconnectedSince = Date.now();
                    } else if (studentPc.connectionState === 'failed') {
                        try { studentPc.close(); } catch (e) {}
                        studentPc = null;
                        isJoiningRtc = false;
                        isRtcOpusFlowing = false;
                        hasSentCurrentOffer = false;
                        disconnectedSince = 0;
                    }
                };

                const offer = await studentPc.createOffer();
                await studentPc.setLocalDescription(offer);
                await waitForIce(studentPc, 600);

                const res = await fetch('/api/live/rtc/student/webrtc-offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${liveToken}` },
                    body: JSON.stringify({ quizId: currentQuizId, offer: studentPc.localDescription, offerId: myOfferId })
                });
                if (res.ok) {
                    hasSentCurrentOffer = true;
                } else {
                    isJoiningRtc = false;
                }
            } catch (e) {
                isJoiningRtc = false;
                hasSentCurrentOffer = false;
            }
        }

        async function stopStudentCall() {
            isCallActive = false;
            isCallPushing = false;
            pendingCallSamples = [];
            studentPreRollBuffers = [];
            studentGateGain = 0.0;
            try { localStorage.removeItem('pp_student_call_same_pc'); } catch (e) {}
            callBtn.textContent = '📞 Call Sir';
            callBtn.classList.remove('on-call');

            if (callPushInterval) {
                clearInterval(callPushInterval);
                callPushInterval = null;
            }
            if (studentMicProcessor) {
                try { studentMicProcessor.disconnect(); } catch (e) {}
                studentMicProcessor = null;
            }
            if (studentMicSource) {
                try { studentMicSource.disconnect(); } catch (e) {}
                studentMicSource = null;
            }
            if (studentSilentSink) {
                try { studentSilentSink.disconnect(); } catch (e) {}
                studentSilentSink = null;
            }
            if (rtcOpusAudioEl) rtcOpusAudioEl.volume = 1.0;
            if (aecAudioElement) aecAudioElement.volume = 1.0;
            if (studentMicStream) {
                studentMicStream.getTracks().forEach(t => t.stop());
                studentMicStream = null;
            }

            if (liveToken && currentQuizId) {
                await fetch('/api/live/rtc/student/call', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${liveToken}`
                    },
                    body: JSON.stringify({ quizId: currentQuizId, callActive: false })
                }).catch(() => {});
            }
        }

        function teardownStream() {
            document.body.classList.remove('rtc-stream-active');
            document.body.classList.remove('rtc-presentation-active');
            document.body.classList.remove('rtc-both-active');
            if (remoteVideo) { remoteVideo.srcObject = null; remoteVideo.style.display = 'none'; }
            if (pptVideo) { pptVideo.srcObject = null; }
            if (rtcOpusAudioEl) { rtcOpusAudioEl.srcObject = null; }
            isRtcOpusFlowing = false;
            stopAllPcmNodes();
            if (pipBox) pipBox.style.display = 'none';
            if (presentationScreen) presentationScreen.style.display = 'none';
            if (quizScreen && testActive) quizScreen.style.display = 'block';

            lastAdminAudioSeq = 0;
            hasSyncedInitialSeq = false;
            currentOfferId = null;
            hasSentCurrentOffer = false;
            disconnectedSince = 0;

            if (studentPc) {
                try { studentPc.close(); } catch (e) {}
                studentPc = null;
            }
            isJoiningRtc = false;
            if (isCallActive) stopStudentCall();
        }

        callBtn.addEventListener('click', async () => {
            ensureStudentAudioCtx();

            if (!isCallActive) {
                try {
                   studentMicStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: { ideal: true },
                            noiseSuppression: { ideal: true },
                            voiceIsolation: { ideal: true },
                            autoGainControl: false,
                            channelCount: { ideal: 1 },
                            googEchoCancellation: true,
                            googAutoGainControl: false,
                            googNoiseSuppression: true,
                            googExperimentalNoiseSuppression: true,
                            googHighpassFilter: true
                        }
                    });

                    studentMicSource = studentAudioCtx.createMediaStreamSource(studentMicStream);

                    // 5-Stage Near-Field Voice Filter Chain (Rejects Distant Room Noise Without Distortion)
                    const humNotch = studentAudioCtx.createBiquadFilter();
                    humNotch.type = 'notch';
                    humNotch.frequency.value = 50;
                    humNotch.Q.value = 10.0;

                    const hpFilter = studentAudioCtx.createBiquadFilter();
                    hpFilter.type = 'highpass';
                    hpFilter.frequency.value = 200;
                    hpFilter.Q.value = 0.707;

                    const lpFilter = studentAudioCtx.createBiquadFilter();
                    lpFilter.type = 'lowpass';
                    lpFilter.frequency.value = 10000;
                    lpFilter.Q.value = 0.707;

                    const presenceFilter = studentAudioCtx.createBiquadFilter();
                    presenceFilter.type = 'peaking';
                    presenceFilter.frequency.value = 3200;
                    presenceFilter.Q.value = 1.0;
                    presenceFilter.gain.value = 3.5;

                    const compressor = studentAudioCtx.createDynamicsCompressor();
                    compressor.threshold.value = -18;
                    compressor.knee.value = 8;
                    compressor.ratio.value = 2.5;
                    compressor.attack.value = 0.005;
                    compressor.release.value = 0.12;

                    studentMicProcessor = studentAudioCtx.createScriptProcessor(2048, 1, 1);
                    // Zero-gain node connected to hardware destination guarantees unthrottled audio callbacks
                    studentSilentSink = studentAudioCtx.createGain();
                    studentSilentSink.gain.value = 0;

                    pendingCallSamples = [];
                    studentPreRollBuffers = [];
                    let wasStudentSpeaking = false;
                    studentNoiseFloorRms = 0.0025;
                    studentActivelySpeakingUntil = Date.now() + 700;

                    studentMicProcessor.onaudioprocess = (e) => {
                        if (!isCallActive) return;
                        const nowMs = Date.now();

                        const input = e.inputBuffer.getChannelData(0);
                        let sumSq = 0;
                        for (let i = 0; i < input.length; i++) sumSq += input[i] * input[i];
                        const rms = Math.sqrt(sumSq / input.length);

                        if (!wasStudentSpeaking || rms < studentNoiseFloorRms * 1.5) {
                            studentNoiseFloorRms = (0.95 * studentNoiseFloorRms) + (0.05 * Math.min(0.008, Math.max(0.0008, rms)));
                        }

                        // Close-talk detection with 1100ms hold so syllables never clip
                        const openThreshold = Math.max(0.0045, studentNoiseFloorRms * 2.2);
                        const continueThreshold = Math.max(0.0025, studentNoiseFloorRms * 1.4);

                        if (rms > openThreshold || (wasStudentSpeaking && rms > continueThreshold)) {
                            studentActivelySpeakingUntil = nowMs + 1100;
                        }

                        const isGateOpen = (nowMs < studentActivelySpeakingUntil);
                        wasStudentSpeaking = isGateOpen;

                        // Duck Admin speaker to 20% while student speaks to prevent echo
                        const duckVol = isGateOpen ? 0.20 : 1.0;
                        if (rtcOpusAudioEl && rtcOpusAudioEl.volume !== duckVol) rtcOpusAudioEl.volume = duckVol;
                        if (aecAudioElement && aecAudioElement.volume !== duckVol) aecAudioElement.volume = duckVol;

                        // Smooth downward expander: boosts voice (1.45x) and attenuates background noise (0.03x)
                        // WITHOUT stopping the sample stream, so Admin playback never starves mid-sentence!
                        const targetGain = isGateOpen ? 1.45 : 0.03;
                        const gatedFloat = new Float32Array(input.length);

                        for (let i = 0; i < input.length; i++) {
                            studentGateGain += (targetGain - studentGateGain) * (isGateOpen ? 0.10 : 0.006);
                            gatedFloat[i] = Math.max(-1, Math.min(1, input[i] * studentGateGain));
                        }

                        const down = downsampleClean(gatedFloat, studentAudioCtx.sampleRate, TARGET_SAMPLE_RATE);

                        // Push every frame continuously while on call so the 16kHz timeline never breaks
                        for (let i = 0; i < down.length; i++) {
                            pendingCallSamples.push(down[i]);
                        }
                        if (pendingCallSamples.length > 32000) {
                            pendingCallSamples = pendingCallSamples.slice(-32000);
                        }
                    };

                    studentMicSource.connect(humNotch);
                    humNotch.connect(hpFilter);
                    hpFilter.connect(lpFilter);
                    hpFilter.connect(presenceFilter);
                    presenceFilter.connect(compressor);
                    compressor.connect(studentMicProcessor);
                    studentMicProcessor.connect(studentSilentSink);
                    studentSilentSink.connect(studentAudioCtx.destination);

                    isCallActive = true;
                    isCallPushing = false;
                    callBtn.textContent = '🔴 End Call';
                    callBtn.classList.add('on-call');

                    callPushInterval = setInterval(async () => {
                        if (!isCallActive || isCallPushing || !liveToken || !currentQuizId) return;
                        isCallPushing = true;

                        try {
                            let chunkB64 = null;
                            if (pendingCallSamples.length >= 1024) {
                                const int16 = new Int16Array(pendingCallSamples);
                                pendingCallSamples = [];
                                chunkB64 = int16ToBase64(int16);
                            }
                            const callRes = await fetch('/api/live/rtc/student/call', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${liveToken}`
                                },
                                body: JSON.stringify({
                                    quizId: currentQuizId,
                                    callActive: true,
                                    audioChunk: chunkB64,
                                    rate: TARGET_SAMPLE_RATE
                                })
                            });

                            if (callRes && callRes.ok) {
                                const callData = await callRes.json().catch(() => ({}));
                                if ((callData.streamEnded || callData.mutedByAdmin) && isCallActive) {
                                    await stopStudentCall();
                                }
                            }
                        } catch (e) {
                        } finally {
                            isCallPushing = false;
                        }
                    }, 100);
                } catch (err) {
                    alert('Please allow microphone access to talk to Sir.');
                }
            } else {
                await stopStudentCall();
            }
        });

        // Fast 130ms Pull Loop for Audio, WebRTC State, Moderation & Dual-Cast Mode Switching
        setInterval(async () => {
            if (!liveToken || !currentQuizId || !testActive) {
                if (pipBox.style.display !== 'none') teardownStream();
                return;
            }
            if (isPulling) return;
            isPulling = true;

            try {
                const syncFlag = hasSyncedInitialSeq ? '1' : '0';
                const res = await fetch(`/api/live/rtc/student/status/${encodeURIComponent(currentQuizId)}?afterSeq=${lastAdminAudioSeq}&synced=${syncFlag}`, {
                    headers: { 'Authorization': `Bearer ${liveToken}` }
                });
                if (!res.ok) return;
                const status = await res.json();

                if (status.kicked) {
                    teardownStream();
                    sessionStorage.removeItem('live_student_session');
                    testActive = false;
                    alert('You have been removed from this room by the instructor.');
                    window.location.replace('/');
                    return;
                }

                if (status.mutedByAdmin) {
                    if (isCallActive) {
                        await stopStudentCall();
                    }
                    callBtn.disabled = true;
                    callBtn.textContent = '🔇 Muted by Sir';
                    callBtn.style.background = '#64748b';
                    callBtn.style.cursor = 'not-allowed';
                } else {
                    callBtn.disabled = false;
                    callBtn.style.cursor = 'pointer';
                    if (!isCallActive) {
                        callBtn.textContent = '📞 Call Sir';
                        callBtn.style.background = '#10b981';
                    }
                }

                if (!status.broadcastActive) {
                    if (pipBox.style.display !== 'none') teardownStream();
                    return;
                }

                document.body.classList.add('rtc-stream-active');
                pipBox.style.display = 'flex';

                if (isJoiningRtc && (Date.now() - joinStartedAt > 8000)) {
                    isJoiningRtc = false;
                }
                if (disconnectedSince && (Date.now() - disconnectedSince > 6000)) {
                    if (studentPc) { try { studentPc.close(); } catch (e) {} studentPc = null; }
                    isJoiningRtc = false;
                    isRtcOpusFlowing = false;
                    disconnectedSince = 0;
                }

                if (!studentPc && !isJoiningRtc) {
                    connectToAdminVideo();
                }

                if (
                    hasSentCurrentOffer &&
                    status.webrtcAnswer &&
                    status.webrtcOfferId === currentOfferId &&
                    studentPc &&
                    studentPc.signalingState === 'have-local-offer'
                ) {
                    await studentPc.setRemoteDescription(new RTCSessionDescription(status.webrtcAnswer));
                    isJoiningRtc = false;
                }

                if (rtcOpusAudioEl) {
                    try {
                        const adminLocalStamp = Number(localStorage.getItem('pp_admin_mic_same_pc') || 0);
                        rtcOpusAudioEl.muted = !status.audioEnabled || (Date.now() - adminLocalStamp < 2000);
                    } catch (e) {
                        rtcOpusAudioEl.muted = !status.audioEnabled;
                    }
                }

                // Swap Student Screen between Question Only, Presentation Only, or Both Together
                if (status.broadcastMode === 'both') {
                    document.body.classList.remove('rtc-presentation-active');
                    document.body.classList.add('rtc-both-active');
                    if (presentationScreen) presentationScreen.style.display = 'block';
                    if (quizScreen) quizScreen.style.display = 'block';
                    if (pptVideo && pptVideo.paused && pptVideo.srcObject) {
                        pptVideo.play().catch(() => {});
                    }
                } else if (status.broadcastMode === 'presentation') {
                    document.body.classList.remove('rtc-both-active');
                    document.body.classList.add('rtc-presentation-active');
                    if (quizScreen) quizScreen.style.display = 'none';
                    if (presentationScreen) presentationScreen.style.display = 'block';
                    if (pptVideo && pptVideo.paused && pptVideo.srcObject) {
                        pptVideo.play().catch(() => {});
                    }
                } else {
                    document.body.classList.remove('rtc-presentation-active');
                    document.body.classList.remove('rtc-both-active');
                    if (presentationScreen) presentationScreen.style.display = 'none';
                    if (quizScreen) quizScreen.style.display = 'block';
                }

                if (status.videoEnabled) {
                    remoteVideo.style.display = 'block';
                    videoPlaceholder.style.display = 'none';
                    if (remoteVideo.paused && remoteVideo.srcObject) {
                        remoteVideo.play().catch(() => {});
                    }
                } else {
                    remoteVideo.style.display = 'none';
                    videoPlaceholder.style.display = 'block';
                    videoPlaceholder.textContent = status.audioEnabled ? '🎙️ Live HD Audio Active' : '🎧 Sir is Listening (Mic Off)';
                }

                if (!hasSyncedInitialSeq) {
                    lastAdminAudioSeq = status.latestSeq || 0;
                    hasSyncedInitialSeq = true;
                }

                if (Array.isArray(status.audioChunks) && status.audioChunks.length > 0) {
                    status.audioChunks.forEach(chunk => {
                        if (chunk.seq > lastAdminAudioSeq) {
                            lastAdminAudioSeq = chunk.seq;
                            playAdminPcmBase64(chunk.pcm, chunk.rate);
                        }
                    });
                }
            } catch (e) {
            } finally {
                isPulling = false;
            }
        }, 130);
    })();
</script>
