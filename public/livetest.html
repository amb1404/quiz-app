<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Test - Pioneers Prep</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8fafc; margin: 0; padding: 15px; box-sizing: border-box; }
        body.rtc-stream-active {
            align-items: flex-start !important;
        }
        body.rtc-stream-active #quiz-screen {
            margin-top: 185px !important;
        }
        .live-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; text-transform: uppercase;}
        .opt-btn { width: 100%; padding: 15px; margin: 8px 0; border: 2px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; font-size: 16px; transition: 0.2s;}
        .opt-btn.locked { opacity: 0.6; cursor: not-allowed; }
        .opt-btn.selected { border-color: #4285f4; background-color: #eff6ff; font-weight: bold; }

        /* Student Draggable Video Box & 1-Click Call Button */
        #student-pip-box {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 210px;
            background: #0f172a;
            border: 2px solid #2563eb;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 9995;
            display: none;
            flex-direction: column;
            touch-action: none;
            user-select: none;
        }
        @media (max-width: 600px) {
            #student-pip-box {
                width: 175px;
                top: 10px;
                right: 10px;
            }
        }
        #student-pip-header {
            background: #1e293b;
            color: #f8fafc;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 10px;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #student-pip-header:active { cursor: grabbing; }
        #student-video-stage {
            position: relative;
            width: 100%;
            height: 112px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 600px) {
            #student-video-stage { height: 96px; }
        }
        #student-remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            transform: scaleX(-1);
            will-change: contents;
        }
        #student-video-placeholder {
            color: #94a3b8;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            padding: 8px;
        }
        #btn-unmute-hint {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(245, 158, 11, 0.95);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            white-space: nowrap;
        }
        #student-pip-controls {
            padding: 6px;
            background: #0f172a;
            display: flex;
            gap: 6px;
        }
        #btn-student-call {
            width: 100%;
            padding: 7px 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            background: #10b981;
            color: white;
        }
        #btn-student-call.on-call {
            background: #ef4444;
        }
        /* Left-Aligned Large Presentation Stage with Dedicated Right-Side Space for Draggable PIP */
        body.rtc-presentation-active {
            justify-content: flex-start !important;
            align-items: flex-start !important;
            padding: 12px 16px !important;
        }
        body.rtc-presentation-active #presentation-screen {
            margin-top: 0 !important;
            margin-left: 0 !important;
            margin-right: auto !important;
            width: calc(100vw - 250px) !important;
            max-width: calc(100vw - 250px) !important;
        }
        #presentation-screen {
            display: none;
            width: 100%;
            background: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
            box-sizing: border-box;
        }
        #presentation-header {
            background: #1e293b;
            color: #f8fafc;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        #student-ppt-video {
            width: 100%;
            height: calc(100vh - 68px);
            max-height: 88vh;
            object-fit: contain;
            background: #000;
            display: block;
            transform: none !important; /* Keep PPT text un-mirrored */
        }
        @media (max-width: 768px) {
            body.rtc-presentation-active #presentation-screen {
                margin-top: 175px !important;
                width: 100% !important;
                max-width: 100% !important;
            }
            #student-ppt-video {
                height: auto;
                max-height: 68vh;
            }
        }
        @media print {
            #student-pip-box { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="auth-screen" class="live-container">
        <h2 style="color: #4285f4;">Join Live Mock Test</h2>
        <select id="live-quiz-id" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #e2e8f0; border-radius: 6px; box-sizing: border-box; background-color: white; font-weight: bold; color: #1e293b; cursor: pointer;">
            <option value="">Loading Tests...</option>
        </select>

        <script>
            document.addEventListener('DOMContentLoaded', async () => {
                const dropdown = document.getElementById('live-quiz-id');
                if (!dropdown) return;
                
                try {
                    const res = await fetch('/api/live/list');
                    const data = await res.json();
                    
                    if (data.success && data.tests.length > 0) {
                        dropdown.innerHTML = '<option value="">-- Select a Live Test --</option>';
                        data.tests.forEach(test => {
                            const option = document.createElement('option');
                            option.value = test.id;
                            option.textContent = test.title;
                            dropdown.appendChild(option);
                        });
                    } else {
                        dropdown.innerHTML = '<option value="">No Live Tests Available</option>';
                    }
                } catch (e) {
                    dropdown.innerHTML = '<option value="">Error loading tests</option>';
                }
            });
        </script>
        <input type="number" id="live-otp" placeholder="Enter Admin OTP">
        <button id="join-btn" style="width: 100%; padding: 12px; background: #4285f4; color: white; border: none; border-radius: 6px; margin-top: 10px; font-weight: bold; cursor: pointer;">Join Test</button>
    </div>
<!-- Live PowerPoint Presentation Screen -->
    <div id="presentation-screen">
        <div id="presentation-header">
            <span>🖥️ Live Presentation Broadcast</span>
            <span style="color: #34d399;">● LIVE SLIDES</span>
        </div>
        <video id="student-ppt-video" autoplay playsinline muted></video>
    </div>
    <div id="quiz-screen" class="live-container" style="display: none;">
        <div style="display: flex; justify-content: space-between; color: #64748b; margin-bottom: 20px; font-weight: bold;">
            <span id="live-status">Waiting for Admin...</span>
            <span id="live-progress">Q: -/-</span>
        </div>
        <h3 id="question-text" style="font-size: 20px; color: #1e293b; margin-bottom: 25px; text-align: left;"></h3>
        <div id="options-container" style="text-align: left;"></div>
    </div>

    <!-- Draggable Instructor Video Feed & 1-Click Call Button -->
    <div id="student-pip-box" class="no-print">
        <div id="student-pip-header">
            <span>⠿ Drag Video</span>
            <span style="color: #34d399;">● LIVE HD</span>
        </div>
        <div id="student-video-stage">
            <video id="student-remote-video" autoplay playsinline muted></video>
            <div id="student-video-placeholder">🎙️ Live Audio Broadcast</div>
            <button id="btn-unmute-hint" type="button">🔊 Tap to Enable Audio</button>
        </div>
        <div id="student-pip-controls">
            <button id="btn-student-call" type="button">📞 Call Sir</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/js/livetest.js"></script>
<script>
    (function() {
        const TARGET_SAMPLE_RATE = 16000;
        // Global resume handler to instantly restore session after a refresh or back-button
        window.resumeLiveSession = async function(quizId, token) {
            currentQuizId = quizId;
            liveToken = token;
            testActive = true;
            const authScreen = document.getElementById('auth-screen');
            const quizScreen = document.getElementById('quiz-screen');
            if (authScreen) authScreen.style.display = 'none';
            if (quizScreen) quizScreen.style.display = 'block';
            
            try {
                const res = await fetch(`/api/live/student/sync/${quizId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data && data.success && typeof window.renderQuestion === 'function') {
                    window.renderQuestion(data.question, data.currentIndex, data.total);
                }
            } catch (e) {}
        };
        let studentAudioCtx = null;
        let lastAdminAudioSeq = 0;
        let hasSyncedInitialSeq = false;
        let nextAdminPlayTime = 0;
        let lastAdminAudioPlayedMs = 0;
        let isPulling = false;

        let studentPc = null;
        let isJoiningRtc = false;

        let isCallActive = false;
        let isCallPushing = false;
        let studentMicStream = null;
        let studentMicSource = null;
        let studentMicProcessor = null;
        let studentSilentSink = null;
        let pendingCallSamples = [];
        let studentPreRollBuffers = []; 
        let callPushInterval = null;
        let studentActivelySpeakingUntil = 0;
        let echoReflectionGuardUntil = 0; 
        let recentSpeechPeakRms = 0.02;

        const pipBox = document.getElementById('student-pip-box');
        const remoteVideo = document.getElementById('student-remote-video');
        const pptVideo = document.getElementById('student-ppt-video');
        const presentationScreen = document.getElementById('presentation-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const videoPlaceholder = document.getElementById('student-video-placeholder');
        const unmuteHintBtn = document.getElementById('btn-unmute-hint');
        const callBtn = document.getElementById('btn-student-call');

        function ensureStudentAudioCtx() {
            if (!studentAudioCtx) {
                studentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (studentAudioCtx.state === 'suspended') {
                studentAudioCtx.resume().then(() => {
                    unmuteHintBtn.style.display = 'none';
                }).catch(() => {});
            } else {
                unmuteHintBtn.style.display = 'none';
            }
        }

        document.addEventListener('pointerdown', ensureStudentAudioCtx);
        unmuteHintBtn.addEventListener('click', ensureStudentAudioCtx);

        (function makeDraggable(boxEl, handleEl) {
            let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

            handleEl.addEventListener('pointerdown', (e) => {
                isDragging = true;
                handleEl.setPointerCapture(e.pointerId);
                const rect = boxEl.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = rect.left;
                initialTop = rect.top;
                boxEl.style.bottom = 'auto';
                boxEl.style.right = 'auto';
                boxEl.style.left = initialLeft + 'px';
                boxEl.style.top = initialTop + 'px';
            });

            handleEl.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const maxLeft = window.innerWidth - boxEl.offsetWidth;
                const maxTop = window.innerHeight - boxEl.offsetHeight;
                boxEl.style.left = Math.max(0, Math.min(maxLeft, initialLeft + dx)) + 'px';
                boxEl.style.top = Math.max(0, Math.min(maxTop, initialTop + dy)) + 'px';
            });

            handleEl.addEventListener('pointerup', (e) => {
                isDragging = false;
                handleEl.releasePointerCapture(e.pointerId);
            });
        })(pipBox, document.getElementById('student-pip-header'));

        function downsampleAndEnhance(float32Arr, inputRate, outputRate, gainMultiplier) {
            const ratio = inputRate / outputRate;
            const newLen = Math.floor(float32Arr.length / ratio);
            const result = new Int16Array(newLen);

            for (let i = 0; i < newLen; i++) {
                const start = Math.floor(i * ratio);
                const end = Math.min(float32Arr.length, Math.ceil((i + 1) * ratio));
                let sum = 0, count = 0;
                for (let j = start; j < end; j++) {
                    sum += float32Arr[j];
                    count++;
                }
                let sample = (count > 0 ? sum / count : float32Arr[start]) * gainMultiplier;
                if (sample > 1.0) sample = 1.0;
                else if (sample < -1.0) sample = -1.0;
                result[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            }
            return result;
        }

        function int16ToBase64(int16Arr) {
            const bytes = new Uint8Array(int16Arr.buffer, int16Arr.byteOffset, int16Arr.byteLength);
            let binary = '';
            const chunkSize = 4096;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        function playAdminPcmBase64(b64Str, sampleRate) {
            try {
                const adminLocalStamp = Number(localStorage.getItem('pp_admin_mic_same_pc') || 0);
                if (Date.now() - adminLocalStamp < 2000) return;
            } catch (e) {}

            if (isCallActive && Date.now() < studentActivelySpeakingUntil) return;

            if (!studentAudioCtx) {
                studentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            // Auto-resume audio context if browser suspended it during a page reload
            if (studentAudioCtx.state === 'suspended') {
                studentAudioCtx.resume().catch(() => {});
            }
            unmuteHintBtn.style.display = 'none';
            const raw = atob(b64Str);
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            const int16 = new Int16Array(bytes.buffer);
            if (int16.length === 0) return;

            const rate = sampleRate || TARGET_SAMPLE_RATE;
            const audioBuffer = studentAudioCtx.createBuffer(1, int16.length, rate);
            const channel = audioBuffer.getChannelData(0);

            const now = studentAudioCtx.currentTime;
            const isNewPhrase = (nextAdminPlayTime < now);

            for (let i = 0; i < int16.length; i++) {
                let val = (int16[i] / 32768.0) * 1.3;
                if (val > 1.0) val = 1.0;
                else if (val < -1.0) val = -1.0;

                if (isNewPhrase && i < 24) val *= (i / 24);
                channel[i] = val;
            }

            if (isNewPhrase) nextAdminPlayTime = now + 0.20;
            else if (nextAdminPlayTime - now > 2.5) nextAdminPlayTime = now + 0.20;

            const src = studentAudioCtx.createBufferSource();
            src.buffer = audioBuffer;
            src.connect(studentAudioCtx.destination);
            src.start(nextAdminPlayTime);
            nextAdminPlayTime += audioBuffer.duration;

            const remainingPlayMs = Math.max(0, (nextAdminPlayTime - now) * 1000);
            lastAdminAudioPlayedMs = Date.now() + remainingPlayMs + 450;
        }

       // Dedicated Dual-Track WebRTC Video Tunnel (Fast ICE + Zero-Delay Playout)
        function waitForIce(pc, maxTimeout = 600) {
            return new Promise(resolve => {
                if (pc.iceGatheringState === 'complete') return resolve();
                let resolved = false;
                let quickTimer = null;
                const done = () => {
                    if (resolved) return;
                    resolved = true;
                    clearTimeout(maxTimer);
                    if (quickTimer) clearTimeout(quickTimer);
                    resolve();
                };
                const maxTimer = setTimeout(done, maxTimeout);
                pc.addEventListener('icecandidate', (e) => {
                    if (!e.candidate) {
                        done();
                    } else if (e.candidate.candidate && (e.candidate.candidate.includes('srflx') || e.candidate.candidate.includes('host'))) {
                        if (!quickTimer) quickTimer = setTimeout(done, 120);
                    }
                });
                pc.addEventListener('icegatheringstatechange', () => {
                    if (pc.iceGatheringState === 'complete') done();
                });
            });
        }

       function attachLowLatencyVideo(videoEl, track, receiver) {
            // Render every incoming 30 FPS WebRTC frame immediately without seeking or resetting the decoder
            if (receiver) {
                try {
                    if ('playoutDelayHint' in receiver) receiver.playoutDelayHint = 0;
                    if ('jitterBufferTarget' in receiver) receiver.jitterBufferTarget = 0;
                } catch (e) {}
            }
            videoEl.srcObject = new MediaStream([track]);
            videoEl.play().catch(() => {});
        }

        async function connectToAdminVideo() {
            if (isJoiningRtc || !liveToken || !currentQuizId) return;
            isJoiningRtc = true;
            // BUG 2 FIX: Ensure the joining lock resets even if ICE gathering silently hangs
            setTimeout(() => { isJoiningRtc = false; }, 10000);
            try {
                if (studentPc) studentPc.close();
                studentPc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
                    iceCandidatePoolSize: 4
                });

                studentPc.addTransceiver('video', { direction: 'recvonly' }); // Track 0: Webcam PIP
                studentPc.addTransceiver('video', { direction: 'recvonly' }); // Track 1: PPT Presentation

                studentPc.ontrack = (event) => {
                    if (event.track.kind === 'video') {
                        const transceivers = studentPc.getTransceivers();
                        const trackIndex = transceivers.findIndex(t => t.receiver === event.receiver);
                        const assignedIndex = (trackIndex !== -1) ? trackIndex : (remoteVideo.srcObject ? 1 : 0);

                        const freshStream = new MediaStream([event.track]);
                        if (assignedIndex === 0) {
                            remoteVideo.srcObject = freshStream;
                            remoteVideo.play().catch(() => {});
                        } else {
                            pptVideo.srcObject = freshStream;
                            pptVideo.play().catch(() => {});
                        }
                    }
                };

                const offer = await studentPc.createOffer();
                await studentPc.setLocalDescription(offer);
                await waitForIce(studentPc, 600);

                await fetch('/api/live/rtc/student/webrtc-offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${liveToken}` },
                    body: JSON.stringify({ quizId: currentQuizId, offer: studentPc.localDescription })
                });
            } catch (e) {
                isJoiningRtc = false;
            }
        }

        async function stopStudentCall() {
            isCallActive = false;
            isCallPushing = false;
            pendingCallSamples = [];
            studentPreRollBuffers = [];
            try { localStorage.removeItem('pp_student_call_same_pc'); } catch (e) {}
            callBtn.textContent = '📞 Call Sir';
            callBtn.classList.remove('on-call');

            if (callPushInterval) {
                clearInterval(callPushInterval);
                callPushInterval = null;
            }
            if (studentMicProcessor) {
                try { studentMicProcessor.disconnect(); } catch (e) {}
                studentMicProcessor = null;
            }
            if (studentMicSource) {
                try { studentMicSource.disconnect(); } catch (e) {}
                studentMicSource = null;
            }
            if (studentMicStream) {
                studentMicStream.getTracks().forEach(t => t.stop());
                studentMicStream = null;
            }

            if (liveToken && currentQuizId) {
                await fetch('/api/live/rtc/student/call', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${liveToken}`
                    },
                    body: JSON.stringify({ quizId: currentQuizId, callActive: false })
                }).catch(() => {});
            }
        }

        function teardownStream() {
            document.body.classList.remove('rtc-stream-active');
            document.body.classList.remove('rtc-presentation-active');
            // BUG 2 FIX: Aggressively wipe stale video bindings so they can cleanly accept new streams
            if (remoteVideo) { remoteVideo.srcObject = null; remoteVideo.load(); }
            if (pptVideo) { pptVideo.srcObject = null; pptVideo.load(); }
            if (pipBox) pipBox.style.display = 'none';
            if (remoteVideo) remoteVideo.style.display = 'none';
            if (presentationScreen) presentationScreen.style.display = 'none';
            if (quizScreen && testActive) quizScreen.style.display = 'block';
            
            lastAdminAudioSeq = 0;
            hasSyncedInitialSeq = false;
            
            if (studentPc) {
                try { studentPc.close(); } catch (e) {}
                studentPc = null;
            }
            isJoiningRtc = false;
            if (isCallActive) stopStudentCall();
        }

        callBtn.addEventListener('click', async () => {
            ensureStudentAudioCtx();

            if (!isCallActive) {
                try {
                    studentMicStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true,
                            channelCount: 1
                        }
                    });

                    studentMicSource = studentAudioCtx.createMediaStreamSource(studentMicStream);

                    const hpFilter = studentAudioCtx.createBiquadFilter();
                    hpFilter.type = 'highpass';
                    hpFilter.frequency.value = 125;

                    const presenceFilter = studentAudioCtx.createBiquadFilter();
                    presenceFilter.type = 'peaking';
                    presenceFilter.frequency.value = 2650;
                    presenceFilter.Q.value = 1.0;
                    presenceFilter.gain.value = 4.0;

                    studentMicProcessor = studentAudioCtx.createScriptProcessor(2048, 1, 1);
                    studentSilentSink = studentAudioCtx.createMediaStreamDestination();

                    pendingCallSamples = [];
                    studentPreRollBuffers = [];
                    let wasStudentSpeaking = false;
                    const callWarmupUntil = Date.now() + 1200;

                    studentMicProcessor.onaudioprocess = (e) => {
                        if (!isCallActive) return;
                        const nowMs = Date.now();

                        if (nowMs < lastAdminAudioPlayedMs) {
                            studentPreRollBuffers = [];
                            wasStudentSpeaking = false;
                            return;
                        }

                        try {
                            const adminSpkUntil = Number(localStorage.getItem('pp_admin_speaker_active_until') || 0);
                            if (nowMs < adminSpkUntil) {
                                studentPreRollBuffers = [];
                                wasStudentSpeaking = false;
                                return;
                            }
                        } catch (err) {}

                        const input = e.inputBuffer.getChannelData(0);
                        let sumSq = 0;
                        for (let i = 0; i < input.length; i++) sumSq += input[i] * input[i];
                        const rms = Math.sqrt(sumSq / input.length);

                        const inEchoTail = (nowMs >= studentActivelySpeakingUntil) && (nowMs < echoReflectionGuardUntil);
                        const activeThreshold = inEchoTail
                            ? Math.max(0.022, recentSpeechPeakRms * 0.55)
                            : 0.0055;

                        if (rms > activeThreshold || nowMs < callWarmupUntil) {
                            if (rms > 0.01) {
                                recentSpeechPeakRms = (0.7 * recentSpeechPeakRms) + (0.3 * rms);
                            }
                            studentActivelySpeakingUntil = nowMs + 700; 
                            echoReflectionGuardUntil = nowMs + 1350;    
                        }

                        const down = downsampleAndEnhance(input, studentAudioCtx.sampleRate, TARGET_SAMPLE_RATE, 1.55);

                        if (nowMs < studentActivelySpeakingUntil) {
                            if (!wasStudentSpeaking && studentPreRollBuffers.length > 0) {
                                for (let b = 0; b < studentPreRollBuffers.length; b++) {
                                    const pre = studentPreRollBuffers[b];
                                    for (let j = 0; j < pre.length; j++) pendingCallSamples.push(pre[j]);
                                }
                                studentPreRollBuffers = [];
                            }
                            wasStudentSpeaking = true;

                            for (let i = 0; i < down.length; i++) pendingCallSamples.push(down[i]);
                            if (pendingCallSamples.length > 16000) pendingCallSamples = pendingCallSamples.slice(-16000);
                        } else {
                            wasStudentSpeaking = false;
                            studentPreRollBuffers.push(down);
                            if (studentPreRollBuffers.length > 4) studentPreRollBuffers.shift();
                        }
                    };

                    studentMicSource.connect(hpFilter);
                    hpFilter.connect(presenceFilter);
                    presenceFilter.connect(studentMicProcessor);
                    studentMicProcessor.connect(studentSilentSink);

                    isCallActive = true;
                    isCallPushing = false;
                    callBtn.textContent = '🔴 End Call';
                    callBtn.classList.add('on-call');

                    callPushInterval = setInterval(async () => {
                        if (!isCallActive || isCallPushing || !liveToken || !currentQuizId) return;
                        isCallPushing = true;

                        try {
                            let chunkB64 = null;
                            if (pendingCallSamples.length > 0) {
                                const int16 = new Int16Array(pendingCallSamples);
                                pendingCallSamples = [];
                                chunkB64 = int16ToBase64(int16);
                            }
                            const callRes = await fetch('/api/live/rtc/student/call', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${liveToken}`
                                },
                                body: JSON.stringify({
                                    quizId: currentQuizId,
                                    callActive: true,
                                    audioChunk: chunkB64,
                                    rate: TARGET_SAMPLE_RATE
                                })
                            });

                            if (callRes && callRes.ok) {
                                const callData = await callRes.json().catch(() => ({}));
                                if (callData.streamEnded && isCallActive) {
                                    await stopStudentCall();
                                }
                            }
                        } catch (e) {
                        } finally {
                            isCallPushing = false;
                        }
                    }, 130);
                } catch (err) {
                    alert('Please allow microphone access to talk to Sir.');
                }
            } else {
                await stopStudentCall();
            }
        });

        // Fast 130ms Pull Loop for Audio, WebRTC State & Seamless Question/Presentation Swapping
        setInterval(async () => {
            if (!liveToken || !currentQuizId || !testActive) {
                if (pipBox.style.display !== 'none') teardownStream();
                return;
            }
            if (isPulling) return;
            isPulling = true;

            try {
                const syncFlag = hasSyncedInitialSeq ? '1' : '0';
                const res = await fetch(`/api/live/rtc/student/status/${currentQuizId}?afterSeq=${lastAdminAudioSeq}&synced=${syncFlag}`, {
                    headers: { 'Authorization': `Bearer ${liveToken}` }
                });
                if (!res.ok) return;
                const status = await res.json();

                if (!status.broadcastActive) {
                    if (pipBox.style.display !== 'none') teardownStream();
                    return;
                }

                document.body.classList.add('rtc-stream-active');
                pipBox.style.display = 'flex';

                if (!studentPc && !isJoiningRtc) {
                    connectToAdminVideo();
                }

                if (status.webrtcAnswer && studentPc && studentPc.signalingState === 'have-local-offer') {
                    await studentPc.setRemoteDescription(new RTCSessionDescription(status.webrtcAnswer));
                    isJoiningRtc = false;
                }

                // Swap Main Screen between Question Card & Left-Aligned Large Presentation
                if (status.broadcastMode === 'presentation') {
                    document.body.classList.add('rtc-presentation-active');
                    if (quizScreen) quizScreen.style.display = 'none';
                    if (presentationScreen) presentationScreen.style.display = 'block';
                } else {
                    document.body.classList.remove('rtc-presentation-active');
                    if (presentationScreen) presentationScreen.style.display = 'none';
                    if (quizScreen) quizScreen.style.display = 'block';
                }

                if (status.videoEnabled) {
                    remoteVideo.style.display = 'block';
                    videoPlaceholder.style.display = 'none';
                } else {
                    remoteVideo.style.display = 'none';
                    videoPlaceholder.style.display = 'block';
                    videoPlaceholder.textContent = status.audioEnabled ? '🎙️ Live HD Audio Active' : '⏸️ Stream Paused';
                }

                if (!hasSyncedInitialSeq) {
                    lastAdminAudioSeq = status.latestSeq || 0;
                    hasSyncedInitialSeq = true;
                }

                if (Array.isArray(status.audioChunks) && status.audioChunks.length > 0) {
                    status.audioChunks.forEach(chunk => {
                        if (chunk.seq > lastAdminAudioSeq) {
                            lastAdminAudioSeq = chunk.seq;
                            playAdminPcmBase64(chunk.pcm, chunk.rate);
                        }
                    });
                }
            } catch (e) {
            } finally {
                isPulling = false;
            }
        }, 130);
    })();
    </script>
