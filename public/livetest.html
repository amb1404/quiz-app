<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Test - Pioneers Prep</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8fafc; margin: 0; padding: 15px; box-sizing: border-box; }
        body.rtc-stream-active { align-items: flex-start !important; }
        body.rtc-stream-active #quiz-screen { margin-top: 185px !important; }
        .live-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; text-transform: uppercase;}
        .opt-btn { width: 100%; padding: 15px; margin: 8px 0; border: 2px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; font-size: 16px; transition: 0.2s;}
        .opt-btn.locked { opacity: 0.6; cursor: not-allowed; }
        .opt-btn.selected { border-color: #4285f4; background-color: #eff6ff; font-weight: bold; }

        #student-pip-box {
            position: fixed; top: 12px; right: 12px; width: 210px;
            background: #0f172a; border: 2px solid #2563eb; border-radius: 12px;
            overflow: hidden; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 9995; display: none; flex-direction: column; touch-action: none; user-select: none;
        }
        @media (max-width: 600px) { #student-pip-box { width: 175px; top: 10px; right: 10px; } }
        #student-pip-header { background: #1e293b; color: #f8fafc; font-size: 11px; font-weight: bold; padding: 6px 10px; cursor: grab; display: flex; justify-content: space-between; align-items: center; }
        #student-pip-header:active { cursor: grabbing; }
        #student-video-stage { position: relative; width: 100%; height: 112px; background: #000; display: flex; align-items: center; justify-content: center; }
        @media (max-width: 600px) { #student-video-stage { height: 96px; } }
        #student-remote-video { width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); }
        #student-video-placeholder { color: #94a3b8; font-size: 12px; font-weight: bold; text-align: center; padding: 8px; }
        #btn-unmute-hint {
            position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
            background: rgba(245, 158, 11, 0.95); color: #0f172a; border: none; border-radius: 12px; padding: 4px 10px; font-size: 11px; font-weight: bold; cursor: pointer; display: none; white-space: nowrap;
        }
        #student-pip-controls { padding: 6px; background: #0f172a; display: flex; gap: 6px; }
        #btn-student-call { width: 100%; padding: 7px 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; background: #10b981; color: white; }
        #btn-student-call.on-call { background: #ef4444; }
        
        body.rtc-presentation-active { justify-content: flex-start !important; align-items: flex-start !important; padding: 12px 16px !important; }
        body.rtc-presentation-active #presentation-screen { margin-top: 0 !important; margin-left: 0 !important; margin-right: auto !important; width: calc(100vw - 250px) !important; max-width: calc(100vw - 250px) !important; }
        #presentation-screen { display: none; width: 100%; background: #0f172a; border: 2px solid #3b82f6; border-radius: 12px; overflow: hidden; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35); box-sizing: border-box; }
        #presentation-header { background: #1e293b; color: #f8fafc; padding: 8px 16px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        #ppt-stage { position: relative; width: 100%; background: #000; }
        #student-ppt-video { width: 100%; height: calc(100vh - 68px); max-height: 88vh; object-fit: contain; background: #000; display: block; transform: none !important; }
        #presentation-screen:fullscreen #student-ppt-video { height: calc(100vh - 44px); max-height: none; }
        #student-ppt-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 14px; font-weight: bold; padding: 16px; text-align: center; pointer-events: none; background: #0f172a; }
        @media (max-width: 768px) { body.rtc-presentation-active #presentation-screen { margin-top: 175px !important; width: 100% !important; max-width: 100% !important; } #student-ppt-video { height: auto; max-height: 68vh; } }
        
        body.rtc-both-active { justify-content: flex-start !important; align-items: flex-start !important; gap: 16px !important; padding: 12px 16px !important; flex-wrap: wrap !important; }
        body.rtc-both-active #presentation-screen { display: block !important; width: calc(60vw - 24px) !important; max-width: calc(60vw - 24px) !important; margin: 0 !important; }
        body.rtc-both-active #quiz-screen { display: block !important; width: calc(40vw - 28px) !important; max-width: calc(40vw - 28px) !important; margin-top: 175px !important; }
        @media (max-width: 960px) { body.rtc-both-active #presentation-screen { margin-top: 175px !important; width: 100% !important; max-width: 100% !important; } body.rtc-both-active #quiz-screen { margin-top: 12px !important; width: 100% !important; max-width: 100% !important; } }
        #quiz-screen.pdf-active { max-width: 860px; padding: 18px; }
        #live-pdf-viewer { display: none; width: 100%; max-height: 75vh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; box-sizing: border-box; text-align: center; }
        #live-pdf-pages canvas { width: 100% !important; height: auto !important; display: block; margin: 0 auto 12px auto; border-radius: 4px; background: #ffffff; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.15); }
        @media print { #student-pip-box { display: none !important; } }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>
    <div id="auth-screen" class="live-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="color: #2563eb; margin: 0;">🚪 Join Room</h2>
            <button id="refresh-rooms-btn" type="button" style="background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;">🔄 Refresh</button>
        </div>
        <p style="color: #64748b; font-size: 14px; margin-top: 0; margin-bottom: 18px;">Select an active classroom below to join the live session immediately:</p>
        <div id="live-rooms-list" style="display: flex; flex-direction: column; gap: 10px; text-align: left;">
            <div style="padding: 18px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; text-align: center; color: #64748b; font-weight: bold;">
                Loading available rooms...
            </div>
        </div>
    </div>

    <div id="presentation-screen">
        <div id="presentation-header">
            <span>🖥️ Live Presentation Broadcast</span>
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <button id="btn-ppt-unmute-hint" type="button" style="display: none; background: #f59e0b; color: #0f172a; border: none; border-radius: 12px; padding: 4px 10px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap;">🔊 Tap to Enable Audio</button>
                <span style="color: #34d399;">● LIVE SLIDES</span>
                <button id="btn-ppt-fullscreen" type="button" title="Go Fullscreen" style="background: #2563eb; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                    ⛶ Fullscreen
                </button>
            </div>
        </div>
        <div id="ppt-stage">
            <video id="student-ppt-video" autoplay playsinline muted disablepictureinpicture></video>
            <div id="student-ppt-placeholder">⏳ Waiting for Sir's presentation slides...</div>
        </div>
    </div>

    <div id="quiz-screen" class="live-container" style="display: none;">
        <div style="display: flex; justify-content: space-between; color: #64748b; margin-bottom: 20px; font-weight: bold;">
            <span id="live-status">Waiting for Admin...</span>
            <span id="live-progress">Q: -/-</span>
        </div>
        <h3 id="question-text" style="font-size: 20px; color: #1e293b; margin-bottom: 25px; text-align: left;"></h3>
        <div id="options-container" style="text-align: left;"></div>
        <div id="live-pdf-viewer">
            <div id="live-pdf-status" style="color: #475569; font-weight: bold; font-size: 13px; padding: 12px;">Loading PDF pages...</div>
            <div id="live-pdf-pages"></div>
        </div>
    </div>

    <div id="student-pip-box" class="no-print">
        <div id="student-pip-header">
            <span>⠿ Drag Video</span>
            <span style="color: #34d399;">● LIVE HD</span>
        </div>
        <div id="student-video-stage">
            <video id="student-remote-video" autoplay playsinline muted disablepictureinpicture></video>
            <div id="student-video-placeholder">🎙️ Live Audio Broadcast</div>
            <button id="btn-unmute-hint" type="button">🔊 Tap to Enable Audio</button>
        </div>
        <div id="student-pip-controls">
            <button id="btn-student-call" type="button">📞 Speak</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"></script>
    <script src="/js/livetest.js"></script>
    <script>
    const room = new LivekitClient.Room({
        adaptiveStream: false,
        dynacast: false
    });
    let activeAudioEl = null;
    let activeScreenTrack = null;
    let activeScreenTrackSid = null;
    let screenWatchdogTimer = null;
    let studentMicTrack = null;
    let studentMicStream = null;
    let isConnectingLiveKit = false;
    window.studentMutedByAdmin = false;

    // Strict check: Only allow tracks from the Admin instructor
    function isAdminParticipant(participant) {
        if (!participant) return false;
        const id = String(participant.identity || '').trim().toLowerCase();
        if (id === 'admin' || id.startsWith('admin_')) return true;
        try {
            if (participant.metadata) {
                const meta = JSON.parse(participant.metadata);
                if (meta && meta.role === 'admin') return true;
            }
        } catch (e) {}
        return false;
    }

    window.currentBroadcastMode = window.currentBroadcastMode || 'question';

    function isPptVisibleMode() {
        return window.currentBroadcastMode === 'presentation' || window.currentBroadcastMode === 'both';
    }

    function isScreenPublication(pub) {
        if (!pub) return false;
        return pub.trackName === 'screen' ||
            (LivekitClient.Track && LivekitClient.Track.Source && pub.source === LivekitClient.Track.Source.ScreenShare);
    }

    function setPptPlaceholderVisible(show) {
        const ph = document.getElementById('student-ppt-placeholder');
        if (ph) ph.style.display = show ? 'flex' : 'none';
    }

    function setAudioUnmuteHintsVisible(show) {
        const val = show ? 'block' : 'none';
        const pipHint = document.getElementById('btn-unmute-hint');
        const pptHint = document.getElementById('btn-ppt-unmute-hint');
        if (pipHint) pipHint.style.display = val;
        if (pptHint) pptHint.style.display = val;
    }

    // Lightweight playback-only silent keep-alive so iOS Safari does not suspend background tab during long Admin mutes
    const _isIosStudent = /iPad|iPhone|iPod/i.test(navigator.userAgent || '') ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    let _iosKeepAliveCtx = null;
    let _iosKeepAliveOsc = null;

    function ensureIosBackgroundAudioKeepAlive() {
        if (!_isIosStudent || typeof testActive === 'undefined' || !testActive) return;
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            if (!_iosKeepAliveCtx) {
                _iosKeepAliveCtx = new AudioCtx();
                const osc = _iosKeepAliveCtx.createOscillator();
                const gain = _iosKeepAliveCtx.createGain();
                osc.frequency.value = 20;
                gain.gain.value = 0.00001;
                osc.connect(gain);
                gain.connect(_iosKeepAliveCtx.destination);
                osc.start();
                _iosKeepAliveOsc = osc;
            }
            if (_iosKeepAliveCtx.state === 'suspended') {
                _iosKeepAliveCtx.resume().catch(() => {});
            }
        } catch (e) {}
    }

    function stopIosBackgroundAudioKeepAlive() {
        try { if (_iosKeepAliveOsc) _iosKeepAliveOsc.stop(); } catch (e) {}
        try { if (_iosKeepAliveCtx) _iosKeepAliveCtx.close(); } catch (e) {}
        _iosKeepAliveOsc = null;
        _iosKeepAliveCtx = null;
    }

    // Refuse other students' tracks AND pause 1.5 Mbps PPT download while in Question/PDF mode
    function syncParticipantSubscriptions(participant) {
        if (!participant) return;
        const isAdmin = isAdminParticipant(participant);
        try {
            participant.trackPublications.forEach((pub) => {
                if (!isAdmin) {
                    if (typeof pub.setSubscribed === 'function') pub.setSubscribed(false);
                } else {
                    const isScreen = isScreenPublication(pub);
                    const wantSub = isScreen ? isPptVisibleMode() : true;
                    if (typeof pub.setSubscribed === 'function' && pub.isSubscribed !== wantSub) {
                        pub.setSubscribed(wantSub);
                    }
                    const mst = pub.track && pub.track.mediaStreamTrack;
                    if (wantSub && pub.track && (!mst || mst.readyState !== 'ended')) {
                        attachAdminTrackToDOM(pub.track, pub);
                    } else if (isScreen && !wantSub) {
                        clearAdminTrackFromDOM('video', true, pub.track || null, pub.trackSid || null);
                    }
                }
            });
        } catch (e) {}
    }

    function getOrCreateAdminAudioEl() {
        if (!activeAudioEl || !document.body.contains(activeAudioEl)) {
            activeAudioEl = document.getElementById('student-admin-audio') || document.createElement('audio');
            activeAudioEl.id = 'student-admin-audio';
            activeAudioEl.autoplay = true;
            activeAudioEl.playsInline = true;
            activeAudioEl.style.display = 'none';
            if (!document.body.contains(activeAudioEl)) {
                document.body.appendChild(activeAudioEl);
            }
        }
        return activeAudioEl;
    }

    const unlockStudentAudioOnce = () => {
        const el = getOrCreateAdminAudioEl();
        ensureIosBackgroundAudioKeepAlive();
        if (room.state === 'connected' && !room.canPlaybackAudio) {
            try { room.startAudio(); } catch (e) {}
        }
        if (el && el.srcObject && el.paused) {
            el.play().then(() => setAudioUnmuteHintsVisible(false)).catch(() => {});
        }
    };
    document.addEventListener('click', unlockStudentAudioOnce, { passive: true });
    document.addEventListener('touchstart', unlockStudentAudioOnce, { passive: true });

    // Helper to keep Admin's voice playing without interrupting an already-playing stream every 5s
    async function ensureAdminAudioPlaying(force = false) {
        if (force || !room.canPlaybackAudio) {
            try { await room.startAudio(); } catch (e) {}
        }
        if (activeAudioEl && activeAudioEl.srcObject) {
            activeAudioEl.muted = false;
            activeAudioEl.volume = 1.0;
            if (force || activeAudioEl.paused) {
                activeAudioEl.play()
                    .then(() => setAudioUnmuteHintsVisible(false))
                    .catch(() => setAudioUnmuteHintsVisible(true));
            }
        }
    }

    function attachAdminTrackToDOM(track, publication) {
        if (!track || !publication) return;
        const isScreenTrack = publication.trackName === 'screen' ||
            (LivekitClient.Track && LivekitClient.Track.Source && publication.source === LivekitClient.Track.Source.ScreenShare);

        if (track.kind === 'video') {
            if (isScreenTrack) {
                const pptVideo = document.getElementById('student-ppt-video');
                if (pptVideo) {
                    const pubSid = publication.trackSid || track.sid || '';
                    const isSameTrack = Boolean(activeScreenTrack === track && (!pubSid || activeScreenTrackSid === pubSid));
                    const livePptTracks = pptVideo.srcObject ? pptVideo.srcObject.getVideoTracks().filter(t => t.readyState === 'live') : [];
                    const hasMatchingTrack = Boolean(
                        track.mediaStreamTrack &&
                        livePptTracks.some(t => t === track.mediaStreamTrack || t.id === track.mediaStreamTrack.id)
                    );
                    const isActivelyRendering = hasMatchingTrack && !pptVideo.paused && pptVideo.readyState >= 2 && pptVideo.videoWidth > 0;

                    if (!isSameTrack || !isActivelyRendering) {
                        if (activeScreenTrack && activeScreenTrack !== track) {
                            try { activeScreenTrack.detach(pptVideo); } catch (e) {}
                        }
                        activeScreenTrack = track;
                        activeScreenTrackSid = pubSid || null;

                        try {
                            if (typeof publication.setVideoQuality === 'function' && LivekitClient.VideoQuality) {
                                publication.setVideoQuality(LivekitClient.VideoQuality.HIGH);
                            }
                            if (typeof publication.setVideoDimensions === 'function') {
                                publication.setVideoDimensions({ width: 1920, height: 1080 });
                            }
                        } catch (e) {}

                        try { track.detach(pptVideo); } catch (e) {}
                        pptVideo.srcObject = null;
                        track.attach(pptVideo);
                        pptVideo.muted = true;
                        pptVideo.playsInline = true;
                        pptVideo.play().catch(() => {});

                        if (screenWatchdogTimer) clearTimeout(screenWatchdogTimer);
                        screenWatchdogTimer = setTimeout(() => {
                            screenWatchdogTimer = null;
                            if (activeScreenTrack !== track) return;
                            const v = document.getElementById('student-ppt-video');
                            if (!v || !track.mediaStreamTrack || track.mediaStreamTrack.readyState !== 'live') return;
                            if (v.paused || v.readyState < 2 || v.videoWidth === 0) {
                                try { track.detach(v); } catch (e) {}
                                v.srcObject = new MediaStream([track.mediaStreamTrack]);
                                v.muted = true;
                                v.playsInline = true;
                                v.play().catch(() => {});
                            }
                        }, 700);
                    }

                    pptVideo.muted = true;
                    if (pptVideo.readyState >= 2 && pptVideo.videoWidth > 0) {
                        setPptPlaceholderVisible(false);
                    }
                    if (pptVideo.paused) {
                        pptVideo.play().catch(() => {});
                    }
                }
            } else {
                const videoEl = document.getElementById('student-remote-video');
                const pipBox = document.getElementById('student-pip-box');
                const placeholder = document.getElementById('student-video-placeholder');
                if (videoEl) {
                    const liveCamTracks = videoEl.srcObject ? videoEl.srcObject.getVideoTracks().filter(t => t.readyState === 'live') : [];
                    const hasValidSrc = Boolean(videoEl.srcObject && videoEl.srcObject.active !== false && liveCamTracks.length > 0);
                    const alreadyAttached = Array.isArray(track.attachedElements) && track.attachedElements.includes(videoEl) && hasValidSrc;
                    if (!alreadyAttached) {
                        try {
                            if (typeof publication.setVideoQuality === 'function' && LivekitClient.VideoQuality) {
                                publication.setVideoQuality(LivekitClient.VideoQuality.LOW);
                            }
                            if (typeof publication.setVideoDimensions === 'function') {
                                publication.setVideoDimensions({ width: 320, height: 180 });
                            }
                        } catch (e) {}
                        try { track.detach(videoEl); } catch (e) {}
                        track.attach(videoEl);
                    }
                    videoEl.muted = true;
                    videoEl.style.display = 'block';
                    if (videoEl.paused || videoEl.readyState < 2) {
                        videoEl.play().catch(() => {});
                    }
                }
                if (pipBox) pipBox.style.display = 'flex';
                if (placeholder) placeholder.style.display = 'none';
                document.body.classList.add('rtc-stream-active');
            }
        } else if (track.kind === 'audio') {
            const pipBox = document.getElementById('student-pip-box');
            if (pipBox) pipBox.style.display = 'flex';
            document.body.classList.add('rtc-stream-active');

            const audioEl = getOrCreateAdminAudioEl();
            const liveAudioTracks = audioEl.srcObject ? audioEl.srcObject.getAudioTracks().filter(t => t.readyState === 'live') : [];
            const alreadyAttached = Array.isArray(track.attachedElements) && track.attachedElements.includes(audioEl) && liveAudioTracks.length > 0;
            if (alreadyAttached) {
                if (audioEl.paused) ensureAdminAudioPlaying(true);
                return;
            }
            try { audioEl.srcObject = null; } catch (e) {}
            track.attach(audioEl);
            ensureAdminAudioPlaying(true);
        }
    }

    function clearVideoFrame(videoEl) {
        if (!videoEl) return;
        try { videoEl.pause(); } catch (e) {}
        videoEl.srcObject = null;
    }

    function clearAdminTrackFromDOM(kind, isScreenTrack, track = null, trackSid = null) {
        if (kind === 'video') {
            if (isScreenTrack) {
                // Ignore stale cleanup events from a previous PPT window once a newer window is active
                if (trackSid && activeScreenTrackSid && trackSid !== activeScreenTrackSid) {
                    if (track) { try { track.detach(); } catch (e) {} }
                    return;
                }
                if (track && activeScreenTrack && track !== activeScreenTrack) {
                    try { track.detach(); } catch (e) {}
                    return;
                }
                if (screenWatchdogTimer) {
                    clearTimeout(screenWatchdogTimer);
                    screenWatchdogTimer = null;
                }
                activeScreenTrack = null;
                activeScreenTrackSid = null;
                const pptVid = document.getElementById('student-ppt-video');
                if (pptVid) {
                    if (track) { try { track.detach(pptVid); } catch (e) {} }
                    clearVideoFrame(pptVid);
                }
                setPptPlaceholderVisible(true);
            } else {
                const remVid = document.getElementById('student-remote-video');
                if (remVid) {
                    if (track) { try { track.detach(remVid); } catch (e) {} }
                    clearVideoFrame(remVid);
                    remVid.style.display = 'none';
                }
                const placeholder = document.getElementById('student-video-placeholder');
                if (placeholder) placeholder.style.display = 'block';
            }
        } else if (kind === 'audio') {
            if (activeAudioEl) {
                if (track) { try { track.detach(activeAudioEl); } catch (e) {} }
                try { activeAudioEl.pause(); activeAudioEl.srcObject = null; } catch (e) {}
            }
        }
    }

    function clearAllAdminFeeds() {
        clearAdminTrackFromDOM('video', true);
        clearAdminTrackFromDOM('video', false);
        clearAdminTrackFromDOM('audio', false);
    }

    function forceReattachAdminVideosOnly() {
        try {
            room.remoteParticipants.forEach((participant) => {
                if (!isAdminParticipant(participant)) return;
                participant.videoTrackPublications.forEach((pub) => {
                    if (!pub.track) return;
                    const isScreen = pub.trackName === 'screen' ||
                        (LivekitClient.Track && LivekitClient.Track.Source && pub.source === LivekitClient.Track.Source.ScreenShare);
                    const el = document.getElementById(isScreen ? 'student-ppt-video' : 'student-remote-video');
                    if (el && (el.paused || el.readyState < 2 || el.videoWidth === 0)) {
                        try { pub.track.detach(el); } catch (e) {}
                        pub.track.attach(el);
                        el.muted = true;
                        el.play().catch(() => {});
                    }
                });
            });
        } catch (e) {}
    }

    // Sweep all existing participants in the room and attach Admin's feeds immediately on join/rejoin/tab return
    function reattachAllAdminFeeds(forceVideoResume = false) {
        try {
            let hasAdminInRoom = false;
            room.remoteParticipants.forEach((participant) => {
                if (isAdminParticipant(participant)) hasAdminInRoom = true;
                syncParticipantSubscriptions(participant);
            });
            if (!hasAdminInRoom) {
                clearAllAdminFeeds();
                return;
            }
            const pptVideo = document.getElementById('student-ppt-video');
            if (pptVideo && pptVideo.srcObject) {
                requestAnimationFrame(() => {
                    if (pptVideo.paused || forceVideoResume) pptVideo.play().catch(() => {});
                });
            }
            const camVideo = document.getElementById('student-remote-video');
            if (camVideo && camVideo.srcObject && (camVideo.paused || forceVideoResume)) {
                camVideo.play().catch(() => {});
            }
            if (forceVideoResume) {
                setTimeout(forceReattachAdminVideosOnly, 250);
            }
            ensureAdminAudioPlaying();
        } catch (e) {}
    }
    window.reattachAllAdminFeeds = reattachAllAdminFeeds;

    room.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
        syncParticipantSubscriptions(participant);
    });

    room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
        if (isAdminParticipant(participant)) {
            let anotherAdminPresent = false;
            room.remoteParticipants.forEach((p) => {
                if (p !== participant && isAdminParticipant(p)) anotherAdminPresent = true;
            });
            if (anotherAdminPresent) {
                reattachAllAdminFeeds(false);
            } else {
                clearAllAdminFeeds();
            }
        }
    });

    room.on(LivekitClient.RoomEvent.Disconnected, () => {
        clearAllAdminFeeds();
    });

    room.on(LivekitClient.RoomEvent.TrackPublished, (publication, participant) => {
        if (!isAdminParticipant(participant)) {
            try {
                if (typeof publication.setSubscribed === 'function') {
                    publication.setSubscribed(false);
                }
            } catch (e) {}
        } else {
            try {
                const isScreen = isScreenPublication(publication);
                const wantSub = isScreen ? isPptVisibleMode() : true;
                if (typeof publication.setSubscribed === 'function') {
                    publication.setSubscribed(wantSub);
                }
                if (wantSub && publication.track) {
                    attachAdminTrackToDOM(publication.track, publication);
                }
            } catch (e) {}
        }
    });

    room.on(LivekitClient.RoomEvent.TrackUnpublished, (publication, participant) => {
        if (!isAdminParticipant(participant)) return;
        const isScreenTrack = isScreenPublication(publication);
        clearAdminTrackFromDOM(publication.kind, isScreenTrack, publication.track || null, publication.trackSid || null);
        setTimeout(() => reattachAllAdminFeeds(true), 200);
    });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
        if (!isAdminParticipant(participant)) {
            try {
                if (typeof publication.setSubscribed === 'function') {
                    publication.setSubscribed(false);
                }
            } catch (e) {}
            return;
        }
        attachAdminTrackToDOM(track, publication);
    });

    room.on(LivekitClient.RoomEvent.TrackUnmuted, (publication, participant) => {
        if (isAdminParticipant(participant)) {
            reattachAllAdminFeeds(true);
        }
    });

    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
        if (!isAdminParticipant(participant)) return;
        const isScreenTrack = isScreenPublication(publication);
        clearAdminTrackFromDOM(track.kind, isScreenTrack, track, publication.trackSid || null);
        setTimeout(() => reattachAllAdminFeeds(true), 200);
    });

    room.on(LivekitClient.RoomEvent.Reconnected, async () => {
        reattachAllAdminFeeds();
        if (studentMicTrack && studentMicTrack.readyState === 'live' && !window.studentMutedByAdmin) {
            try {
                const alreadyPub = Array.from(room.localParticipant.audioTrackPublications.values())
                    .some(p => p.track === studentMicTrack || p.track?.mediaStreamTrack === studentMicTrack);
                if (!alreadyPub) {
                    await room.localParticipant.publishTrack(studentMicTrack, {
                        name: 'student_mic',
                        dtx: false,
                        red: true
                    });
                }
            } catch (e) {}
        }
    });

    const handleUnmuteHintClick = async () => {
        setAudioUnmuteHintsVisible(false);
        ensureIosBackgroundAudioKeepAlive();
        await ensureAdminAudioPlaying(true);
    };
    document.getElementById('btn-unmute-hint')?.addEventListener('click', handleUnmuteHintClick);
    document.getElementById('btn-ppt-unmute-hint')?.addEventListener('click', handleUnmuteHintClick);

    const _pptVidListen = document.getElementById('student-ppt-video');
    if (_pptVidListen) {
        _pptVidListen.addEventListener('playing', () => setPptPlaceholderVisible(false));
        _pptVidListen.addEventListener('loadeddata', () => {
            if (_pptVidListen.videoWidth > 0) setPptPlaceholderVisible(false);
        });
    }

    const fullscreenBtn = document.getElementById('btn-ppt-fullscreen');
    const presentationScreen = document.getElementById('presentation-screen');
    const pptVideoEl = document.getElementById('student-ppt-video');
    const camVideoEl = document.getElementById('student-remote-video');
    if (pptVideoEl) pptVideoEl.disablePictureInPicture = true;
    if (camVideoEl) camVideoEl.disablePictureInPicture = true;
    if (fullscreenBtn && presentationScreen) {
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                if (presentationScreen.requestFullscreen) {
                    presentationScreen.requestFullscreen().catch(() => {});
                } else if (pptVideoEl && pptVideoEl.webkitEnterFullscreen) {
                    pptVideoEl.webkitEnterFullscreen();
                }
            } else if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
        });
        document.addEventListener('fullscreenchange', () => {
            fullscreenBtn.textContent = document.fullscreenElement ? '✕ Exit Fullscreen' : '⛶ Fullscreen';
        });
    }

    async function connectLiveKit(quizId) {
        if (!quizId) return;
        if (room.state === 'connected') {
            reattachAllAdminFeeds();
            return;
        }
        if (isConnectingLiveKit || room.state === 'connecting' || room.state === 'reconnecting') return;

        isConnectingLiveKit = true;
        try {
            let myName = (typeof window.getMyStudentName === 'function' && window.getMyStudentName()) || "";
            if (!myName) {
                const tokenObj = localStorage.getItem('pp_id_token') || "";
                myName = "Student";
                if (tokenObj) {
                    const parts = tokenObj.split('|||')[0].split('|');
                    if (parts.length > 2) myName = decodeURIComponent(parts[1] + ' ' + parts[2]);
                }
            }

            const authHeader = (typeof liveToken !== 'undefined' && liveToken)
                ? { 'Authorization': `Bearer ${liveToken}` }
                : {};
            const res = await fetch(`/api/livekit/token?quizId=${encodeURIComponent(quizId)}&studentName=${encodeURIComponent(myName)}`, {
                headers: authHeader
            });
            if (!res.ok) return;
            const { token } = await res.json();

            // autoSubscribe: false guarantees this student NEVER pulls audio/video from other students
            await room.connect('wss://pioneers-prep-efmg740j.livekit.cloud:443', token, {
                autoSubscribe: false
            });
            reattachAllAdminFeeds();
        } catch (err) {
            console.error("LiveKit connection failed:", err);
        } finally {
            isConnectingLiveKit = false;
        }
    }
    window.connectLiveKit = connectLiveKit;

    // Keep mobile phone screen awake during multi-hour live lectures & PPT broadcasts
    let studentWakeLock = null;
    async function ensureStudentScreenWakeLock() {
        try {
            if ('wakeLock' in navigator && typeof testActive !== 'undefined' && testActive && document.visibilityState === 'visible') {
                if (!studentWakeLock || studentWakeLock.released) {
                    studentWakeLock = await navigator.wakeLock.request('screen');
                }
            }
        } catch (e) {}
    }
    document.addEventListener('click', ensureStudentScreenWakeLock);

    setInterval(() => {
        if (typeof testActive !== 'undefined' && testActive && typeof currentQuizId !== 'undefined' && currentQuizId) {
            ensureStudentScreenWakeLock();
            if (room.state === 'disconnected') {
                connectLiveKit(currentQuizId);
            } else if (room.state === 'connected') {
                reattachAllAdminFeeds();
            }
        }
    }, 5000);

    async function stopStudentMicOnly() {
        if (studentMicTrack) {
            try {
                if (room.state === 'connected') {
                    await room.localParticipant.unpublishTrack(studentMicTrack);
                }
            } catch (e) {}
            try { studentMicTrack.stop(); } catch (e) {}
            studentMicTrack = null;
        }
        if (studentMicStream) {
            try { studentMicStream.getTracks().forEach(t => t.stop()); } catch (e) {}
            studentMicStream = null;
        }
    }

    window.setStudentAdminMute = async function(isMuted) {
        window.studentMutedByAdmin = Boolean(isMuted);
        const callBtn = document.getElementById('btn-student-call');
        if (window.studentMutedByAdmin) {
            await stopStudentMicOnly();
            if (callBtn) {
                callBtn.textContent = '🔇 Muted by Admin';
                callBtn.classList.remove('on-call');
                callBtn.disabled = true;
                callBtn.style.opacity = '0.6';
                callBtn.style.cursor = 'not-allowed';
            }
            await ensureAdminAudioPlaying();
        } else {
            if (callBtn) {
                if (!studentMicTrack) {
                    callBtn.textContent = '📞 Speak';
                    callBtn.classList.remove('on-call');
                }
                callBtn.disabled = false;
                callBtn.style.opacity = '1';
                callBtn.style.cursor = 'pointer';
            }
        }
    };

    window.stopStudentLiveKit = function() {
        if (screenWatchdogTimer) {
            clearTimeout(screenWatchdogTimer);
            screenWatchdogTimer = null;
        }
        activeScreenTrack = null;
        activeScreenTrackSid = null;
        stopStudentMicOnly();
        stopIosBackgroundAudioKeepAlive();
        setAudioUnmuteHintsVisible(false);
        setPptPlaceholderVisible(true);
        try { room.disconnect(); } catch (e) {}
        if (activeAudioEl) {
            try { activeAudioEl.pause(); activeAudioEl.srcObject = null; } catch (e) {}
        }
        const remoteVid = document.getElementById('student-remote-video');
        if (remoteVid) {
            remoteVid.srcObject = null;
            remoteVid.style.display = 'none';
        }
        const pptVid = document.getElementById('student-ppt-video');
        if (pptVid) pptVid.srcObject = null;
        const pipBox = document.getElementById('student-pip-box');
        if (pipBox) pipBox.style.display = 'none'; // Hide instead of .remove() so rejoin works seamlessly
        document.body.classList.remove('rtc-stream-active', 'rtc-presentation-active', 'rtc-both-active');
    };

    let isMicToggling = false;
    document.getElementById('btn-student-call').addEventListener('click', async (e) => {
        if (isMicToggling) return;
        if (window.studentMutedByAdmin) {
            alert('You have been muted by the instructor.');
            return;
        }
        isMicToggling = true;
        try {
            if (!studentMicTrack) {
                if (room.state === 'connected' && room.localParticipant?.permissions?.canPublish === false) {
                    try { await room.disconnect(); } catch (e) {}
                }
                if (room.state !== 'connected' && typeof currentQuizId !== 'undefined' && currentQuizId) {
                    await connectLiveKit(currentQuizId);
                }
                if (_iosKeepAliveCtx && _iosKeepAliveCtx.state === 'running') {
                    try { await _iosKeepAliveCtx.suspend(); } catch (err) {}
                }
                studentMicStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                studentMicTrack = studentMicStream.getAudioTracks()[0];
                studentMicTrack.enabled = true;
                studentMicTrack.onended = async () => {
                    await stopStudentMicOnly();
                    const callBtn = document.getElementById('btn-student-call');
                    if (callBtn && !window.studentMutedByAdmin) {
                        callBtn.textContent = '📞 Speak';
                        callBtn.classList.remove('on-call');
                    }
                    ensureIosBackgroundAudioKeepAlive();
                    await ensureAdminAudioPlaying();
                };
                const micSource = LivekitClient.Track && LivekitClient.Track.Source
                    ? LivekitClient.Track.Source.Microphone
                    : undefined;
                await room.localParticipant.publishTrack(studentMicTrack, {
                    name: 'student_mic',
                    source: micSource,
                    dtx: false,
                    red: false
                });
                e.target.textContent = '🔴 Mute Mic';
                e.target.classList.add('on-call');
                await ensureAdminAudioPlaying();
                setTimeout(ensureAdminAudioPlaying, 250);
                setTimeout(ensureAdminAudioPlaying, 800);
            } else {
                await stopStudentMicOnly();
                ensureIosBackgroundAudioKeepAlive();
                e.target.textContent = '📞 Speak';
                e.target.classList.remove('on-call');
                await ensureAdminAudioPlaying();
                setTimeout(ensureAdminAudioPlaying, 250);
                setTimeout(ensureAdminAudioPlaying, 800);
            }
        } catch (err) {
            await stopStudentMicOnly();
            alert('Mic access denied or connection busy. Please try again.');
        } finally {
            isMicToggling = false;
        }
    });

    const boxEl = document.getElementById('student-pip-box');
    const handleEl = document.getElementById('student-pip-header');
    let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0;
    handleEl.addEventListener('pointerdown', (e) => {
        isDragging = true; handleEl.setPointerCapture(e.pointerId);
        const rect = boxEl.getBoundingClientRect();
        startX = e.clientX; startY = e.clientY;
        initialLeft = rect.left; initialTop = rect.top;
        boxEl.style.bottom = 'auto'; boxEl.style.right = 'auto';
        boxEl.style.left = initialLeft + 'px'; boxEl.style.top = initialTop + 'px';
    });
    handleEl.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        boxEl.style.left = Math.max(0, Math.min(window.innerWidth - boxEl.offsetWidth, initialLeft + (e.clientX - startX))) + 'px';
        boxEl.style.top = Math.max(0, Math.min(window.innerHeight - boxEl.offsetHeight, initialTop + (e.clientY - startY))) + 'px';
    });
    handleEl.addEventListener('pointerup', (e) => { isDragging = false; handleEl.releasePointerCapture(e.pointerId); });
</script>
</body>
</html>
