<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SCREEN 1: Class Selection -->
  <div id="class-screen" class="screen">
    <div class="card">
      <h2>Select Class</h2>
      <div id="class-container">
        <!-- Buttons are dynamically loaded here from backend -->
      </div>
    </div>
  </div>

  <!-- SCREEN 2: Chapter Selection -->
  <div id="chapter-screen" class="screen" style="display: none;">
    <div class="card">
      <button class="back-btn" onclick="showScreen('class-screen')">Back</button>
      <h2>Select Chapter</h2>
      <button id="download-papers-btn" style="background: #5a5ce6; color: white;">📄 Download Papers</button>
      <div id="chapter-container">
        <!-- Add your chapters here. Example: -->
        <button class="class-btn" onclick="selectChapter('nervous')">Nervous System</button>
        <button class="class-btn" onclick="selectChapter('genetics')">Genetics</button>
        <button class="class-btn" onclick="selectChapter('reproductive')">Reproductive System</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 3: Student Details -->
  <div id="details-screen" class="screen" style="display: none;">
    <div class="card">
      <button class="back-btn" onclick="showScreen('chapter-screen')">Back</button>
      <h2>Enter Your Details</h2>
      <input type="text" id="firstName" placeholder="First Name" class="input-field">
      <input type="text" id="lastName" placeholder="Last Name" class="input-field">
      <input type="email" id="email" placeholder="Email" class="input-field">
      <button class="class-btn" onclick="startQuiz()" style="background: #28a745; color: white; margin-top: 15px;">Start Quiz</button>
    </div>
  </div>

  <!-- SCREEN 4: The Quiz Interface -->
  <div id="quiz-screen" class="screen" style="display: none;">
    <div class="card quiz-card">
      
      <div class="quiz-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <span id="timer-display" style="color: #dc3545; font-weight: bold;">Time Left: 35:00</span>
        <span id="stats-display" style="font-weight: bold;">Attempted: 0 / 20 | Skipped: 0</span>
        <button onclick="submitQuiz()" style="background: #dc3545; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer;">Submit Quiz</button>
      </div>

      <h2 id="quiz-title" style="text-align: center; color: #4a90e2;">Reproductive System</h2>
      <hr style="border: 0.5px solid #e0e0e0; margin-bottom: 20px;">

      <div id="question-container">
        <h3 id="question-text">Q.1: Loading...</h3>
        <div id="options-container" style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
          <!-- Options injected here -->
        </div>
      </div>

      <div class="quiz-footer" style="display: flex; justify-content: space-between; margin-top: 30px;">
        <button onclick="prevQuestion()" id="prev-btn" style="background: #4a90e2; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Previous</button>
        <button onclick="clearResponse()" style="background: #e2e6ea; color: #333; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Clear Response</button>
        <button onclick="nextQuestion()" id="next-btn" style="background: #4a90e2; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Next</button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
