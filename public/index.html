<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Home Menu Screen -->
    <div id="home-menus">
        <h2 id="std-category-heading">Select Category</h2>
        <div class="card" onclick="showScreen('chapter-menu')">Physics</div>
        <div class="card" onclick="showScreen('chapter-menu')">Chemistry</div>
        <div class="card" onclick="showScreen('chapter-menu')">Biology</div>
    </div>

    <!-- Chapter / Subject Menu Screen -->
    <div id="chapter-menu" class="hidden">
        <button class="back-btn" onclick="goBack()">Back</button>
        <h2 id="std-category-heading">Physics</h2>
        <div class="card" onclick="showScreen('name-screen')">
            Work Energy Power
            <p>3 Chapters</p>
        </div>
    </div>

    <!-- NEET Unit Menu -->
    <div id="neet-unit-menu" class="hidden">
        <button class="back-btn" onclick="goBack()">Back</button>
        <h2 id="std-category-heading">Units</h2>
    </div>

    <!-- NEET Chapter Menu -->
    <div id="neet-chapter-menu" class="hidden">
        <button class="back-btn" onclick="goBack()">Back</button>
        <h2 id="std-category-heading">Chapters</h2>
    </div>

    <!-- NEET Topic Menu -->
    <div id="neet-topic-menu" class="hidden">
        <button class="back-btn" onclick="goBack()">Back</button>
        <h2 id="std-category-heading">Topics</h2>
    </div>

    <!-- Name & Details Screen -->
    <div id="name-screen" class="hidden">
        <button class="back-btn" id="name-back-btn" onclick="goBack()">Back</button>
        <h2 id="std-category-heading">Title: Work Energy Power</h2>
        <p><strong>Enter Details</strong></p>
        <input type="text" id="first-name" placeholder="First Name">
        <input type="text" id="last-name" placeholder="Last Name">
        <input type="email" id="email-address" placeholder="Email Address">
        <button id="name-start-btn" onclick="startQuiz()">Start Quiz</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">
        <div class="quiz-header">
            <div>
                <span>Time Left: <span id="time-left">15:00</span></span>
            </div>
            <div>
                <span id="quiz-stats">Attempted: 0 | Skipped: 0</span>
            </div>
            <button id="submit-btn" onclick="submitQuiz()">Submit Quiz</button>
        </div>

        <h2 id="std-category-heading">Work Energy Power</h2>
        <div id="question-box" style="font-size: 18px; font-weight: bold; margin-bottom: 20px;">
            Q1: Sample Question Text Here
        </div>

        <div id="options-container">
            <button class="option-btn" onclick="selectOption(this)">a. Option One</button>
            <button class="option-btn" onclick="selectOption(this)">b. Option Two</button>
            <button class="option-btn" onclick="selectOption(this)">c. Option Three</button>
            <button class="option-btn" onclick="selectOption(this)">d. Option Four</button>
        </div>

        <div class="nav-buttons">
            <button id="prev-btn" onclick="prevQuestion()">Previous</button>
            <button id="clear-btn" onclick="clearResponse()">Clear Response</button>
            <button id="next-btn" onclick="nextQuestion()">Next</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
        <button class="back-btn" onclick="goHome()">Back</button>
        <h2 id="std-category-heading">Quiz Results</h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
