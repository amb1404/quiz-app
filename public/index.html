<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        
        <!-- Subject Selection Screen -->
        <div id="subject-screen" class="screen active">
            <h2>Select a Subject</h2>
            <ul id="subject-list"></ul>
        </div>

        <!-- Chapter Selection Screen -->
        <div id="chapter-screen" class="screen hidden">
            <h2>Select Chapter</h2>
            <ul id="chapter-list"></ul>
            <button class="btn-secondary mt-15" onclick="showScreen('subject-screen')">← Back to Subjects</button>
        </div>

        <!-- Student Details Screen -->
        <div id="name-screen" class="screen hidden">
            <h2>Enter Your Details</h2>
            <p>Please enter your name before starting the quiz.</p>
            <input type="text" id="student-name" placeholder="Enter your full name">
            <div class="button-group">
                <button class="btn-primary" onclick="startQuiz()">Start Quiz</button>
                <button class="btn-secondary" onclick="showScreen('chapter-screen')">Back</button>
            </div>
        </div>

        <!-- Active Quiz Screen -->
        <div id="quiz-screen" class="screen hidden">
            <div class="quiz-stats">
                <span id="timer" class="stat-box timer-box">Time: 00:00</span>
                <span id="counter" class="stat-box">Attempted: 0 | Skipped: 0</span>
            </div>
            
            <div class="question-container">
                <h3 id="question-text">Loading question...</h3>
                <ul id="options-list"></ul>
            </div>

            <div class="button-group">
                <button id="prev-btn" class="btn-secondary" onclick="prevQuestion()">← Previous</button>
                <button id="next-btn" class="btn-primary" onclick="nextQuestion()">Next →</button>
            </div>
            <button class="btn-submit mt-15" onclick="submitQuiz()">Submit Quiz</button>
        </div>

        <!-- Results Screen -->
        <div id="result-screen" class="screen hidden">
            <h2>Quiz Completed!</h2>
            <h3 id="score-display" class="score-text"></h3>
            <p id="submission-status"></p>
            <div class="button-group">
                <button class="btn-primary" onclick="reviewAnswers()">Review Answers</button>
                <button class="btn-secondary" onclick="location.reload()">Return to Menu</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
