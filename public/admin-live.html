<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Live Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 20px; margin: 0; }
        .panel { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input { padding: 10px; margin-right: 10px; border-radius: 4px; border: none; }
        button { padding: 10px 15px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        .time-badge { background: #059669; padding: 3px 8px; border-radius: 12px; font-size: 12px; }

        /* Streaming Console & Draggable Self-View Styles */
        #admin-stream-console {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .stream-btn {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            color: white;
            background: #475569;
        }
        .stream-btn.active-cam { background: #2563eb; }
        .stream-btn.active-mic { background: #10b981; }
        .stream-btn.stop-btn { background: #dc2626; }
        #admin-caller-badge {
            margin-left: auto;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            background: #0f172a;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        #admin-caller-badge.calling {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border-color: #10b981;
        }

        /* Draggable Rectangular Self-View Box */
        #admin-pip-box {
            position: fixed;
            top: 20px;
            right: 25px;
            width: 240px;
            height: 165px;
            background: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65);
            z-index: 9998;
            display: none;
            flex-direction: column;
            touch-action: none;
            user-select: none;
        }
        #admin-pip-header {
            background: rgba(15, 23, 42, 0.92);
            color: #cbd5e1;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 10px;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }
        #admin-pip-header:active { cursor: grabbing; }
        #admin-self-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            transform: scaleX(-1);
        }
    </style>
<script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>
    <h2>Live Mock Control Center</h2>
    
    <!-- Panel 1: Step 1 - Admin Key & Create Room Workflow -->
    <div class="panel" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
        <input type="password" id="admin-key" placeholder="Enter Admin Secret Key" style="min-width: 220px;">
        <button id="show-create-room-btn" type="button" style="background: #2563eb;">➕ Create Room</button>

        <!-- Appears when 'Create Room' is clicked -->
        <div id="create-room-box" style="display: none; align-items: center; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="quiz-id" placeholder="Type Room Name (e.g. Physics-X)" style="min-width: 220px;">
            <button id="start-btn" type="button" style="background: #10b981;">🚀 Launch Room</button>
        </div>

        <span id="otp-display" style="margin-left: 10px; color: #34d399; font-weight: bold; font-size: 16px;"></span>
    </div>

    <!-- Streaming Console Bar -->
    <div id="admin-stream-console">
        <strong style="font-size: 14px; color: #93c5fd;">🎥 Live Video & HD Voice Console:</strong>
        <button id="btn-admin-video" class="stream-btn" type="button">📹 Video: OFF</button>
        <button id="btn-admin-audio" class="stream-btn" type="button">🎙️ Audio: OFF</button>
        <button id="btn-admin-stop-stream" class="stream-btn stop-btn" type="button" style="display: none;">⏹️ Stop Stream</button>
        <span id="admin-caller-badge">🎧 No active student calls</span>
    </div>

    <!-- Step 3: Broadcast Mode Selection Console (Question Card, PPT, or Both Together) -->
    <div id="admin-broadcast-mode-console" style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px 20px; margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
        <strong style="font-size: 14px; color: #c4b5fd;">📺 Student Main Screen:</strong>
        <button id="btn-mode-question" class="stream-btn" type="button" style="background: #2563eb; border: 2px solid #60a5fa;">📝 Broadcast: Question Card</button>
        <button id="btn-mode-ppt" class="stream-btn" type="button" style="background: #475569; border: 2px solid transparent;">🖥️ Broadcast: Presentation (PPT)</button>
        <button id="btn-mode-both" class="stream-btn" type="button" style="background: #475569; border: 2px solid transparent;">⚡ Cast PPT + Question Together</button>
        <button id="btn-reselect-ppt" class="stream-btn" type="button" style="background: #7c3aed; display: none;">🔄 Change PPT Window</button>
        <span id="admin-mode-badge" style="margin-left: auto; font-size: 13px; font-weight: bold; padding: 6px 14px; border-radius: 20px; background: #0f172a; color: #60a5fa; border: 1px solid #334155;">📌 Showing: Question Card</span>
    </div>

    <!-- Panel 2: Step 2 - Dynamic Question Set Dropdown & One-Question-at-a-Time Controls -->
    <div class="panel" id="control-panel" style="display: none;">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #334155;">
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <label for="admin-quiz-select" style="font-weight: bold; color: #93c5fd;">📚 Broadcast Question Set (/livemock):</label>
                <select id="admin-quiz-select" style="padding: 10px 14px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-weight: bold; min-width: 260px; cursor: pointer;">
                    <option value="">-- None (Lecture / PPT Only) --</option>
                </select>
            </div>
            <button id="end-test-btn" style="background: #dc2626; box-shadow: 0 0 8px rgba(220, 38, 38, 0.6);">🛑 Close Room Now</button>
        </div>

        <h3 id="dash-title" style="margin-top: 0; color: #e2e8f0;"></h3>
        <div id="question-nav-controls" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
            <button id="prev-btn">Previous Question</button>
            <span id="q-counter" style="margin: 0 15px; font-size: 18px; font-weight: bold;">No Question Set Active</span>
            <button id="next-btn">Next Question</button>
            <button id="clear-responses-btn" style="background: #eab308; color: black; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">
                Clear Current Question Responses
            </button>
        </div>
    </div>

    <!-- Panel 3: Live Submissions Board -->
    <div class="panel" id="board-panel" style="display: none;">
        <h3>Live Room Roster & Student Submissions</h3>
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Status / Selected Option</th>
                    <th>Speed (Time)</th>
                    <th>Admin Controls</th>
                </tr>
            </thead>
            <tbody id="board-body"></tbody>
        </table>
    </div>

    <!-- Draggable Self-View Box -->
    <div id="admin-pip-box">
        <div id="admin-pip-header">
            <span>⠿ Drag Self-View</span>
            <span style="color: #38bdf8;">● LIVE HD</span>
        </div>
        <video id="admin-self-video" autoplay playsinline muted></video>
    </div>

    <script src="/js/admin-live.js"></script>
<script>
    const room = new LivekitClient.Room();
    let videoEnabled = false;
    let audioEnabled = false;
    let broadcastMode = 'question';
    let currentCamTrack = null;
    let currentMicTrack = null;
    let currentScreenTrack = null;

    async function startOrUpdateBroadcast() {
        const adminKey = document.getElementById('admin-key').value.trim();
        const quizId = document.getElementById('quiz-id').value.trim();
        if (!adminKey || !quizId) return false;

        try {
            const res = await fetch(`/api/livekit/token?quizId=${quizId}&studentName=admin`);
            if (!res.ok) throw new Error("API Keys missing on server.");
            const { token } = await res.json();

            // 🛑 REPLACE THIS URL WITH YOUR REAL LIVEKIT URL
            if (room.state !== 'connected') {
                await room.connect('wss://pioneers-prep-efmg740j.livekit.cloud', token);
            }

            if (videoEnabled && !currentCamTrack) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 } });
                currentCamTrack = stream.getVideoTracks()[0];
                await room.localParticipant.publishTrack(currentCamTrack, { name: 'camera' });
                document.getElementById('admin-self-video').srcObject = stream;
            } else if (!videoEnabled && currentCamTrack) {
                await room.localParticipant.unpublishTrack(currentCamTrack);
                currentCamTrack.stop();
                currentCamTrack = null;
                document.getElementById('admin-self-video').srcObject = null;
            }

            if (audioEnabled && !currentMicTrack) {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
                currentMicTrack = stream.getAudioTracks()[0];
                await room.localParticipant.publishTrack(currentMicTrack, { name: 'mic' });
            } else if (!audioEnabled && currentMicTrack) {
                await room.localParticipant.unpublishTrack(currentMicTrack);
                currentMicTrack.stop();
                currentMicTrack = null;
            }

            if ((broadcastMode === 'presentation' || broadcastMode === 'both') && !currentScreenTrack) {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                currentScreenTrack = stream.getVideoTracks()[0];
                await room.localParticipant.publishTrack(currentScreenTrack, { name: 'screen' });
                currentScreenTrack.onended = () => {
                    room.localParticipant.unpublishTrack(currentScreenTrack);
                    currentScreenTrack = null;
                    broadcastMode = 'question';
                };
            } else if (broadcastMode === 'question' && currentScreenTrack) {
                await room.localParticipant.unpublishTrack(currentScreenTrack);
                currentScreenTrack.stop();
                currentScreenTrack = null;
            }

            document.getElementById('admin-pip-box').style.display = videoEnabled ? 'flex' : 'none';
            document.getElementById('btn-admin-stop-stream').style.display = 'inline-block';
            return true;
        } catch (err) {
            alert("LiveKit Connection Failed: " + err.message);
            videoEnabled = audioEnabled = false;
            return false;
        }
    }

    document.getElementById('btn-admin-video').addEventListener('click', async (e) => {
        videoEnabled = !videoEnabled;
        e.target.textContent = videoEnabled ? '📹 Video: ON' : '📹 Video: OFF';
        e.target.classList.toggle('active-cam', videoEnabled);
        await startOrUpdateBroadcast();
    });

    document.getElementById('btn-admin-audio').addEventListener('click', async (e) => {
        audioEnabled = !audioEnabled;
        e.target.textContent = audioEnabled ? '🎙️ Audio: ON' : '🎙️ Audio: OFF';
        e.target.classList.toggle('active-mic', audioEnabled);
        await startOrUpdateBroadcast();
    });

    document.getElementById('btn-admin-stop-stream').addEventListener('click', () => {
        room.disconnect();
        if (currentCamTrack) currentCamTrack.stop();
        if (currentMicTrack) currentMicTrack.stop();
        if (currentScreenTrack) currentScreenTrack.stop();
        currentCamTrack = currentMicTrack = currentScreenTrack = null;

        document.getElementById('admin-pip-box').style.display = 'none';
        document.getElementById('btn-admin-stop-stream').style.display = 'none';
        videoEnabled = audioEnabled = false;
        document.getElementById('btn-admin-video').textContent = '📹 Video: OFF';
        document.getElementById('btn-admin-video').classList.remove('active-cam');
        document.getElementById('btn-admin-audio').textContent = '🎙️ Audio: OFF';
        document.getElementById('btn-admin-audio').classList.remove('active-mic');
    });

    document.getElementById('btn-mode-question').addEventListener('click', async () => { broadcastMode = 'question'; await startOrUpdateBroadcast(); });
    document.getElementById('btn-mode-ppt').addEventListener('click', async () => { broadcastMode = 'presentation'; await startOrUpdateBroadcast(); });
    document.getElementById('btn-mode-both').addEventListener('click', async () => { broadcastMode = 'both'; await startOrUpdateBroadcast(); });
    
    // Draggable PIP Window
    const boxEl = document.getElementById('admin-pip-box');
    const handleEl = document.getElementById('admin-pip-header');
    let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0;
    handleEl.addEventListener('pointerdown', (e) => {
        isDragging = true; handleEl.setPointerCapture(e.pointerId);
        const rect = boxEl.getBoundingClientRect();
        startX = e.clientX; startY = e.clientY;
        initialLeft = rect.left; initialTop = rect.top;
        boxEl.style.bottom = 'auto'; boxEl.style.right = 'auto';
        boxEl.style.left = initialLeft + 'px'; boxEl.style.top = initialTop + 'px';
    });
    handleEl.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        boxEl.style.left = Math.max(0, Math.min(window.innerWidth - boxEl.offsetWidth, initialLeft + (e.clientX - startX))) + 'px';
        boxEl.style.top = Math.max(0, Math.min(window.innerHeight - boxEl.offsetHeight, initialTop + (e.clientY - startY))) + 'px';
    });
    handleEl.addEventListener('pointerup', (e) => { isDragging = false; handleEl.releasePointerCapture(e.pointerId); });
</script>
</body>
</html>
