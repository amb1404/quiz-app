<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Live Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 20px; margin: 0; }
        .panel { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input { padding: 10px; margin-right: 10px; border-radius: 4px; border: none; }
        button { padding: 10px 15px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        .time-badge { background: #059669; padding: 3px 8px; border-radius: 12px; font-size: 12px; }

        /* Streaming Console & Draggable Self-View Styles */
        #admin-stream-console {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .stream-btn {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            color: white;
            background: #475569;
        }
        .stream-btn.active-cam { background: #2563eb; }
        .stream-btn.active-mic { background: #10b981; }
        .stream-btn.stop-btn { background: #dc2626; }
        #admin-caller-badge {
            margin-left: auto;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            background: #0f172a;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        #admin-caller-badge.calling {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border-color: #10b981;
        }

        /* Draggable Rectangular Self-View Box */
        #admin-pip-box {
            position: fixed;
            top: 20px;
            right: 25px;
            width: 240px;
            height: 165px;
            background: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65);
            z-index: 9998;
            display: none;
            flex-direction: column;
            touch-action: none;
            user-select: none;
        }
        #admin-pip-header {
            background: rgba(15, 23, 42, 0.92);
            color: #cbd5e1;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 10px;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }
        #admin-pip-header:active { cursor: grabbing; }
        #admin-self-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            transform: scaleX(-1);
        }
    </style>
</head>
<body>
    <h2>Live Mock Control Center</h2>
    
    <!-- Panel 1: Start Broadcast Inputs -->
    <div class="panel">
        <input type="password" id="admin-key" placeholder="Admin Secret Key">
        <input type="text" id="quiz-id" placeholder="Test ID (e.g. mock1)">
        <button id="start-btn">Start Broadcast & Send OTP</button>
        <span id="otp-display" style="margin-left: 15px; color: #f59e0b; font-weight: bold; font-size: 18px;"></span>
    </div>

    <!-- Streaming Console Bar -->
    <div id="admin-stream-console">
        <strong style="font-size: 14px; color: #93c5fd;">🎥 Live Video & HD Voice Console:</strong>
        <button id="btn-admin-video" class="stream-btn" type="button">📹 Video: OFF</button>
        <button id="btn-admin-audio" class="stream-btn" type="button">🎙️ Audio: OFF</button>
        <button id="btn-admin-stop-stream" class="stream-btn stop-btn" type="button" style="display: none;">⏹️ Stop Stream</button>
        <span id="admin-caller-badge">🎧 No active student calls</span>
    </div>
<!-- Broadcast Mode Selection Console (Question Card vs MS PowerPoint) -->
    <div id="admin-broadcast-mode-console" style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px 20px; margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
        <strong style="font-size: 14px; color: #c4b5fd;">📺 Student Main Screen:</strong>
        <button id="btn-mode-question" class="stream-btn" type="button" style="background: #2563eb; border: 2px solid #60a5fa;">📝 Broadcast: Question Card</button>
        <button id="btn-mode-ppt" class="stream-btn" type="button" style="background: #475569; border: 2px solid transparent;">🖥️ Broadcast: Presentation (PPT)</button>
        <button id="btn-reselect-ppt" class="stream-btn" type="button" style="background: #7c3aed; display: none;">🔄 Change PPT Window</button>
        <span id="admin-mode-badge" style="margin-left: auto; font-size: 13px; font-weight: bold; padding: 6px 14px; border-radius: 20px; background: #0f172a; color: #60a5fa; border: 1px solid #334155;">📌 Showing: Question Card</span>
    </div>
    <!-- Panel 2: Control Panel with End Test Button -->
    <div class="panel" id="control-panel" style="display: none;">
        <h3 id="dash-title"></h3>
        <button id="prev-btn">Previous Question</button>
        <span id="q-counter" style="margin: 0 15px; font-size: 18px; font-weight: bold;">Q: 1</span>
        <button id="next-btn">Next Question</button>
        <button id="end-test-btn" style="background: #dc2626; margin-left: 30px; box-shadow: 0 0 8px rgba(220, 38, 38, 0.6);">End Test Now</button>
        <button id="clear-responses-btn" style="background: #eab308; color: black; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 5px;">
            Clear Current Question Responses
        </button>
    </div>

    <!-- Panel 3: Live Submissions Board -->
    <div class="panel" id="board-panel" style="display: none;">
        <h3>Live Submissions (Current Question)</h3>
        <table>
            <thead><tr><th>Student Name</th><th>Selected Option (Index)</th><th>Speed (Time)</th></tr></thead>
            <tbody id="board-body"></tbody>
        </table>
    </div>

    <!-- Draggable Self-View Box -->
    <div id="admin-pip-box">
        <div id="admin-pip-header">
            <span>⠿ Drag Self-View</span>
            <span style="color: #38bdf8;">● LIVE HD</span>
        </div>
        <video id="admin-self-video" autoplay playsinline muted></video>
    </div>

    <script src="/js/admin-live.js"></script>
<script>
    (function() {
        const TARGET_SAMPLE_RATE = 16000;
        let localStream = null;
        let mediaSetupPromise = null;
        let videoEnabled = false;
        let audioEnabled = false;
        let isBroadcasting = false;
        let broadcastMode = 'question'; // 'question' or 'presentation'
        let screenStream = null;
        let idlePptStream = null;
        let pushInterval = null;
        let isPushing = false;

        let adminAudioCtx = null;
        let micProcessor = null;
        let micSource = null;
        let silentSink = null;
        let pendingPcmSamples = [];
        let preRollBuffers = []; 
        let lastStudentSeq = 0;
        
        // BUG 1 FIX: Track audio playback time individually per student to prevent delays/overlaps
        const studentPlayTimes = new Map(); 
        const studentAudioPlayedMs = new Map();
        let globalLastAudioPlayedMs = 0;
        const peerConnections = new Map();
        const answeringStudents = new Set();

        const btnVideo = document.getElementById('btn-admin-video');
        const btnAudio = document.getElementById('btn-admin-audio');
        const btnStop = document.getElementById('btn-admin-stop-stream');
        const pipBox = document.getElementById('admin-pip-box');
        const selfVideo = document.getElementById('admin-self-video');
        const callerBadge = document.getElementById('admin-caller-badge');

        const btnModeQuestion = document.getElementById('btn-mode-question');
        const btnModePpt = document.getElementById('btn-mode-ppt');
        const btnReselectPpt = document.getElementById('btn-reselect-ppt');
        const modeBadge = document.getElementById('admin-mode-badge');

        function getAdminCredentials() {
            const keyEl = document.getElementById('admin-key');
            const quizEl = document.getElementById('quiz-id');
            return {
                adminKey: keyEl ? keyEl.value.trim() : '',
                quizId: quizEl ? quizEl.value.trim() : ''
            };
        }

        // Initializes the WebRTC Presentation pipeline at full 1280x720 @ 30 FPS from the start
        // so hot-swapping to PowerPoint never gets throttled to 1 FPS
        function getIdlePptTrack() {
            if (!idlePptStream) {
                const canvas = document.createElement('canvas');
                canvas.width = 1280;
                canvas.height = 720;
                const ctx = canvas.getContext('2d', { alpha: false });
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                idlePptStream = canvas.captureStream(30);
            }
            return idlePptStream.getVideoTracks()[0];
        }

        function getActivePptTrack() {
            if (screenStream) {
                const track = screenStream.getVideoTracks()[0];
                if (track && track.readyState === 'live') {
                    return track;
                }
            }
            return getIdlePptTrack();
        }

        // Locks WebRTC hardware encoder to 'maintain-framerate' at 30 FPS so every single letter appears live
        function optimizeVideoSender(sender, isPresentation) {
            if (!sender || typeof sender.getParameters !== 'function') return;
            try {
                const params = sender.getParameters();
                if (!params.encodings || params.encodings.length === 0) {
                    params.encodings = [{}];
                }
                // Strictly forbid WebRTC from dropping framerate on both Webcam and PPT
                params.degradationPreference = 'maintain-framerate';
                params.encodings[0].maxFramerate = 30;
                params.encodings[0].maxBitrate = isPresentation ? 2500000 : 900000;
                params.encodings[0].scaleResolutionDownBy = 1.0;
                params.encodings[0].priority = 'high';
                params.encodings[0].networkPriority = 'high';
                sender.setParameters(params).catch(() => {});
            } catch (e) {}
        }

        function hotSwapCameraTrack(newCamTrack) {
            if (newCamTrack && 'contentHint' in newCamTrack) {
                newCamTrack.contentHint = 'motion';
            }
            peerConnections.forEach((pc) => {
                if (pc._camSender) {
                    pc._camSender.replaceTrack(newCamTrack).then(() => {
                        optimizeVideoSender(pc._camSender, false);
                    }).catch(() => {});
                }
            });
        }

        function hotSwapPresentationTrack(newTrack) {
            if (newTrack && 'contentHint' in newTrack) {
                newTrack.contentHint = 'motion'; // Forces 30 FPS real-time encoding for typing/drawing
            }
            peerConnections.forEach((pc) => {
                if (pc._pptSender) {
                    pc._pptSender.replaceTrack(newTrack).then(() => {
                        optimizeVideoSender(pc._pptSender, true);
                    }).catch(() => {});
                }
            });
        }

        function updateModeConsoleUI() {
            if (broadcastMode === 'presentation') {
                btnModePpt.style.background = '#7c3aed';
                btnModePpt.style.borderColor = '#c4b5fd';
                btnModeQuestion.style.background = '#475569';
                btnModeQuestion.style.borderColor = 'transparent';
                modeBadge.textContent = '📌 Showing: Live Presentation (PPT)';
                modeBadge.style.color = '#c4b5fd';
            } else {
                btnModeQuestion.style.background = '#2563eb';
                btnModeQuestion.style.borderColor = '#60a5fa';
                btnModePpt.style.background = '#475569';
                btnModePpt.style.borderColor = 'transparent';
                modeBadge.textContent = '📌 Showing: Question Card';
                modeBadge.style.color = '#60a5fa';
            }
            const hasLivePpt = screenStream && screenStream.getVideoTracks()[0] && screenStream.getVideoTracks()[0].readyState === 'live';
            btnReselectPpt.style.display = hasLivePpt ? 'inline-block' : 'none';
        }

        async function syncModeToServer() {
            const { adminKey, quizId } = getAdminCredentials();
            if (!adminKey || !quizId) return;
            await fetch('/api/live/rtc/admin/mode', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminKey, quizId, broadcastMode })
            }).catch(() => {});
        }

        async function acquireScreenShareStream(forceNewPicker) {
            const hasLivePpt = screenStream && screenStream.getVideoTracks()[0] && screenStream.getVideoTracks()[0].readyState === 'live';
            if (hasLivePpt && !forceNewPicker) {
                return true;
            }
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 },
                        cursor: 'always'
                    },
                    audio: false
                });
                const screenTrack = screenStream.getVideoTracks()[0];
                if ('contentHint' in screenTrack) {
                    screenTrack.contentHint = 'motion';
                }
                hotSwapPresentationTrack(screenTrack);

                screenTrack.onended = () => {
                    screenStream = null;
                    hotSwapPresentationTrack(getIdlePptTrack());
                    broadcastMode = 'question';
                    updateModeConsoleUI();
                    syncModeToServer();
                };
                return true;
            } catch (err) {
                console.error("Screen share error:", err);
                alert("Could not start presentation share: " + (err.message || "Permission denied or cancelled."));
                return false;
            }
        }

        btnModePpt.addEventListener('click', async () => {
            const { adminKey, quizId } = getAdminCredentials();
            if (!adminKey || !quizId) {
                alert('Please enter your Admin Secret Key and Test ID first.');
                return;
            }
            
            const hasScreen = await acquireScreenShareStream(false);
            if (!hasScreen) return;

            broadcastMode = 'presentation';
            updateModeConsoleUI();

            if (!isBroadcasting) {
                await startOrUpdateBroadcast();
            } else {
                await syncModeToServer();
            }
        });

        

        btnReselectPpt.addEventListener('click', async () => {
            const switched = await acquireScreenShareStream(true);
            if (switched) {
                broadcastMode = 'presentation';
                updateModeConsoleUI();
                await syncModeToServer();
            }
        });

        (function makeDraggable(boxEl, handleEl) {
            let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

            handleEl.addEventListener('pointerdown', (e) => {
                isDragging = true;
                handleEl.setPointerCapture(e.pointerId);
                const rect = boxEl.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = rect.left;
                initialTop = rect.top;
                boxEl.style.bottom = 'auto';
                boxEl.style.right = 'auto';
                boxEl.style.left = initialLeft + 'px';
                boxEl.style.top = initialTop + 'px';
            });

            handleEl.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const maxLeft = window.innerWidth - boxEl.offsetWidth;
                const maxTop = window.innerHeight - boxEl.offsetHeight;
                boxEl.style.left = Math.max(0, Math.min(maxLeft, initialLeft + dx)) + 'px';
                boxEl.style.top = Math.max(0, Math.min(maxTop, initialTop + dy)) + 'px';
            });

            handleEl.addEventListener('pointerup', (e) => {
                isDragging = false;
                handleEl.releasePointerCapture(e.pointerId);
            });
        })(pipBox, document.getElementById('admin-pip-header'));

        function downsampleAndEnhance(float32Arr, inputRate, outputRate, gainMultiplier) {
            const ratio = inputRate / outputRate;
            const newLen = Math.floor(float32Arr.length / ratio);
            const result = new Int16Array(newLen);

            for (let i = 0; i < newLen; i++) {
                const start = Math.floor(i * ratio);
                const end = Math.min(float32Arr.length, Math.ceil((i + 1) * ratio));
                let sum = 0, count = 0;
                for (let j = start; j < end; j++) {
                    sum += float32Arr[j];
                    count++;
                }
                let sample = (count > 0 ? sum / count : float32Arr[start]) * gainMultiplier;
                if (sample > 1.0) sample = 1.0;
                else if (sample < -1.0) sample = -1.0;
                result[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            }
            return result;
        }

        function int16ToBase64(int16Arr) {
            function playIncomingPcmBase64(b64Str, sampleRate, studentName) {
            try {
                const samePcCall = Number(localStorage.getItem('pp_student_call_same_pc') || 0);
                if (Date.now() - samePcCall < 2000) return;
            } catch (e) {}

            if (!adminAudioCtx) return;
            if (adminAudioCtx.state === 'suspended') adminAudioCtx.resume().catch(() => {});

            const raw = atob(b64Str);
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            const int16 = new Int16Array(bytes.buffer);
            if (int16.length === 0) return;

            const audioBuffer = adminAudioCtx.createBuffer(1, int16.length, sampleRate || TARGET_SAMPLE_RATE);
            const channel = audioBuffer.getChannelData(0);

            const now = adminAudioCtx.currentTime;
            
            // Isolate playback timeline per student
            let studentNextTime = studentPlayTimes.get(studentName) || 0;
            const isNewPhrase = (studentNextTime < now);

            for (let i = 0; i < int16.length; i++) {
                let val = (int16[i] / 32768.0) * 1.6;
                if (val > 1.0) val = 1.0;
                else if (val < -1.0) val = -1.0;
                if (isNewPhrase && i < 24) val *= (i / 24);
                channel[i] = val;
            }

            if (isNewPhrase) studentNextTime = now + 0.15;
            else if (studentNextTime - now > 1.5) studentNextTime = now + 0.15; // Prevent massive buffer lag

            const src = adminAudioCtx.createBufferSource();
            src.buffer = audioBuffer;
            src.connect(adminAudioCtx.destination);
            src.start(studentNextTime);
            
            studentNextTime += audioBuffer.duration;
            studentPlayTimes.set(studentName, studentNextTime);

            const remainingPlayMs = Math.max(0, (studentNextTime - now) * 1000);
            const playedUntilMs = Date.now() + remainingPlayMs + 300;
            studentAudioPlayedMs.set(studentName, playedUntilMs);
            
            if (playedUntilMs > globalLastAudioPlayedMs) {
                globalLastAudioPlayedMs = playedUntilMs;
                try { localStorage.setItem('pp_admin_speaker_active_until', String(globalLastAudioPlayedMs)); } catch (e) {}
            }
        }

        async function ensureMediaSetup() {
            if (!adminAudioCtx) adminAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (adminAudioCtx.state === 'suspended') await adminAudioCtx.resume();

            if (!localStream) {
                if (!mediaSetupPromise) {
                    mediaSetupPromise = (async () => {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: { width: { ideal: 640 }, height: { ideal: 360 }, frameRate: { ideal: 30 } },
                            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
                        });

                        if (micProcessor) { try { micProcessor.disconnect(); } catch (e) {} }
                        if (micSource) { try { micSource.disconnect(); } catch (e) {} }

                        selfVideo.muted = true;
                        selfVideo.volume = 0;
                        selfVideo.srcObject = new MediaStream(stream.getVideoTracks());
                        await selfVideo.play().catch(() => {});
// Immediately push live 30 FPS camera track into any pre-connected student tunnels
                        const liveCamTrack = stream.getVideoTracks()[0];
                        if (liveCamTrack) {
                            hotSwapCameraTrack(liveCamTrack);
                        }
                        micSource = adminAudioCtx.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));

                        const hpFilter = adminAudioCtx.createBiquadFilter();
                        hpFilter.type = 'highpass';
                        hpFilter.frequency.value = 120;

                        const presenceFilter = adminAudioCtx.createBiquadFilter();
                        presenceFilter.type = 'peaking';
                        presenceFilter.frequency.value = 2600;
                        presenceFilter.Q.value = 1.0;
                        presenceFilter.gain.value = 3.5;

                        micProcessor = adminAudioCtx.createScriptProcessor(2048, 1, 1);
                        silentSink = adminAudioCtx.createMediaStreamDestination();

                        let wasSpeaking = false;
                        let speechHoldUntil = 0;

                        micProcessor.onaudioprocess = (e) => {
                            if (!isBroadcasting || !audioEnabled) {
                                preRollBuffers = [];
                                return;
                            }
                            if (Date.now() < lastStudentAudioPlayedMs) {
                                pendingPcmSamples = [];
                                preRollBuffers = [];
                                wasSpeaking = false;
                                return;
                            }

                            const input = e.inputBuffer.getChannelData(0);
                            let sumSq = 0;
                            for (let i = 0; i < input.length; i++) sumSq += input[i] * input[i];
                            const rms = Math.sqrt(sumSq / input.length);
                            const nowMs = Date.now();

                            const downsampled = downsampleAndEnhance(input, adminAudioCtx.sampleRate, TARGET_SAMPLE_RATE, 1.35);

                            if (rms > 0.0045) speechHoldUntil = nowMs + 750; 

                            if (nowMs < speechHoldUntil) {
                                if (!wasSpeaking && preRollBuffers.length > 0) {
                                    for (let b = 0; b < preRollBuffers.length; b++) {
                                        const pre = preRollBuffers[b];
                                        for (let j = 0; j < pre.length; j++) pendingPcmSamples.push(pre[j]);
                                    }
                                    preRollBuffers = [];
                                }
                                wasSpeaking = true;
                                for (let i = 0; i < downsampled.length; i++) pendingPcmSamples.push(downsampled[i]);
                                if (pendingPcmSamples.length > 16000) pendingPcmSamples = pendingPcmSamples.slice(-16000);
                            } else {
                                wasSpeaking = false;
                                preRollBuffers.push(downsampled);
                                if (preRollBuffers.length > 4) preRollBuffers.shift();
                            }
                        };

                        micSource.connect(hpFilter);
                        hpFilter.connect(presenceFilter);
                        presenceFilter.connect(micProcessor);
                        micProcessor.connect(silentSink);

                        localStream = stream;
                    })();
                }
                try { await mediaSetupPromise; } finally { mediaSetupPromise = null; }
            }

            if (localStream) {
                localStream.getVideoTracks().forEach(t => t.enabled = videoEnabled);
                localStream.getAudioTracks().forEach(t => t.enabled = audioEnabled);
            }
        }

        // Fast ICE Gathering: Resolves as soon as the first network candidate is ready (~150ms instead of 2500ms)
        function waitForIce(pc, maxTimeout = 600) {
            return new Promise(resolve => {
                if (pc.iceGatheringState === 'complete') return resolve();
                let resolved = false;
                let quickTimer = null;
                const done = () => {
                    if (resolved) return;
                    resolved = true;
                    clearTimeout(maxTimer);
                    if (quickTimer) clearTimeout(quickTimer);
                    resolve();
                };
                const maxTimer = setTimeout(done, maxTimeout);
                pc.addEventListener('icecandidate', (e) => {
                    if (!e.candidate) {
                        done();
                    } else if (e.candidate.candidate && (e.candidate.candidate.includes('srflx') || e.candidate.candidate.includes('host'))) {
                        if (!quickTimer) quickTimer = setTimeout(done, 120);
                    }
                });
                pc.addEventListener('icegatheringstatechange', () => {
                    if (pc.iceGatheringState === 'complete') done();
                });
            });
        }

        // Dual-Track WebRTC Setup with Pre-Warmed Candidate Pool & 30 FPS Priority
        async function handleStudentOffer(studentName, offer, adminKey, quizId) {
            if (peerConnections.has(studentName)) {
                peerConnections.get(studentName).close();
            }

            const pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
                iceCandidatePoolSize: 4
            });
            peerConnections.set(studentName, pc);

            await pc.setRemoteDescription(new RTCSessionDescription(offer));

            const camTrack = (localStream && localStream.getVideoTracks()[0]) ? localStream.getVideoTracks()[0] : getIdlePptTrack();
            const pptTrack = getActivePptTrack();

            if (camTrack && 'contentHint' in camTrack) camTrack.contentHint = 'motion';
            if (pptTrack && 'contentHint' in pptTrack) pptTrack.contentHint = 'motion';

            pc._camSender = pc.addTrack(camTrack, localStream || idlePptStream);
            pc._pptSender = pc.addTrack(pptTrack, screenStream || idlePptStream);

            optimizeVideoSender(pc._camSender, false);
            optimizeVideoSender(pc._pptSender, true);

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            await waitForIce(pc, 600);

            await fetch('/api/live/rtc/admin/webrtc-answer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminKey, quizId, studentName, answer: pc.localDescription })
            });
        }

        async function startOrUpdateBroadcast() {
            const { adminKey, quizId } = getAdminCredentials();
            if (!adminKey || !quizId) {
                alert('Please enter your Admin Secret Key and Test ID first.');
                return false;
            }
            try {
                await ensureMediaSetup();
                pipBox.style.display = videoEnabled ? 'flex' : 'none';
                btnStop.style.display = 'inline-block';

                if (!isBroadcasting) {
                    isBroadcasting = true;
                    pendingPcmSamples = [];
                    preRollBuffers = [];
                    await fetch('/api/live/rtc/admin/toggle', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ adminKey, quizId, active: true, videoEnabled, audioEnabled, broadcastMode })
                    });
                    startPushLoop();
                }
                return true;
            } catch (err) {
                alert('Camera/Microphone error: ' + err.message);
                return false;
            }
        }

        function startPushLoop() {
            if (pushInterval) clearInterval(pushInterval);
            fetch('/api/live/rtc/admin/push', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    adminKey: getAdminCredentials().adminKey,
                    quizId: getAdminCredentials().quizId,
                    videoEnabled,
                    audioEnabled,
                    broadcastMode,
                    rate: TARGET_SAMPLE_RATE,
                    afterStudentSeq: lastStudentSeq
                })
            }).catch(() => {});

            pushInterval = setInterval(async () => {
                if (!isBroadcasting || isPushing) return;
                const { adminKey, quizId } = getAdminCredentials();
                if (!adminKey || !quizId) return;

                if (audioEnabled) {
                    try { localStorage.setItem('pp_admin_mic_same_pc', String(Date.now())); } catch (e) {}
                } else {
                    try { localStorage.removeItem('pp_admin_mic_same_pc'); } catch (e) {}
                }

                isPushing = true;

                try {
                    let audioChunkB64 = null;
                    if (audioEnabled && pendingPcmSamples.length > 0) {
                        const int16 = new Int16Array(pendingPcmSamples);
                        pendingPcmSamples = [];
                        audioChunkB64 = int16ToBase64(int16);
                    }

                    const res = await fetch('/api/live/rtc/admin/push', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            adminKey,
                            quizId,
                            videoEnabled,
                            audioEnabled,
                            broadcastMode,
                            audioChunk: audioChunkB64,
                            rate: TARGET_SAMPLE_RATE,
                            afterStudentSeq: lastStudentSeq
                        })
                    });

                    const data = await res.json();
                    if (data && data.success) {
                        if (data.activeCallers && data.activeCallers.length > 0) {
                            callerBadge.textContent = `🟢 Student Speaking: ${data.activeCallers.join(', ')}`;
                            callerBadge.classList.add('calling');
                        } else {
                            callerBadge.textContent = '🎧 No active student calls';
                            callerBadge.classList.remove('calling');
                        }

                        if (Array.isArray(data.pendingOffers)) {
                            data.pendingOffers.forEach(item => {
                                if (!answeringStudents.has(item.name)) {
                                    answeringStudents.add(item.name);
                                    handleStudentOffer(item.name, item.offer, adminKey, quizId).then(() => {
                                        answeringStudents.delete(item.name);
                                    });
                                }
                            });
                        }

                        if (Array.isArray(data.studentAudioChunks) && data.studentAudioChunks.length > 0) {
                            data.studentAudioChunks.forEach(item => {
                                if (item.seq > lastStudentSeq) {
                                    lastStudentSeq = item.seq;
                                    playIncomingPcmBase64(item.pcm, item.rate);
                                }
                            });
                        } else if (data.latestStudentSeq && lastStudentSeq === 0) {
                            lastStudentSeq = data.latestStudentSeq;
                        }
                    }
                } catch (e) {
                } finally {
                    isPushing = false;
                }
            }, 130);
        }

        function updateButtonsUI() {
            btnVideo.textContent = videoEnabled ? '📹 Video: ON' : '📹 Video: OFF';
            btnVideo.classList.toggle('active-cam', videoEnabled);
            btnAudio.textContent = audioEnabled ? '🎙️ Audio: ON' : '🎙️ Audio: OFF';
            btnAudio.classList.toggle('active-mic', audioEnabled);
        }

        function resetCallerBadge() {
            callerBadge.textContent = '🎧 No active student calls';
            callerBadge.classList.remove('calling');
        }

        async function handleStreamToggle() {
            if (!videoEnabled && !audioEnabled && broadcastMode !== 'presentation') {
                if (btnStop) btnStop.click();
                resetCallerBadge();
                return;
            }
            const ok = await startOrUpdateBroadcast();
            if (!ok) {
                videoEnabled = false;
                audioEnabled = false;
                resetCallerBadge();
            }
            updateButtonsUI();
        }

        btnVideo.addEventListener('click', async () => {
            videoEnabled = !videoEnabled;
            await handleStreamToggle();
        });

        btnAudio.addEventListener('click', async () => {
            audioEnabled = !audioEnabled;
            await handleStreamToggle();
        });

        btnStop.addEventListener('click', async () => {
            const { adminKey, quizId } = getAdminCredentials();
            isBroadcasting = false;
            videoEnabled = false;
            audioEnabled = false;
            broadcastMode = 'question';
            pendingPcmSamples = [];
            preRollBuffers = [];
            try { localStorage.removeItem('pp_admin_mic_same_pc'); } catch (e) {}
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            updateButtonsUI();
            updateModeConsoleUI();
            pipBox.style.display = 'none';
            btnStop.style.display = 'none';
            resetCallerBadge();

            if (pushInterval) clearInterval(pushInterval);
            
            peerConnections.forEach(pc => pc.close());
            peerConnections.clear();
            answeringStudents.clear();

            if (micProcessor) { try { micProcessor.disconnect(); } catch (e) {} micProcessor = null; }
            if (micSource) { try { micSource.disconnect(); } catch (e) {} micSource = null; }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }

            await fetch('/api/live/rtc/admin/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminKey, quizId, active: false, videoEnabled: false, audioEnabled: false, broadcastMode: 'question' })
            }).catch(() => {});
        });
    })();
    </script>
