<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Live Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 20px; margin: 0; }
        .panel { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input { padding: 10px; margin-right: 10px; border-radius: 4px; border: none; }
        button { padding: 10px 15px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        .time-badge { background: #059669; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>
    <div style="display: flex; gap: 2%; flex-wrap: wrap;">
        <!-- Existing Live Mock Control Center -->
        <div class="panel" style="flex: 1; min-width: 300px;">
            <h3 style="margin-top: 0;">Live Mock Control Center</h3>
            <input type="password" id="admin-key" placeholder="Admin Secret Key" style="width: 130px;">
            <input type="text" id="quiz-id" placeholder="Test ID (e.g. mock1)" style="width: 130px;">
            <button id="start-btn">Start Broadcast & Send OTP</button>
            <div id="otp-display" style="margin-top: 10px; color: #f59e0b; font-weight: bold; font-size: 18px;"></div>
        </div>

        <!-- NEW: Live Room Control Center -->
        <div class="panel" style="flex: 1; min-width: 300px;">
            <h3 style="margin-top: 0;">Live room control center</h3>
            <input type="password" id="room-admin-key" placeholder="Admin Secret Key" style="width: 130px;">
            <input type="text" id="room-id" placeholder="Room ID (e.g. class1)" style="width: 130px;">
            <button id="start-room-btn">Start Broadcast & Send OTP</button>
            <div id="room-otp-display" style="margin-top: 10px; color: #f59e0b; font-weight: bold; font-size: 18px;"></div>
            <a href="/admin-workspace" target="_blank" id="enter-workspace-btn" style="display:none; margin-top: 15px; background: #10b981; padding: 10px 15px; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block;">Enter Workspace &rarr;</a>
        </div>
    </div>

    <!-- Panel 2: Control Panel with End Test Button -->
    <div class="panel" id="control-panel" style="display: none;">
        <h3 id="dash-title"></h3>
        <button id="prev-btn">Previous Question</button>
        <span id="q-counter" style="margin: 0 15px; font-size: 18px; font-weight: bold;">Q: 1</span>
        <button id="next-btn">Next Question</button>
        <button id="end-test-btn" style="background: #dc2626; margin-left: 30px; box-shadow: 0 0 8px rgba(220, 38, 38, 0.6);">End Test Now</button>
    </div>

    <!-- Panel 3: Live Submissions Board -->
    <div class="panel" id="board-panel" style="display: none;">
        <h3>Live Submissions (Current Question)</h3>
        <table>
            <thead><tr><th>Student Name</th><th>Selected Option (Index)</th><th>Speed (Time)</th></tr></thead>
            <tbody id="board-body"></tbody>
        </table>
    </div>

    <script src="/js/admin-live.js"></script>
</body>
</html>
