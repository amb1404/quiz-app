<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Live Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 20px; margin: 0; }
        .panel { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input { padding: 10px; margin-right: 10px; border-radius: 4px; border: none; }
        button { padding: 10px 15px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        .time-badge { background: #059669; padding: 3px 8px; border-radius: 12px; font-size: 12px; }

        /* Streaming Console & Draggable Self-View Styles */
        #admin-stream-console {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .stream-btn {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            color: white;
            background: #475569;
        }
        .stream-btn.active-cam { background: #2563eb; }
        .stream-btn.active-mic { background: #10b981; }
        .stream-btn.stop-btn { background: #dc2626; }
        #admin-caller-badge {
            margin-left: auto;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            background: #0f172a;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        #admin-caller-badge.calling {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border-color: #10b981;
        }

        /* Draggable Rectangular Self-View Box */
        #admin-pip-box {
            position: fixed;
            top: 20px;
            right: 25px;
            width: 240px;
            height: 165px;
            background: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65);
            z-index: 9998;
            display: none;
            flex-direction: column;
            touch-action: none;
            user-select: none;
        }
        #admin-pip-header {
            background: rgba(15, 23, 42, 0.92);
            color: #cbd5e1;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 10px;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }
        #admin-pip-header:active { cursor: grabbing; }
        #admin-self-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            transform: scaleX(-1);
        }
    </style>
</head>
<body>
    <h2>Live Mock Control Center</h2>
    
    <!-- Panel 1: Start Broadcast Inputs -->
    <div class="panel">
        <input type="password" id="admin-key" placeholder="Admin Secret Key">
        <input type="text" id="quiz-id" placeholder="Test ID (e.g. mock1)">
        <button id="start-btn">Start Broadcast & Send OTP</button>
        <span id="otp-display" style="margin-left: 15px; color: #f59e0b; font-weight: bold; font-size: 18px;"></span>
    </div>

    <!-- Streaming Console Bar -->
    <div id="admin-stream-console">
        <strong style="font-size: 14px; color: #93c5fd;">🎥 Live Video & HD Voice Console:</strong>
        <button id="btn-admin-video" class="stream-btn" type="button">📹 Video: OFF</button>
        <button id="btn-admin-audio" class="stream-btn" type="button">🎙️ Audio: OFF</button>
        <button id="btn-admin-stop-stream" class="stream-btn stop-btn" type="button" style="display: none;">⏹️ Stop Stream</button>
        <span id="admin-caller-badge">🎧 No active student calls</span>
    </div>

    <!-- Panel 2: Control Panel with End Test Button -->
    <div class="panel" id="control-panel" style="display: none;">
        <h3 id="dash-title"></h3>
        <button id="prev-btn">Previous Question</button>
        <span id="q-counter" style="margin: 0 15px; font-size: 18px; font-weight: bold;">Q: 1</span>
        <button id="next-btn">Next Question</button>
        <button id="end-test-btn" style="background: #dc2626; margin-left: 30px; box-shadow: 0 0 8px rgba(220, 38, 38, 0.6);">End Test Now</button>
        <button id="clear-responses-btn" style="background: #eab308; color: black; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 5px;">
            Clear Current Question Responses
        </button>
    </div>

    <!-- Panel 3: Live Submissions Board -->
    <div class="panel" id="board-panel" style="display: none;">
        <h3>Live Submissions (Current Question)</h3>
        <table>
            <thead><tr><th>Student Name</th><th>Selected Option (Index)</th><th>Speed (Time)</th></tr></thead>
            <tbody id="board-body"></tbody>
        </table>
    </div>

    <!-- Draggable Self-View Box -->
    <div id="admin-pip-box">
        <div id="admin-pip-header">
            <span>⠿ Drag Self-View</span>
            <span style="color: #38bdf8;">● LIVE HD</span>
        </div>
        <video id="admin-self-video" autoplay playsinline muted></video>
    </div>

    <script src="/js/admin-live.js"></script>
    <script>
    (function() {
        const TARGET_SAMPLE_RATE = 16000; // 16kHz Wideband HD Voice
        let localStream = null;
        let videoEnabled = false;
        let audioEnabled = false;
        let isBroadcasting = false;
        let pushInterval = null;
        let isPushing = false;

        let adminAudioCtx = null;
        let micProcessor = null;
        let micSource = null;
        let pendingPcmSamples = [];
        let lastStudentSeq = 0;
        let nextStudentPlayTime = 0;
        let noiseFloor = 0.002;

        const captureCanvas = document.createElement('canvas');
        captureCanvas.width = 200;
        captureCanvas.height = 125;
        const captureCtx = captureCanvas.getContext('2d', { alpha: false });

        const btnVideo = document.getElementById('btn-admin-video');
        const btnAudio = document.getElementById('btn-admin-audio');
        const btnStop = document.getElementById('btn-admin-stop-stream');
        const pipBox = document.getElementById('admin-pip-box');
        const selfVideo = document.getElementById('admin-self-video');
        const callerBadge = document.getElementById('admin-caller-badge');

        function getAdminCredentials() {
            const keyEl = document.getElementById('admin-key');
            const quizEl = document.getElementById('quiz-id');
            return {
                adminKey: keyEl ? keyEl.value.trim() : '',
                quizId: quizEl ? quizEl.value.trim() : ''
            };
        }

        // Pointer-Event Dragging for Self-View Box
        (function makeDraggable(boxEl, handleEl) {
            let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

            handleEl.addEventListener('pointerdown', (e) => {
                isDragging = true;
                handleEl.setPointerCapture(e.pointerId);
                const rect = boxEl.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = rect.left;
                initialTop = rect.top;
                boxEl.style.bottom = 'auto';
                boxEl.style.right = 'auto';
                boxEl.style.left = initialLeft + 'px';
                boxEl.style.top = initialTop + 'px';
            });

            handleEl.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const maxLeft = window.innerWidth - boxEl.offsetWidth;
                const maxTop = window.innerHeight - boxEl.offsetHeight;
                boxEl.style.left = Math.max(0, Math.min(maxLeft, initialLeft + dx)) + 'px';
                boxEl.style.top = Math.max(0, Math.min(maxTop, initialTop + dy)) + 'px';
            });

            handleEl.addEventListener('pointerup', (e) => {
                isDragging = false;
                handleEl.releasePointerCapture(e.pointerId);
            });
        })(pipBox, document.getElementById('admin-pip-header'));

        // Anti-Aliased Boxcar Downsampler with Makeup Gain & Soft Limiter
        function downsampleAndEnhance(float32Arr, inputRate, outputRate, gainMultiplier) {
            const ratio = inputRate / outputRate;
            const newLen = Math.floor(float32Arr.length / ratio);
            const result = new Int16Array(newLen);

            for (let i = 0; i < newLen; i++) {
                const start = Math.floor(i * ratio);
                const end = Math.min(float32Arr.length, Math.ceil((i + 1) * ratio));
                let sum = 0;
                let count = 0;
                for (let j = start; j < end; j++) {
                    sum += float32Arr[j];
                    count++;
                }
                let sample = (count > 0 ? sum / count : float32Arr[start]) * gainMultiplier;
                // Soft-clipping limiter to prevent harsh distortion
                if (sample > 1.0) sample = 1.0;
                else if (sample < -1.0) sample = -1.0;
                result[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            }
            return result;
        }

        function int16ToBase64(int16Arr) {
            const bytes = new Uint8Array(int16Arr.buffer, int16Arr.byteOffset, int16Arr.byteLength);
            let binary = '';
            const chunkSize = 4096;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        // Smooth De-Clicked Jitter Buffer Playback for Incoming Student Voice
        function playIncomingPcmBase64(b64Str, sampleRate) {
            if (!adminAudioCtx) return;
            if (adminAudioCtx.state === 'suspended') adminAudioCtx.resume().catch(() => {});

            const raw = atob(b64Str);
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            const int16 = new Int16Array(bytes.buffer);
            if (int16.length === 0) return;

            const rate = sampleRate || TARGET_SAMPLE_RATE;
            const audioBuffer = adminAudioCtx.createBuffer(1, int16.length, rate);
            const channel = audioBuffer.getChannelData(0);
            const fadeSamples = Math.min(48, Math.floor(int16.length / 10));

            for (let i = 0; i < int16.length; i++) {
                let val = (int16[i] / 32768.0) * 1.35; // Boost incoming student voice clarity
                if (val > 1.0) val = 1.0;
                else if (val < -1.0) val = -1.0;

                // Micro-fade edges to prevent buffer click artifacts
                if (i < fadeSamples) val *= (i / fadeSamples);
                else if (i >= int16.length - fadeSamples) val *= ((int16.length - 1 - i) / fadeSamples);

                channel[i] = val;
            }

            const now = adminAudioCtx.currentTime;
            // 120ms jitter buffer cushion for seamless continuous speech
            if (nextStudentPlayTime < now) {
                nextStudentPlayTime = now + 0.12;
            } else if (nextStudentPlayTime - now > 1.5) {
                nextStudentPlayTime = now + 0.12;
            }

            const src = adminAudioCtx.createBufferSource();
            src.buffer = audioBuffer;
            src.connect(adminAudioCtx.destination);
            src.start(nextStudentPlayTime);
            nextStudentPlayTime += audioBuffer.duration;
        }

        async function ensureMediaSetup() {
            if (!adminAudioCtx) {
                adminAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (adminAudioCtx.state === 'suspended') {
                await adminAudioCtx.resume();
            }

            if (!localStream) {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 320 }, height: { ideal: 200 }, frameRate: { ideal: 15 } },
                    audio: {
                        echoCancellation: { ideal: true },
                        noiseSuppression: { ideal: true },
                        autoGainControl: { ideal: true },
                        channelCount: { ideal: 1 }
                    }
                });

                // CRITICAL FIX FOR SELF-ECHO (#2 & #4):
                // Only attach the VIDEO track to selfVideo so the <video> element can NEVER output audio!
                selfVideo.muted = true;
                selfVideo.volume = 0;
                selfVideo.srcObject = new MediaStream(localStream.getVideoTracks());
                await selfVideo.play().catch(() => {});

                // 4-STAGE STUDIO AUDIO DSP CHAIN
                micSource = adminAudioCtx.createMediaStreamSource(new MediaStream(localStream.getAudioTracks()));

                // Stage 1: 130Hz High-Pass Filter (cuts fan, AC hum, and low rumble)
                const hpFilter = adminAudioCtx.createBiquadFilter();
                hpFilter.type = 'highpass';
                hpFilter.frequency.value = 130;
                hpFilter.Q.value = 0.707;

                // Stage 2: 6800Hz Anti-Aliasing Low-Pass Filter (cuts high hiss)
                const lpFilter = adminAudioCtx.createBiquadFilter();
                lpFilter.type = 'lowpass';
                lpFilter.frequency.value = 6800;
                lpFilter.Q.value = 0.707;

                // Stage 3: 2600Hz Vocal Presence Boost (+4.5 dB for clear speech articulation)
                const presenceFilter = adminAudioCtx.createBiquadFilter();
                presenceFilter.type = 'peaking';
                presenceFilter.frequency.value = 2600;
                presenceFilter.Q.value = 1.0;
                presenceFilter.gain.value = 4.5;

                // Stage 4: Broadcast Dynamics Compressor (levels voice volume smoothly)
                const compressor = adminAudioCtx.createDynamicsCompressor();
                compressor.threshold.value = -28;
                compressor.knee.value = 12;
                compressor.ratio.value = 5;
                compressor.attack.value = 0.003;
                compressor.release.value = 0.18;

                micProcessor = adminAudioCtx.createScriptProcessor(2048, 1, 1);
                const zeroGain = adminAudioCtx.createGain();
                zeroGain.gain.value = 0;

                let lastSpeechDetectedMs = 0;

                micProcessor.onaudioprocess = (e) => {
                    // Explicitly zero out output buffer so local mic NEVER leaks to local speakers
                    const outBuf = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < outBuf.length; i++) outBuf[i] = 0;

                    if (!isBroadcasting || !audioEnabled) return;

                    // ECHO LOCK: Mute Admin mic while Student voice is playing on Admin speakers (+650ms room reverb tail)
                    if (adminAudioCtx.currentTime < nextStudentPlayTime + 0.65) {
                        pendingPcmSamples = [];
                        return;
                    }

                    const input = e.inputBuffer.getChannelData(0);
                    let sumSq = 0;
                    for (let i = 0; i < input.length; i++) {
                        sumSq += input[i] * input[i];
                    }
                    const rms = Math.sqrt(sumSq / input.length);
                    const nowMs = Date.now();

                    // Adaptive Noise Floor Tracking
                    if (rms < noiseFloor) {
                        noiseFloor = (0.95 * noiseFloor) + (0.05 * rms);
                    } else if (rms < noiseFloor * 1.8) {
                        noiseFloor = (0.995 * noiseFloor) + (0.005 * rms);
                    }
                    noiseFloor = Math.max(0.001, Math.min(0.015, noiseFloor));

                    if (rms > Math.max(0.004, noiseFloor * 2.1)) {
                        lastSpeechDetectedMs = nowMs;
                    }

                    // Keep gate open for 600ms after speech so word endings & soft consonants are never clipped
                    if (nowMs - lastSpeechDetectedMs > 600) {
                        return;
                    }

                    // Smooth soft noise gate attenuation for quiet background frames
                    const gateGain = rms < noiseFloor * 1.5 ? 0.35 : 1.45;
                    const downsampled = downsampleAndEnhance(input, adminAudioCtx.sampleRate, TARGET_SAMPLE_RATE, gateGain);
                    for (let i = 0; i < downsampled.length; i++) {
                        pendingPcmSamples.push(downsampled[i]);
                    }
                    if (pendingPcmSamples.length > 16000) {
                        pendingPcmSamples = pendingPcmSamples.slice(-16000);
                    }
                };

                micSource.connect(hpFilter);
                hpFilter.connect(lpFilter);
                lpFilter.connect(presenceFilter);
                presenceFilter.connect(compressor);
                compressor.connect(micProcessor);
                micProcessor.connect(zeroGain);
                zeroGain.connect(adminAudioCtx.destination);
            }

            localStream.getVideoTracks().forEach(t => t.enabled = videoEnabled);
            localStream.getAudioTracks().forEach(t => t.enabled = audioEnabled);
        }

        async function startOrUpdateBroadcast() {
            const { adminKey, quizId } = getAdminCredentials();
            if (!adminKey || !quizId) {
                alert('Please enter your Admin Secret Key and Test ID first.');
                return false;
            }
            try {
                await ensureMediaSetup();
                pipBox.style.display = 'flex';
                btnStop.style.display = 'inline-block';

                if (!isBroadcasting) {
                    isBroadcasting = true;
                    pendingPcmSamples = [];
                    await fetch('/api/live/rtc/admin/toggle', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ adminKey, quizId, active: true, videoEnabled, audioEnabled })
                    });
                    startPushLoop();
                }
                return true;
            } catch (err) {
                alert('Camera/Microphone error: ' + err.message);
                return false;
            }
        }

        function startPushLoop() {
            if (pushInterval) clearInterval(pushInterval);
            pushInterval = setInterval(async () => {
                if (!isBroadcasting || isPushing) return;
                const { adminKey, quizId } = getAdminCredentials();
                if (!adminKey || !quizId) return;

                // Signal to same-browser tabs that Admin mic is active on this machine
                if (audioEnabled) {
                    try { localStorage.setItem('pp_admin_mic_same_pc', String(Date.now())); } catch (e) {}
                } else {
                    try { localStorage.removeItem('pp_admin_mic_same_pc'); } catch (e) {}
                }

                isPushing = true;
                try {
                    let frameDataUrl = null;
                    if (videoEnabled && selfVideo.readyState >= 2) {
                        captureCtx.drawImage(selfVideo, 0, 0, captureCanvas.width, captureCanvas.height);
                        frameDataUrl = captureCanvas.toDataURL('image/jpeg', 0.42);
                    }

                    let audioChunkB64 = null;
                    if (audioEnabled && pendingPcmSamples.length > 0) {
                        const int16 = new Int16Array(pendingPcmSamples);
                        pendingPcmSamples = [];
                        audioChunkB64 = int16ToBase64(int16);
                    } else {
                        pendingPcmSamples = [];
                    }

                    const res = await fetch('/api/live/rtc/admin/push', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            adminKey,
                            quizId,
                            videoEnabled,
                            audioEnabled,
                            frame: frameDataUrl,
                            audioChunk: audioChunkB64,
                            rate: TARGET_SAMPLE_RATE,
                            afterStudentSeq: lastStudentSeq
                        })
                    });

                    const data = await res.json();
                    if (data && data.success) {
                        if (data.activeCallers && data.activeCallers.length > 0) {
                            callerBadge.textContent = `🟢 Student Speaking: ${data.activeCallers.join(', ')}`;
                            callerBadge.classList.add('calling');
                        } else {
                            callerBadge.textContent = '🎧 No active student calls';
                            callerBadge.classList.remove('calling');
                        }

                        if (Array.isArray(data.studentAudioChunks) && data.studentAudioChunks.length > 0) {
                            data.studentAudioChunks.forEach(item => {
                                if (item.seq > lastStudentSeq) {
                                    lastStudentSeq = item.seq;
                                    playIncomingPcmBase64(item.pcm, item.rate);
                                }
                            });
                        } else if (data.latestStudentSeq && lastStudentSeq === 0) {
                            lastStudentSeq = data.latestStudentSeq;
                        }
                    }
                } catch (e) {
                } finally {
                    isPushing = false;
                }
            }, 160);
        }

        function updateButtonsUI() {
            btnVideo.textContent = videoEnabled ? '📹 Video: ON' : '📹 Video: OFF';
            btnVideo.classList.toggle('active-cam', videoEnabled);
            btnAudio.textContent = audioEnabled ? '🎙️ Audio: ON' : '🎙️ Audio: OFF';
            btnAudio.classList.toggle('active-mic', audioEnabled);
        }

        function resetCallerBadge() {
            callerBadge.textContent = '🎧 No active student calls';
            callerBadge.classList.remove('calling');
        }

        async function handleStreamToggle() {
            if (!videoEnabled && !audioEnabled) {
                if (btnStop) btnStop.click();
                resetCallerBadge();
                return;
            }
            const ok = await startOrUpdateBroadcast();
            if (!ok) {
                videoEnabled = false;
                audioEnabled = false;
                resetCallerBadge();
            }
            updateButtonsUI();
        }

        btnVideo.addEventListener('click', async () => {
            videoEnabled = !videoEnabled;
            await handleStreamToggle();
        });

        btnAudio.addEventListener('click', async () => {
            audioEnabled = !audioEnabled;
            await handleStreamToggle();
        });

        btnStop.addEventListener('click', async () => {
            const { adminKey, quizId } = getAdminCredentials();
            isBroadcasting = false;
            videoEnabled = false;
            audioEnabled = false;
            pendingPcmSamples = [];
            try { localStorage.removeItem('pp_admin_mic_same_pc'); } catch (e) {}
            updateButtonsUI();
            pipBox.style.display = 'none';
            btnStop.style.display = 'none';
            resetCallerBadge();

            if (pushInterval) clearInterval(pushInterval);
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }

            await fetch('/api/live/rtc/admin/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminKey, quizId, active: false, videoEnabled: false, audioEnabled: false })
            }).catch(() => {});
        });
    })();
    </script>
</body>
</html>
