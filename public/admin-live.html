<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Live Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 20px; margin: 0; }
        .panel { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input { padding: 10px; margin-right: 10px; border-radius: 4px; border: none; }
        button { padding: 10px 15px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        .time-badge { background: #059669; padding: 3px 8px; border-radius: 12px; font-size: 12px; }

        /* Streaming Console & Draggable Self-View Styles */
        #admin-stream-console {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .stream-btn {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            color: white;
            background: #475569;
        }
        .stream-btn.active-cam { background: #2563eb; }
        .stream-btn.active-mic { background: #10b981; }
        .stream-btn.stop-btn { background: #dc2626; }
        #admin-caller-badge {
            margin-left: auto;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            background: #0f172a;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        #admin-caller-badge.calling {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border-color: #10b981;
        }

        /* Draggable Rectangular Self-View Box */
        #admin-pip-box {
            position: fixed;
            top: 20px;
            right: 25px;
            width: 240px;
            height: 165px;
            background: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65);
            z-index: 9998;
            display: none;
            flex-direction: column;
            touch-action: none;
            user-select: none;
        }
        #admin-pip-header {
            background: rgba(15, 23, 42, 0.92);
            color: #cbd5e1;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 10px;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }
        #admin-pip-header:active { cursor: grabbing; }
        #admin-self-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            transform: scaleX(-1);
        }
    </style>
</head>
<body>
    <h2>Live Mock Control Center</h2>
    
    <!-- Panel 1: Step 1 - Admin Key & Create Room Workflow -->
    <div class="panel" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
        <input type="password" id="admin-key" placeholder="Enter Admin Secret Key" style="min-width: 220px;">
        <button id="show-create-room-btn" type="button" style="background: #2563eb;">➕ Create Room</button>

        <!-- Appears when 'Create Room' is clicked -->
        <div id="create-room-box" style="display: none; align-items: center; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="quiz-id" placeholder="Type Room Name (e.g. Physics-X)" style="min-width: 220px;">
            <button id="start-btn" type="button" style="background: #10b981;">🚀 Launch Room</button>
        </div>

        <span id="otp-display" style="margin-left: 10px; color: #34d399; font-weight: bold; font-size: 16px;"></span>
    </div>

    <!-- Streaming Console Bar -->
    <div id="admin-stream-console">
        <strong style="font-size: 14px; color: #93c5fd;">🎥 Live Video & HD Voice Console:</strong>
        <button id="btn-admin-video" class="stream-btn" type="button">📹 Video: OFF</button>
        <button id="btn-admin-audio" class="stream-btn" type="button">🎙️ Audio: OFF</button>
        <button id="btn-admin-stop-stream" class="stream-btn stop-btn" type="button" style="display: none;">⏹️ Stop Stream</button>
        <span id="admin-caller-badge">🎧 No active student calls</span>
    </div>

    <!-- Step 3: Broadcast Mode Selection Console (Question Card, PPT, or Both Together) -->
    <div id="admin-broadcast-mode-console" style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px 20px; margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
        <strong style="font-size: 14px; color: #c4b5fd;">📺 Student Main Screen:</strong>
        <button id="btn-mode-question" class="stream-btn" type="button" style="background: #2563eb; border: 2px solid #60a5fa;">📝 Broadcast: Question Card</button>
        <button id="btn-mode-ppt" class="stream-btn" type="button" style="background: #475569; border: 2px solid transparent;">🖥️ Broadcast: Presentation (PPT)</button>
        <button id="btn-mode-both" class="stream-btn" type="button" style="background: #475569; border: 2px solid transparent;">⚡ Cast PPT + Question Together</button>
        <button id="btn-reselect-ppt" class="stream-btn" type="button" style="background: #7c3aed; display: none;">🔄 Change PPT Window</button>
        <span id="admin-mode-badge" style="margin-left: auto; font-size: 13px; font-weight: bold; padding: 6px 14px; border-radius: 20px; background: #0f172a; color: #60a5fa; border: 1px solid #334155;">📌 Showing: Question Card</span>
    </div>

    <!-- Panel 2: Step 2 - Dynamic Question Set Dropdown & One-Question-at-a-Time Controls -->
    <div class="panel" id="control-panel" style="display: none;">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #334155;">
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <label for="admin-quiz-select" style="font-weight: bold; color: #93c5fd;">📚 Broadcast Question Set (/livemock):</label>
                <select id="admin-quiz-select" style="padding: 10px 14px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-weight: bold; min-width: 260px; cursor: pointer;">
                    <option value="">-- None (Lecture / PPT Only) --</option>
                </select>
            </div>
            <button id="end-test-btn" style="background: #dc2626; box-shadow: 0 0 8px rgba(220, 38, 38, 0.6);">🛑 Close Room Now</button>
        </div>

        <h3 id="dash-title" style="margin-top: 0; color: #e2e8f0;"></h3>
        <div id="question-nav-controls" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
            <button id="prev-btn">Previous Question</button>
            <span id="q-counter" style="margin: 0 15px; font-size: 18px; font-weight: bold;">No Question Set Active</span>
            <button id="next-btn">Next Question</button>
            <button id="clear-responses-btn" style="background: #eab308; color: black; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">
                Clear Current Question Responses
            </button>
        </div>
    </div>

    <!-- Panel 3: Live Submissions Board -->
    <div class="panel" id="board-panel" style="display: none;">
        <h3>Live Room Roster & Student Submissions</h3>
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Status / Selected Option</th>
                    <th>Speed (Time)</th>
                    <th>Admin Controls</th>
                </tr>
            </thead>
            <tbody id="board-body"></tbody>
        </table>
    </div>

    <!-- Draggable Self-View Box -->
    <div id="admin-pip-box">
        <div id="admin-pip-header">
            <span>⠿ Drag Self-View</span>
            <span style="color: #38bdf8;">● LIVE HD</span>
        </div>
        <video id="admin-self-video" autoplay playsinline muted></video>
    </div>

    <script src="/js/admin-live.js"></script>
<script>
    (function() {
        const TARGET_SAMPLE_RATE = 24000;

        // 3 Strictly Separate Media Pipelines
        let camStream = null;      // Pipeline 1: Dedicated Webcam Video Stream
        let screenStream = null;   // Pipeline 2: Dedicated PPT Presentation Stream
        let micStream = null;      // Pipeline 3: Dedicated HD Microphone Stream

        let idlePptStream = null;
        let idleCanvasCtx = null;
        let studioOutDest = null;  // Clean Noise-Cancelled WebRTC Opus Output Stream
        let silentOsc = null;

        let videoEnabled = false;
        let audioEnabled = false;
        let isBroadcasting = false;
        let broadcastMode = 'question'; // 'question', 'presentation', or 'both'

        let pushWorker = null;
        let isPushing = false;
        let lastHeartbeatAt = 0;

        let adminAudioCtx = null;
        let micProcessor = null;
        let micSource = null;
        let silentSink = null;
        let pendingPcmSamples = [];
        let preRollBuffers = [];
        let lastStudentSeq = 0;
        let noiseFloorRms = 0.0025;
        let currentGateGain = 0.0;

        // Per-student low-latency audio playback timelines
        const studentPlayTimes = new Map();
        const studentActiveNodes = new Map();
        const studentLastChunkEnd = new Map();
        let lastStudentAudioPlayedMs = 0;

        const peerConnections = new Map();
        const answeringStudents = new Set();

        const btnVideo = document.getElementById('btn-admin-video');
        const btnAudio = document.getElementById('btn-admin-audio');
        const btnStop = document.getElementById('btn-admin-stop-stream');
        const pipBox = document.getElementById('admin-pip-box');
        const selfVideo = document.getElementById('admin-self-video');
        const callerBadge = document.getElementById('admin-caller-badge');

        const btnModeQuestion = document.getElementById('btn-mode-question');
        const btnModePpt = document.getElementById('btn-mode-ppt');
        const btnModeBoth = document.getElementById('btn-mode-both');
        const btnReselectPpt = document.getElementById('btn-reselect-ppt');
        const modeBadge = document.getElementById('admin-mode-badge');

        function getAdminCredentials() {
            const keyEl = document.getElementById('admin-key');
            const quizEl = document.getElementById('quiz-id');
            let keyVal = keyEl ? keyEl.value.trim() : '';
            let quizVal = quizEl ? quizEl.value.trim() : '';
            if (!keyVal || !quizVal) {
                try {
                    const saved = JSON.parse(sessionStorage.getItem('live_admin_session') || '{}');
                    if (!keyVal && saved.adminKey) keyVal = saved.adminKey;
                    if (!quizVal && saved.quizId) quizVal = saved.quizId;
                } catch (e) {}
            }
            return { adminKey: keyVal, quizId: quizVal };
        }

        function getIdlePptTrack() {
            if (!idlePptStream) {
                const canvas = document.createElement('canvas');
                canvas.width = 1280;
                canvas.height = 720;
                idleCanvasCtx = canvas.getContext('2d', { alpha: false });
                idleCanvasCtx.fillStyle = '#0f172a';
                idleCanvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                idlePptStream = canvas.captureStream(30);
            }
            return idlePptStream.getVideoTracks()[0];
        }

        // Ensures a continuous WebRTC Opus Audio Track exists for every student connection
        function getStudioOpusTrack() {
            if (!adminAudioCtx) {
                adminAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (!studioOutDest) {
                studioOutDest = adminAudioCtx.createMediaStreamDestination();
                // Keep stream clock active with an inaudible zero-gain oscillator
                silentOsc = adminAudioCtx.createOscillator();
                const zeroGain = adminAudioCtx.createGain();
                zeroGain.gain.value = 0.0;
                silentOsc.connect(zeroGain);
                zeroGain.connect(studioOutDest);
                silentOsc.start();
            }
            return studioOutDest.stream.getAudioTracks()[0];
        }

        function getActiveCamTrack() {
            if (videoEnabled && camStream) {
                const track = camStream.getVideoTracks()[0];
                if (track && track.readyState === 'live') return track;
            }
            return getIdlePptTrack();
        }

        function getActivePptTrack() {
            if (screenStream) {
                const track = screenStream.getVideoTracks()[0];
                if (track && track.readyState === 'live') return track;
            }
            return getIdlePptTrack();
        }

        function optimizeVideoSender(sender, isPresentation) {
            if (!sender || typeof sender.getParameters !== 'function') return;
            try {
                const params = sender.getParameters();
                if (!params.encodings || params.encodings.length === 0) {
                    params.encodings = [{}];
                }
                params.degradationPreference = 'maintain-framerate';
                params.encodings[0].maxFramerate = 30;
                params.encodings[0].maxBitrate = isPresentation ? 2500000 : 900000;
                params.encodings[0].scaleResolutionDownBy = 1.0;
                params.encodings[0].priority = 'high';
                params.encodings[0].networkPriority = 'high';
                sender.setParameters(params).catch(() => {});
            } catch (e) {}
        }

        function optimizeAudioSender(sender) {
            if (!sender || typeof sender.getParameters !== 'function') return;
            try {
                const params = sender.getParameters();
                if (!params.encodings || params.encodings.length === 0) {
                    params.encodings = [{}];
                }
                params.encodings[0].maxBitrate = 96000;
                params.encodings[0].priority = 'high';
                params.encodings[0].networkPriority = 'high';
                sender.setParameters(params).catch(() => {});
            } catch (e) {}
        }

        // Inject Google Meet HD 96kbps Fullband Opus parameters into SDP
        function enhanceOpusSdp(sdp) {
            if (!sdp) return sdp;
            return sdp.replace(/a=fmtp:(\d+) minptime=10;useinbandfec=1/g, 'a=fmtp:$1 minptime=10;useinbandfec=1;usedtx=0;stereo=0;maxaveragebitrate=64000;cbr=1');
        }

        function hotSwapCameraTrack(newCamTrack) {
            if (newCamTrack && 'contentHint' in newCamTrack) {
                newCamTrack.contentHint = 'motion';
            }
            peerConnections.forEach((pc) => {
                if (pc._camSender) {
                    pc._camSender.replaceTrack(newCamTrack).then(() => {
                        optimizeVideoSender(pc._camSender, false);
                    }).catch(() => {});
                }
            });
        }

        function hotSwapPresentationTrack(newTrack) {
            if (newTrack && 'contentHint' in newTrack) {
                newTrack.contentHint = 'motion';
            }
            peerConnections.forEach((pc) => {
                if (pc._pptSender) {
                    pc._pptSender.replaceTrack(newTrack).then(() => {
                        optimizeVideoSender(pc._pptSender, true);
                    }).catch(() => {});
                }
            });
        }

        function updateModeConsoleUI() {
            const resetBtn = (btn) => {
                if (!btn) return;
                btn.style.background = '#475569';
                btn.style.borderColor = 'transparent';
            };
            resetBtn(btnModeQuestion);
            resetBtn(btnModePpt);
            resetBtn(btnModeBoth);

            if (broadcastMode === 'presentation') {
                btnModePpt.style.background = '#7c3aed';
                btnModePpt.style.borderColor = '#c4b5fd';
                modeBadge.textContent = '📌 Showing: Live Presentation (PPT)';
                modeBadge.style.color = '#c4b5fd';
            } else if (broadcastMode === 'both') {
                if (btnModeBoth) {
                    btnModeBoth.style.background = '#059669';
                    btnModeBoth.style.borderColor = '#6ee7b7';
                }
                modeBadge.textContent = '📌 Showing: PPT + Question Together';
                modeBadge.style.color = '#6ee7b7';
            } else {
                btnModeQuestion.style.background = '#2563eb';
                btnModeQuestion.style.borderColor = '#60a5fa';
                modeBadge.textContent = '📌 Showing: Question Card';
                modeBadge.style.color = '#60a5fa';
            }
            const hasLivePpt = screenStream && screenStream.getVideoTracks()[0] && screenStream.getVideoTracks()[0].readyState === 'live';
            btnReselectPpt.style.display = hasLivePpt ? 'inline-block' : 'none';
        }

        async function syncModeToServer() {
            const { adminKey, quizId } = getAdminCredentials();
            if (!adminKey || !quizId) return;
            await fetch('/api/live/rtc/admin/mode', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminKey, quizId, broadcastMode })
            }).catch(() => {});
        }

        // Pipeline 2: Dedicated PowerPoint Screen/Window Capture
        async function acquireScreenShareStream(forceNewPicker) {
            const hasLivePpt = screenStream && screenStream.getVideoTracks()[0] && screenStream.getVideoTracks()[0].readyState === 'live';
            if (hasLivePpt && !forceNewPicker) {
                return true;
            }
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: false
                });
                const screenTrack = screenStream.getVideoTracks()[0];
                if (screenTrack) {
                    if ('contentHint' in screenTrack) {
                        screenTrack.contentHint = 'motion';
                    }
                    if (typeof screenTrack.applyConstraints === 'function') {
                        screenTrack.applyConstraints({ frameRate: 30 }).catch(() => {});
                    }
                    hotSwapPresentationTrack(screenTrack);

                    screenTrack.onended = () => {
                        screenStream = null;
                        hotSwapPresentationTrack(getIdlePptTrack());
                        broadcastMode = 'question';
                        updateModeConsoleUI();
                        syncModeToServer();
                    };
                }
                return true;
            } catch (err) {
                alert('Window selection was cancelled or blocked: ' + (err.message || 'Please select a window to share.'));
                return false;
            }
        }

        btnModeQuestion.addEventListener('click', async () => {
            broadcastMode = 'question';
            updateModeConsoleUI();
            await syncModeToServer();
        });

        btnModePpt.addEventListener('click', async () => {
            const hasScreen = await acquireScreenShareStream(false);
            if (!hasScreen) return;

            const { adminKey, quizId } = getAdminCredentials();
            if (!adminKey || !quizId) {
                alert('Please enter your Admin Secret Key and create a Room first.');
                return;
            }

            broadcastMode = 'presentation';
            updateModeConsoleUI();

            if (!isBroadcasting) {
                await startOrUpdateBroadcast();
            } else {
                await syncModeToServer();
            }
        });

        if (btnModeBoth) {
            btnModeBoth.addEventListener('click', async () => {
                const hasScreen = await acquireScreenShareStream(false);
                if (!hasScreen) return;

                const { adminKey, quizId } = getAdminCredentials();
                if (!adminKey || !quizId) {
                    alert('Please enter your Admin Secret Key and create a Room first.');
                    return;
                }

                broadcastMode = 'both';
                updateModeConsoleUI();

                if (!isBroadcasting) {
                    await startOrUpdateBroadcast();
                } else {
                    await syncModeToServer();
                }
            });
        }

        btnReselectPpt.addEventListener('click', async () => {
            const switched = await acquireScreenShareStream(true);
            if (switched) {
                if (broadcastMode === 'question') broadcastMode = 'presentation';
                updateModeConsoleUI();
                await syncModeToServer();
            }
        });

        (function makeDraggable(boxEl, handleEl) {
            let isDragging = false, startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

            handleEl.addEventListener('pointerdown', (e) => {
                isDragging = true;
                handleEl.setPointerCapture(e.pointerId);
                const rect = boxEl.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = rect.left;
                initialTop = rect.top;
                boxEl.style.bottom = 'auto';
                boxEl.style.right = 'auto';
                boxEl.style.left = initialLeft + 'px';
                boxEl.style.top = initialTop + 'px';
            });

            handleEl.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const maxLeft = window.innerWidth - boxEl.offsetWidth;
                const maxTop = window.innerHeight - boxEl.offsetHeight;
                boxEl.style.left = Math.max(0, Math.min(maxLeft, initialLeft + dx)) + 'px';
                boxEl.style.top = Math.max(0, Math.min(maxTop, initialTop + dy)) + 'px';
            });

            handleEl.addEventListener('pointerup', (e) => {
                isDragging = false;
                handleEl.releasePointerCapture(e.pointerId);
            });
        })(pipBox, document.getElementById('admin-pip-header'));

        // Linear-interpolated anti-aliasing downsampler with soft-limiter (Unity gain: no room reverb boost)
        function downsampleClean(float32Arr, inputRate, outputRate) {
        if (inputRate === outputRate) {
                const out = new Int16Array(float32Arr.length);
                for (let i = 0; i < float32Arr.length; i++) {
                    let s = Math.max(-1, Math.min(1, float32Arr[i]));
                    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                return out;
            }
            const ratio = inputRate / outputRate;
            const newLen = Math.round(float32Arr.length / ratio);
            const result = new Int16Array(newLen);

            for (let i = 0; i < newLen; i++) {
                const pos = i * ratio;
                const idx = Math.floor(pos);
                const frac = pos - idx;
                const s0 = float32Arr[idx] || 0;
                const s1 = float32Arr[Math.min(float32Arr.length - 1, idx + 1)] || s0;
                let sample = s0 + frac * (s1 - s0);
                sample = Math.max(-1, Math.min(1, sample));
                result[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            }
            return result;
        }   

        function int16ToBase64(int16Arr) {
            const bytes = new Uint8Array(int16Arr.buffer, int16Arr.byteOffset, int16Arr.byteLength);
            let binary = '';
            const chunkSize = 4096;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }
document.addEventListener('pointerdown', () => {
            if (!adminAudioCtx) {
                adminAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (adminAudioCtx.state === 'suspended') {
                adminAudioCtx.resume().catch(() => {});
            }
        });
        // Jitter-Free Crossfaded Student Voice Playback
        const studentLastSample = new Map();

       function playIncomingPcmBase64(b64Str, sampleRate, studentName) {
            if (!adminAudioCtx) {
                adminAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (adminAudioCtx.state === 'suspended') {
                adminAudioCtx.resume().catch(() => {});
            }

            const raw = atob(b64Str);
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            const int16 = new Int16Array(bytes.buffer);
            if (int16.length === 0) return;

            const audioBuffer = adminAudioCtx.createBuffer(1, int16.length, sampleRate || TARGET_SAMPLE_RATE);
            const channel = audioBuffer.getChannelData(0);

            const now = adminAudioCtx.currentTime;
            const callerKey = studentName || 'default';
            let nextPlayTime = studentPlayTimes.get(callerKey) || 0;
            const lastEndMs = studentLastChunkEnd.get(callerKey) || 0;
            const isUnderrun = (nextPlayTime < now);
            const isNewTalkSpurt = isUnderrun && (Date.now() - lastEndMs > 600);
            const prevSample = isNewTalkSpurt ? 0 : (studentLastSample.get(callerKey) || 0);

            // 16-sample (1ms) sample-level stitch prevents boundary clicks
            const stitchLen = Math.min(16, int16.length);
            for (let i = 0; i < int16.length; i++) {
                let val = int16[i] / 32768.0;
                if (i < stitchLen) {
                    const alpha = i / stitchLen;
                    val = prevSample + alpha * (val - prevSample);
                }
                channel[i] = val;
            }
            studentLastSample.set(callerKey, channel[int16.length - 1]);

            if (isNewTalkSpurt) {
                nextPlayTime = now + 0.28; // 280ms initial cushion covers >2 full 130ms poll cycles
            } else if (isUnderrun) {
                nextPlayTime = now + 0.16; // 160ms cushion (>130ms poll interval) prevents chain-reaction underruns!
            } else if (nextPlayTime - now > 2.5) {
                const existingNodes = studentActiveNodes.get(callerKey) || [];
                existingNodes.forEach(n => { try { n.stop(); } catch (e) {} });
                studentActiveNodes.set(callerKey, []);
                nextPlayTime = now + 0.22;
            }

            const src = adminAudioCtx.createBufferSource();
            src.buffer = audioBuffer;
            src.connect(adminAudioCtx.destination);

            const callerNodes = studentActiveNodes.get(callerKey) || [];
            callerNodes.push(src);
            studentActiveNodes.set(callerKey, callerNodes);
            src.onended = () => {
                const arr = studentActiveNodes.get(callerKey);
                if (arr) {
                    const idx = arr.indexOf(src);
                    if (idx !== -1) arr.splice(idx, 1);
                }
            };

            src.start(nextPlayTime);
            nextPlayTime += audioBuffer.duration;
            studentPlayTimes.set(callerKey, nextPlayTime);

            const remainingPlayMs = Math.max(0, (nextPlayTime - now) * 1000);
            studentLastChunkEnd.set(callerKey, Date.now() + remainingPlayMs);
            lastStudentAudioPlayedMs = Date.now() + remainingPlayMs + 250;
        }

        // Pipeline 1: Dedicated Camera Stream Setup
        async function syncCameraPipeline() {
            if (!videoEnabled) {
                if (camStream) {
                    camStream.getTracks().forEach(t => t.stop());
                    camStream = null;
                }
                selfVideo.srcObject = null;
                hotSwapCameraTrack(getIdlePptTrack());
                return true;
            }

            const hasLiveCam = camStream && camStream.getVideoTracks()[0] && camStream.getVideoTracks()[0].readyState === 'live';
            if (!hasLiveCam) {
                try {
                    camStream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 640 }, height: { ideal: 360 }, frameRate: { ideal: 30 } },
                        audio: false
                    });
                    selfVideo.muted = true;
                    selfVideo.volume = 0;
                    selfVideo.srcObject = camStream;
                    await selfVideo.play().catch(() => {});
                } catch (err) {
                    alert('Camera error: ' + err.message);
                    videoEnabled = false;
                    return false;
                }
            }
            const liveCamTrack = camStream.getVideoTracks()[0];
            if (liveCamTrack) {
                hotSwapCameraTrack(liveCamTrack);
            }
            return true;
        }

        // Pipeline 3: Google Meet-Grade 5-Stage Noise-Cancelled Audio Pipeline
        async function syncAudioPipeline() {
          if (!adminAudioCtx) adminAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (adminAudioCtx.state === 'suspended') await adminAudioCtx.resume();
            getStudioOpusTrack();

            if (!audioEnabled) {
                if (micProcessor) { try { micProcessor.disconnect(); } catch (e) {} micProcessor = null; }
                if (micSource) { try { micSource.disconnect(); } catch (e) {} micSource = null; }
                if (silentSink) { try { silentSink.disconnect(); } catch (e) {} silentSink = null; }
                if (micStream) {
                    micStream.getTracks().forEach(t => t.stop());
                    micStream = null;
                }
                pendingPcmSamples = [];
                preRollBuffers = [];
                currentGateGain = 0.0;
                return true;
            }

            const hasLiveMic = micStream && micStream.getAudioTracks()[0] && micStream.getAudioTracks()[0].readyState === 'live';
            if (!hasLiveMic) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({
                        video: false,
                        audio: {
                            echoCancellation: { ideal: true },
                            noiseSuppression: { ideal: true },
                            voiceIsolation: { ideal: true },
                            autoGainControl: false,
                            channelCount: { ideal: 1 },
                            googEchoCancellation: true,
                            googAutoGainControl: false,
                            googNoiseSuppression: true,
                            googExperimentalNoiseSuppression: true,
                            googHighpassFilter: true
                        }
                    });

                    if (micProcessor) { try { micProcessor.disconnect(); } catch (e) {} }
                    if (micSource) { try { micSource.disconnect(); } catch (e) {} }
                    if (silentSink) { try { silentSink.disconnect(); } catch (e) {} }

                    micSource = adminAudioCtx.createMediaStreamSource(micStream);

                    // Stage 1: 50Hz AC Mains Hum Notch Filter
                    const humNotch = adminAudioCtx.createBiquadFilter();
                    humNotch.type = 'notch';
                    humNotch.frequency.value = 50;
                    humNotch.Q.value = 10.0;

                    // Stage 2: 240Hz High-Pass Filter (Cuts 150-240Hz close-mic bass boom that makes voice sound deep)
                    const hpFilter = adminAudioCtx.createBiquadFilter();
                    hpFilter.type = 'highpass';
                    hpFilter.frequency.value = 240;
                    hpFilter.Q.value = 0.707;

                    // Stage 3: 9000Hz Low-Pass Filter (Preserves full natural vocal brightness & upper harmonics)
                    const lpFilter = adminAudioCtx.createBiquadFilter();
                    lpFilter.type = 'lowpass';
                    lpFilter.frequency.value = 9000;
                    lpFilter.Q.value = 0.707;

                    // Stage 4: High-Shelf Crispness Filter (+4.5dB above 2800Hz restores natural voice timbre)
                    const presenceFilter = adminAudioCtx.createBiquadFilter();
                    presenceFilter.type = 'highshelf';
                    presenceFilter.frequency.value = 2800;
                    presenceFilter.gain.value = 4.5;

                    // Stage 5: Transparent Leveller (No bass-thickening compression)
                    const compressor = adminAudioCtx.createDynamicsCompressor();
                    compressor.threshold.value = -16;
                    compressor.knee.value = 10;
                    compressor.ratio.value = 2.0;
                    compressor.attack.value = 0.005;
                    compressor.release.value = 0.12;

                    // Native C++ Thread Gate Node for WebRTC Opus (Zero main-thread frame drops!)
                    const studioGateNode = adminAudioCtx.createGain();
                    studioGateNode.gain.value = 0.0;

                    micProcessor = adminAudioCtx.createScriptProcessor(2048, 1, 1);
                    silentSink = adminAudioCtx.createGain();
                    silentSink.gain.value = 0;

                    let wasSpeaking = false;
                    let speechHoldUntil = 0;
                    noiseFloorRms = 0.0025;

                    micProcessor.onaudioprocess = (e) => {
                        if (!isBroadcasting || !audioEnabled) {
                            studioGateNode.gain.setTargetAtTime(0.0, adminAudioCtx.currentTime, 0.02);
                            preRollBuffers = [];
                            wasSpeaking = false;
                            currentGateGain = 0.0;
                            return;
                        }

                        const input = e.inputBuffer.getChannelData(0);
                        let sumSq = 0;
                        for (let i = 0; i < input.length; i++) sumSq += input[i] * input[i];
                        const rms = Math.sqrt(sumSq / input.length);
                        const nowMs = Date.now();

                        // Track background noise floor during silence
                        if (!wasSpeaking || rms < noiseFloorRms * 1.5) {
                            noiseFloorRms = (0.95 * noiseFloorRms) + (0.05 * Math.min(0.01, Math.max(0.0008, rms)));
                        }

                        // Close-talk proximity threshold (ignores far-field noise; 900ms hold keeps sentences unbroken)
                        const openThreshold = Math.max(0.0065, noiseFloorRms * 2.6);
                        const continueThreshold = Math.max(0.0035, noiseFloorRms * 1.5);

                        if (rms > openThreshold || (wasSpeaking && rms > continueThreshold)) {
                            speechHoldUntil = nowMs + 900;
                        }

                        const isGateOpen = (nowMs < speechHoldUntil);
                        const targetGain = isGateOpen ? 1.0 : 0.0;

                        // Smoothly open/close the native WebRTC Opus hardware gate node
                        studioGateNode.gain.setTargetAtTime(targetGain, adminAudioCtx.currentTime, isGateOpen ? 0.012 : 0.06);

                        const gatedFloat = new Float32Array(input.length);
                        for (let i = 0; i < input.length; i++) {
                            currentGateGain += (targetGain - currentGateGain) * (isGateOpen ? 0.08 : 0.005);
                            gatedFloat[i] = Math.tanh(input[i] * currentGateGain);
                        }

                        const downsampled = downsampleClean(gatedFloat, adminAudioCtx.sampleRate, TARGET_SAMPLE_RATE);

                        if (isGateOpen) {
                            if (!wasSpeaking && preRollBuffers.length > 0) {
                                for (let b = 0; b < preRollBuffers.length; b++) {
                                    const pre = preRollBuffers[b];
                                    for (let j = 0; j < pre.length; j++) pendingPcmSamples.push(pre[j]);
                                }
                                preRollBuffers = [];
                            }
                            wasSpeaking = true;
                            for (let i = 0; i < downsampled.length; i++) pendingPcmSamples.push(downsampled[i]);
                            if (pendingPcmSamples.length > 24000) pendingPcmSamples = pendingPcmSamples.slice(-24000);
                        } else {
                            wasSpeaking = false;
                            preRollBuffers.push(downsampled);
                            if (preRollBuffers.length > 4) preRollBuffers.shift();
                        }
                    };

                    micSource.connect(humNotch);
                    humNotch.connect(hpFilter);
                    hpFilter.connect(lpFilter);
                    hpFilter.connect(presenceFilter);
                    presenceFilter.connect(compressor);

                    // Direct C++ WebAudio path for WebRTC Opus
                    compressor.connect(studioGateNode);
                    studioGateNode.connect(studioOutDest);

                    // Parallel path for PCM fallback buffer
                    compressor.connect(micProcessor);
                    micProcessor.connect(silentSink);
                    silentSink.connect(adminAudioCtx.destination);
                } catch (err) {
                    alert('Microphone error: ' + err.message);
                    audioEnabled = false;
                    return false;
                }
            }
            return true;
        }

        function waitForIce(pc, maxTimeout = 600) {
            return new Promise(resolve => {
                if (pc.iceGatheringState === 'complete') return resolve();
                let resolved = false;
                let quickTimer = null;
                const done = () => {
                    if (resolved) return;
                    resolved = true;
                    clearTimeout(maxTimer);
                    if (quickTimer) clearTimeout(quickTimer);
                    resolve();
                };
                const maxTimer = setTimeout(done, maxTimeout);
                pc.addEventListener('icecandidate', (e) => {
                    if (!e.candidate) {
                        done();
                    } else if (e.candidate.candidate && (e.candidate.candidate.includes('srflx') || e.candidate.candidate.includes('host'))) {
                        if (!quickTimer) quickTimer = setTimeout(done, 120);
                    }
                });
                pc.addEventListener('icegatheringstatechange', () => {
                    if (pc.iceGatheringState === 'complete') done();
                });
            });
        }

        async function handleStudentOffer(studentName, offer, offerId, adminKey, quizId) {
            if (peerConnections.has(studentName)) {
                try { peerConnections.get(studentName).close(); } catch (e) {}
            }

            const pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
                iceCandidatePoolSize: 4
            });
            peerConnections.set(studentName, pc);

            await pc.setRemoteDescription(new RTCSessionDescription(offer));

            const camTrack = getActiveCamTrack();
            const pptTrack = getActivePptTrack();
            const opusTrack = getStudioOpusTrack();

            if (camTrack && 'contentHint' in camTrack) camTrack.contentHint = 'motion';
            if (pptTrack && 'contentHint' in pptTrack) pptTrack.contentHint = 'motion';

            pc._camSender = pc.addTrack(camTrack, camStream || idlePptStream);
            pc._pptSender = pc.addTrack(pptTrack, screenStream || idlePptStream);
            if (opusTrack && studioOutDest) {
                pc._audioSender = pc.addTrack(opusTrack, studioOutDest.stream);
                optimizeAudioSender(pc._audioSender);
            }

            optimizeVideoSender(pc._camSender, false);
            optimizeVideoSender(pc._pptSender, true);

            const rawAnswer = await pc.createAnswer();
            const enhancedAnswer = {
                type: rawAnswer.type,
                sdp: enhanceOpusSdp(rawAnswer.sdp)
            };
            await pc.setLocalDescription(enhancedAnswer);
            await waitForIce(pc, 600);

            await fetch('/api/live/rtc/admin/webrtc-answer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminKey, quizId, studentName, answer: pc.localDescription, offerId })
            });
        }

        async function startOrUpdateBroadcast() {
            const { adminKey, quizId } = getAdminCredentials();
            if (!adminKey || !quizId) {
                alert('Please enter your Admin Secret Key and create a Room first.');
                return false;
            }
            try {
                await syncCameraPipeline();
                await syncAudioPipeline();
                pipBox.style.display = videoEnabled ? 'flex' : 'none';
                btnStop.style.display = 'inline-block';

                await fetch('/api/live/rtc/admin/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey, quizId, active: true, videoEnabled, audioEnabled, broadcastMode })
                });

                if (!isBroadcasting) {
                    isBroadcasting = true;
                    pendingPcmSamples = [];
                    preRollBuffers = [];
                    startUnthrottledPushWorker();
                }
                return true;
            } catch (err) {
                alert('Broadcast error: ' + err.message);
                return false;
            }
        }

        async function executeAdminPushTick() {
            if (!isBroadcasting || isPushing) return;
            const { adminKey, quizId } = getAdminCredentials();
            if (!adminKey || !quizId) return;

            if (idleCanvasCtx) {
                idleCanvasCtx.fillStyle = '#0f172a';
                idleCanvasCtx.fillRect(0, 0, 8, 8);
            }

            if (audioEnabled) {
                try { localStorage.setItem('pp_admin_mic_same_pc', String(Date.now())); } catch (e) {}
            } else {
                try { localStorage.removeItem('pp_admin_mic_same_pc'); } catch (e) {}
            }

            isPushing = true;
            try {
                let audioChunkB64 = null;
                if (audioEnabled && pendingPcmSamples.length >= 1600) {
                    const int16 = new Int16Array(pendingPcmSamples);
                    pendingPcmSamples = [];
                    audioChunkB64 = int16ToBase64(int16);
                }

                if (Date.now() - lastHeartbeatAt > 4000) {
                    lastHeartbeatAt = Date.now();
                    fetch(`/api/live/admin/dashboard?adminKey=${encodeURIComponent(adminKey)}&quizId=${encodeURIComponent(quizId)}`).catch(() => {});
                }

                const res = await fetch('/api/live/rtc/admin/push', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        adminKey,
                        quizId,
                        videoEnabled,
                        audioEnabled,
                        broadcastMode,
                        audioChunk: audioChunkB64,
                        rate: TARGET_SAMPLE_RATE,
                        afterStudentSeq: lastStudentSeq
                    })
                });

                const data = await res.json();
                if (!isBroadcasting) {
                    resetCallerBadge();
                    return;
                }
                if (data && data.success) {
                    if (data.activeCallers && data.activeCallers.length > 0) {
                        callerBadge.textContent = `🟢 Student Speaking: ${data.activeCallers.join(', ')}`;
                        callerBadge.classList.add('calling');
                    } else {
                        callerBadge.textContent = '🎧 No active student calls';
                        callerBadge.classList.remove('calling');
                    }

                    if (Array.isArray(data.pendingOffers)) {
                        data.pendingOffers.forEach(item => {
                            const offerLockKey = `${item.name}_${item.offerId || ''}`;
                            if (!answeringStudents.has(offerLockKey)) {
                                answeringStudents.add(offerLockKey);
                                handleStudentOffer(item.name, item.offer, item.offerId, adminKey, quizId).finally(() => {
                                    answeringStudents.delete(offerLockKey);
                                });
                            }
                        });
                    }

                    if (Array.isArray(data.studentAudioChunks) && data.studentAudioChunks.length > 0) {
                        data.studentAudioChunks.forEach(item => {
                            if (item.seq > lastStudentSeq) {
                                lastStudentSeq = item.seq;
                                playIncomingPcmBase64(item.pcm, item.rate, item.studentName);
                            }
                        });
                    } else if (data.latestStudentSeq && lastStudentSeq === 0) {
                        lastStudentSeq = data.latestStudentSeq;
                    }
                }
            } catch (e) {
            } finally {
                isPushing = false;
            }
        }

        function startUnthrottledPushWorker() {
            if (pushWorker) {
                try { pushWorker.terminate(); } catch (e) {}
                pushWorker = null;
            }
            try {
                const workerCode = `
                    let t = null;
                    self.onmessage = function(e) {
                        if (e.data === 'start') {
                            if (t) clearInterval(t);
                            t = setInterval(() => self.postMessage('tick'), 130);
                        } else if (e.data === 'stop') {
                            if (t) clearInterval(t);
                            t = null;
                        }
                    };
                `;
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                pushWorker = new Worker(URL.createObjectURL(blob));
                pushWorker.onmessage = executeAdminPushTick;
                pushWorker.postMessage('start');
            } catch (err) {
                pushWorker = {
                    _id: setInterval(executeAdminPushTick, 130),
                    terminate() { clearInterval(this._id); }
                };
            }
        }

        function updateButtonsUI() {
            btnVideo.textContent = videoEnabled ? '📹 Video: ON' : '📹 Video: OFF';
            btnVideo.classList.toggle('active-cam', videoEnabled);
            btnAudio.textContent = audioEnabled ? '🎙️ Audio: ON' : '🎙️ Audio: OFF';
            btnAudio.classList.toggle('active-mic', audioEnabled);
        }

        function stopAllStudentAudioNodes(targetStudent = null) {
            if (targetStudent) {
                const nodes = studentActiveNodes.get(targetStudent) || [];
                nodes.forEach(n => { try { n.stop(); } catch (e) {} });
                studentActiveNodes.delete(targetStudent);
                studentPlayTimes.delete(targetStudent);
                studentLastChunkEnd.delete(targetStudent);
                studentLastSample.delete(targetStudent);
            } else {
                studentActiveNodes.forEach(nodes => {
                    nodes.forEach(n => { try { n.stop(); } catch (e) {} });
                });
                studentActiveNodes.clear();
                studentPlayTimes.clear();
                studentLastChunkEnd.clear();
                studentLastSample.clear();
            }
        }

        function resetCallerBadge() {
            callerBadge.textContent = '🎧 No active student calls';
            callerBadge.classList.remove('calling');
        }

        // Exposed so admin-live.js can instantly silence & remove a muted/kicked student from the badge
        window.cutStudentAudioImmediately = function(studentName) {
            stopAllStudentAudioNodes(studentName);
            if (!callerBadge) return;
            const currentText = callerBadge.textContent || '';
            if (currentText.includes('Student Speaking:')) {
                const rawList = currentText.replace(/^.*Student Speaking:\s*/i, '');
                const remaining = rawList.split(',').map(s => s.trim()).filter(s => s && s !== studentName);
                if (remaining.length > 0 && isBroadcasting) {
                    callerBadge.textContent = `🟢 Student Speaking: ${remaining.join(', ')}`;
                    callerBadge.classList.add('calling');
                } else {
                    resetCallerBadge();
                }
            }
        };

        async function handleStreamToggle() {
            await startOrUpdateBroadcast();
            updateButtonsUI();
        }

        btnVideo.addEventListener('click', async () => {
            videoEnabled = !videoEnabled;
            await handleStreamToggle();
        });

        btnAudio.addEventListener('click', async () => {
            audioEnabled = !audioEnabled;
            await handleStreamToggle();
        });

        btnStop.addEventListener('click', async () => {
            const { adminKey, quizId } = getAdminCredentials();
            isBroadcasting = false;
            videoEnabled = false;
            audioEnabled = false;
            broadcastMode = 'question';
            pendingPcmSamples = [];
            preRollBuffers = [];
            stopAllStudentAudioNodes();
            try { localStorage.removeItem('pp_admin_mic_same_pc'); } catch (e) {}

            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            if (camStream) {
                camStream.getTracks().forEach(t => t.stop());
                camStream = null;
            }
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
            selfVideo.srcObject = null;

            updateButtonsUI();
            updateModeConsoleUI();
            pipBox.style.display = 'none';
            btnStop.style.display = 'none';
            resetCallerBadge();

            if (pushWorker) {
                try { pushWorker.terminate(); } catch (e) {}
                pushWorker = null;
            }

            peerConnections.forEach(pc => { try { pc.close(); } catch (e) {} });
            peerConnections.clear();
            answeringStudents.clear();

            if (micProcessor) { try { micProcessor.disconnect(); } catch (e) {} micProcessor = null; }
            if (micSource) { try { micSource.disconnect(); } catch (e) {} micSource = null; }

            await fetch('/api/live/rtc/admin/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminKey, quizId, active: false, videoEnabled: false, audioEnabled: false, broadcastMode: 'question' })
            }).catch(() => {});
        });
    })();
